:root{
  --ac1:#00587F; --ac2:#0A7BA8; --ac3:#189CCC; --ac4:#5CC2E8; --ac5:#B4E8FA;
  --deep:#0C5F92; --ac-rgb:24,156,204;

  --papel:#F7FAFC; --card:#FFFFFF; --papel2:#EDF3F8; --papel3:#E3ECF3;
  --tinta:13,26,38;

  --i92:rgba(var(--tinta),.92); --i72:rgba(var(--tinta),.72); --i62:rgba(var(--tinta),.62);
  --i34:rgba(var(--tinta),.34); --i14:rgba(var(--tinta),.14); --i08:rgba(var(--tinta),.08);
  --i04:rgba(var(--tinta),.04);

  --veu:rgba(var(--ac-rgb),.10); --veu2:rgba(var(--ac-rgb),.05);

  /* semânticos: independentes do acento, para estado nunca competir com marca */
  --ok:#0C8A5C;  --ok-bg:rgba(12,138,92,.11);   --ok-fg:#086543;
  --al:#B0741A;  --al-bg:rgba(176,116,26,.13);  --al-fg:#8A5A13;
  --bl:#B3382F;  --bl-bg:rgba(179,56,47,.11);   --bl-fg:#8E2B24;
  --ne:#8794A1;

  /* superfícies especiais tokenizadas para o tema escuro não quebrar */
  --escura:#0E2233;        /* barra utilitária, painel de schema */
  --escura2:#16324A;
  --escura-tx:rgba(255,255,255,.86);
  --escura-tx2:rgba(255,255,255,.5);
  --escura-li:rgba(255,255,255,.12);
  --toast-bg:rgba(13,26,38,.96); --toast-fg:#fff;
  --sobre:#fff;            /* texto sobre preenchimento de acento sólido */

  --s1:6px; --s2:12px; --s3:20px; --s4:32px; --s5:52px; --s6:80px;
  --r:14px; --r2:10px; --r3:7px; --pill:100px;
  --sh:0 1px 2px rgba(13,26,38,.04),0 10px 30px -22px rgba(13,26,38,.35);
  --sh2:0 2px 6px rgba(13,26,38,.05),0 26px 56px -34px rgba(13,26,38,.42);
  --sh3:0 4px 10px rgba(13,26,38,.06),0 40px 80px -40px rgba(13,26,38,.5);
  --e:cubic-bezier(.19,1,.22,1);
  --e2:cubic-bezier(.34,1.56,.64,1);

  --d:'Outfit',system-ui,sans-serif; --f:'Inter',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --xs:.75rem; --sm:.8125rem; --md:.9375rem; --lg:1.0625rem;
  --xl:1.35rem; --xxl:clamp(1.7rem,3vw,2.3rem); --hero:clamp(2.1rem,4.6vw,3.5rem);
}

/* tema escuro: só os tokens mudam. A tinta inverte e as superfícies
   descem; todas as derivações rgba() seguem junto sem tocar nos componentes. */
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ac1:#7FD4F5; --ac2:#5CC2E8; --ac3:#189CCC; --ac4:#2E8FB8; --ac5:#1D5C7C;
    --deep:#4FB6E0;
    --papel:#0A141E; --card:#101E2B; --papel2:#152634; --papel3:#1B2F40;
    --tinta:226,238,247;
    --veu:rgba(var(--ac-rgb),.16); --veu2:rgba(var(--ac-rgb),.09);
    --ok:#3FBF8B; --ok-bg:rgba(63,191,139,.14);  --ok-fg:#6EDCAC;
    --al:#D8A34A; --al-bg:rgba(216,163,74,.15);  --al-fg:#EFC078;
    --bl:#E0736A; --bl-bg:rgba(224,115,106,.14); --bl-fg:#F09A92;
    --escura:#081722; --escura2:#122B3D;
    --toast-bg:rgba(232,242,250,.96); --toast-fg:#0A141E;
    --sobre:#04121C;
    --sh:0 1px 2px rgba(0,0,0,.5),0 10px 30px -22px rgba(0,0,0,.8);
    --sh2:0 2px 6px rgba(0,0,0,.55),0 26px 56px -34px rgba(0,0,0,.85);
    --sh3:0 4px 10px rgba(0,0,0,.6),0 40px 80px -40px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ac1:#7FD4F5; --ac2:#5CC2E8; --ac3:#189CCC; --ac4:#2E8FB8; --ac5:#1D5C7C;
  --deep:#4FB6E0;
  --papel:#0A141E; --card:#101E2B; --papel2:#152634; --papel3:#1B2F40;
  --tinta:226,238,247;
  --veu:rgba(var(--ac-rgb),.16); --veu2:rgba(var(--ac-rgb),.09);
  --ok:#3FBF8B; --ok-bg:rgba(63,191,139,.14);  --ok-fg:#6EDCAC;
  --al:#D8A34A; --al-bg:rgba(216,163,74,.15);  --al-fg:#EFC078;
  --bl:#E0736A; --bl-bg:rgba(224,115,106,.14); --bl-fg:#F09A92;
  --escura:#081722; --escura2:#122B3D;
  --toast-bg:rgba(232,242,250,.96); --toast-fg:#0A141E;
  --sobre:#04121C;
  --sh:0 1px 2px rgba(0,0,0,.5),0 10px 30px -22px rgba(0,0,0,.8);
  --sh2:0 2px 6px rgba(0,0,0,.55),0 26px 56px -34px rgba(0,0,0,.85);
  --sh3:0 4px 10px rgba(0,0,0,.6),0 40px 80px -40px rgba(0,0,0,.9);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
/* A transição precisa ser em background-color, não no atalho background:
   o atalho carrega background-image e o navegador não interpola, então a
   troca de tema ficava presa na cor antiga. */
body{background-color:var(--papel);color:var(--i92);font-family:var(--f);font-size:18px;
  line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background-color .3s var(--e),color .3s var(--e)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3{font-family:var(--d);font-weight:700;letter-spacing:-.03em;line-height:1.08;
  text-wrap:balance}
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--ac3);outline-offset:2px;border-radius:5px}
::selection{background:var(--veu);color:var(--i92)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= TOPO ================= */
.topo{position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--papel) 86%,transparent);
  backdrop-filter:saturate(1.5) blur(12px);border-bottom:1px solid transparent;
  transition:border-color .25s var(--e),box-shadow .25s var(--e)}
.topo.stuck{border-color:var(--i08);box-shadow:0 10px 30px -28px rgba(0,0,0,.5)}
.tin{max-width:1180px;margin:0 auto;padding:13px clamp(16px,4vw,30px);
  display:flex;align-items:center;gap:var(--s3)}
.logo{display:flex;align-items:center;gap:8px}
.logo img.s{height:29px} .logo img.w{height:16px}
/* a logotipia é PNG escuro: no tema escuro ela é invertida para não sumir */
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .logo img.w{filter:brightness(0) invert(1) opacity(.92)}
}
:root[data-theme="dark"] .logo img.w{filter:brightness(0) invert(1) opacity(.92)}
.tnav{display:flex;gap:2px;margin-left:var(--s2)}
.tnav button{font-size:var(--sm);color:var(--i62);padding:7px 12px;border-radius:var(--r3);
  transition:color .16s var(--e),background .16s var(--e);position:relative}
@media(hover:hover){.tnav button:hover{color:var(--i92);background:var(--i04)}}
.tnav button[aria-current=page]{color:var(--ac1);background:var(--veu);font-weight:600}
.tdir{margin-left:auto;display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:var(--pill);display:grid;place-items:center;
  font-size:var(--xs);font-weight:700;color:#fff;
  background:linear-gradient(140deg,var(--ac3),var(--deep));flex:none}

/* botão de tema e de paleta de comandos, na barra utilitária */
.uic{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.09);
  border-radius:var(--r3);padding:6px 11px;color:inherit;font-size:var(--xs);font-weight:600;
  transition:background .16s var(--e)}
@media(hover:hover){.uic:hover{background:rgba(255,255,255,.17)}}
.uic kbd{font-family:var(--mono);font-size:.75rem;background:rgba(255,255,255,.16);
  border-radius:4px;padding:2px 5px;letter-spacing:.02em}
.uic .sun,.uic .moon{display:none}
:root[data-theme="dark"] .uic .sun{display:block}
:root[data-theme="light"] .uic .moon{display:block}
:root:not([data-theme]) .uic .moon{display:block}
@media(prefers-color-scheme:dark){:root:not([data-theme]) .uic .moon{display:none}
  :root:not([data-theme]) .uic .sun{display:block}}

/* ================= LAYOUT ================= */
.pg{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,30px) var(--s6)}

/* Item de grade não encolhe abaixo do próprio conteúdo: min-width vale
   auto por padrão. Com uma tabela rolável dentro, o min-content dela
   estoura a coluna e empurra a página inteira de lado no celular. */
.split>*,.tri>*,.cmp>*,.vagas>*,.cds>*,.kpis>*,.corpo{min-width:0}
.tabw{max-width:100%}

.view{display:none}
.view.on{display:block;animation:sobe .36s var(--e) both}
@keyframes sobe{from{opacity:0;transform:translateY(12px)}}

/* revelação escalonada por observador de rolagem */
/* Sem estado escondido aqui de propósito. O `.rv` só descreve COMO a
   revelação acontece; o estado inicial é aplicado por JS em revelar().
   Se o observer não rodar, ou o script quebrar, o conteúdo fica visível
   em vez de a página ficar em branco. */
.rv{transition:opacity .55s var(--e),transform .55s var(--e)}

/* ================= HERO ================= */
.hero{position:relative;padding:var(--s5) 0 var(--s4);overflow:hidden}
.malha{position:absolute;inset:-10% -20% auto;height:420px;z-index:0;pointer-events:none;
  opacity:.5;mask-image:radial-gradient(72% 62% at 52% 34%,#000 30%,transparent 78%)}
.hero>*:not(svg){position:relative;z-index:1}
.hero h1{font-size:var(--hero);max-width:15ch}
.hero h1 em{font-style:normal;color:var(--ac2)}
.hero p{max-width:52ch;color:var(--i72);margin-top:var(--s2);font-size:var(--lg)}
.selo{display:inline-flex;align-items:center;gap:8px;font-size:var(--xs);font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ac1);background:var(--veu);
  border-radius:var(--pill);padding:6px 14px;margin-bottom:var(--s3)}
.selo i{width:6px;height:6px;border-radius:50%;background:var(--ac3);animation:bate 2.6s infinite}
@keyframes bate{0%,100%{opacity:1}50%{opacity:.25}}

.buscador{display:flex;gap:8px;background:var(--card);border:1px solid var(--i08);
  border-radius:var(--r);padding:8px;box-shadow:var(--sh2);margin-top:var(--s4);
  max-width:760px;flex-wrap:wrap;transition:border-color .2s var(--e),box-shadow .2s var(--e)}
.buscador:focus-within{border-color:var(--ac4);box-shadow:var(--sh3)}
.bfield{display:flex;align-items:center;gap:9px;padding:9px 12px;flex:1 1 210px;min-width:0;
  border-radius:var(--r2)}
.bfield+.bfield{border-left:1px solid var(--i08)}
.bfield svg{color:var(--i34);flex:none}
.bfield input,.bfield select{border:0;outline:0;background:none;width:100%;font-size:var(--md)}
.bfield label{font-size:var(--xs);color:var(--i62);display:block;margin-bottom:-2px;font-weight:500}
.sugere{display:flex;gap:7px;flex-wrap:wrap;margin-top:var(--s3);align-items:center}
.sugere span{font-size:var(--xs);color:var(--i62)}
.sug{font-size:var(--xs);border:1px solid var(--i14);border-radius:var(--pill);padding:5px 12px;
  color:var(--i72);transition:border-color .16s var(--e),color .16s var(--e),
  background .16s var(--e),transform .13s var(--e)}
@media(hover:hover){.sug:hover{border-color:var(--ac4);color:var(--ac1);background:var(--veu2)}}
.sug:active{transform:scale(.95)}

/* ================= VAGAS ================= */
.barra{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin:var(--s5) 0 var(--s3);
  padding-bottom:var(--s2);border-bottom:1px solid var(--i08)}
.barra h2{font-size:var(--xl)}
.cont{font-size:var(--sm);color:var(--i62)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{font-size:var(--sm);border:1px solid var(--i14);border-radius:var(--pill);padding:6px 13px;
  color:var(--i72);transition:border-color .16s var(--e),background .16s var(--e),
  color .16s var(--e),transform .13s var(--e)}
@media(hover:hover){.chip:hover{border-color:var(--ac4)}}
.chip:active{transform:scale(.96)}
.chip[aria-pressed=true]{background:var(--ac1);border-color:var(--ac1);color:var(--sobre)}

/* ---- hero compacto para quem já entrou ---- */
.heroc{padding:var(--s5) 0 var(--s2)}
.heroc h1{font-size:var(--xxl)}
.heroc p{color:var(--i62);margin-top:6px;font-size:var(--md)}

/* ---- barra de filtros ---- */
.fbarra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:var(--s3)}
.filtro{position:relative}
.fbt{display:inline-flex;align-items:center;gap:7px;font-size:var(--sm);
  border:1px solid var(--i14);border-radius:var(--pill);padding:8px 14px;color:var(--i92);
  background:var(--card);white-space:nowrap;
  transition:border-color .16s var(--e),background .16s var(--e),color .16s var(--e)}
@media(hover:hover){.fbt:hover{border-color:var(--ac4)}}
.fbt svg{color:var(--i34);transition:transform .22s var(--e)}
.fbt.on{border-color:var(--ac3);color:var(--ac1);background:var(--veu2);font-weight:600}
.fbt.on svg{color:var(--ac2)}
.fbt i{font-style:normal;background:var(--ac1);color:var(--sobre);border-radius:var(--pill);
  min-width:19px;height:19px;display:grid;place-items:center;font-size:.75rem;font-weight:700}
.filtro.aberto .fbt{border-color:var(--ac3)}
.filtro.aberto .fbt svg:last-child{transform:rotate(180deg)}
.fordem{margin-left:auto}

.fpop{position:absolute;top:calc(100% + 6px);left:0;z-index:28;min-width:230px;
  background:var(--card);border:1px solid var(--i08);border-radius:var(--r2);
  box-shadow:var(--sh2);padding:6px;
  opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;visibility:hidden;
  transition:opacity .2s var(--e),transform .2s var(--e),visibility .2s;
  max-height:min(340px,60vh);overflow-y:auto}
.filtro.aberto .fpop{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.fordem .fpop{left:auto;right:0}
.fop{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r3);
  font-size:var(--sm);cursor:pointer;transition:background .14s var(--e)}
@media(hover:hover){.fop:hover{background:var(--veu2)}}
.fop input{accent-color:var(--ac3);width:16px;height:16px;flex:none}
.fop span{flex:1;min-width:0}
.fop b{font-size:var(--xs);color:var(--i62);font-variant-numeric:tabular-nums}
.fop.vazia{opacity:.45;cursor:not-allowed}
.flimpa{width:100%;text-align:left;padding:9px 10px;border-radius:var(--r3);
  font-size:var(--xs);color:var(--ac1);font-weight:600;border-top:1px solid var(--i08);
  margin-top:4px}
@media(hover:hover){.flimpa:hover{background:var(--veu2)}}

.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s2)}
.fchip{display:inline-flex;align-items:center;gap:7px;font-size:var(--xs);font-weight:600;
  background:var(--veu);color:var(--ac1);border-radius:var(--pill);padding:5px 11px;
  transition:background .16s var(--e)}
@media(hover:hover){.fchip:hover{background:rgba(var(--ac-rgb),.22)}}
.fchip span{opacity:.7;font-size:.85em}
.fchip.zerar{background:transparent;color:var(--i62);text-decoration:underline;
  text-underline-offset:2px}
.cont{font-size:var(--sm);color:var(--i62);margin-top:var(--s2)}

/* ---- lista em duas colunas: 31 cartões numa coluna só davam 5.500px ---- */
.vagas{display:grid;gap:var(--s2);grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}
@media(max-width:980px){.vagas{grid-template-columns:1fr}}
.vaga{background:var(--card);border:1px solid var(--i08);border-radius:var(--r);padding:var(--s3);
  display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:center;width:100%;
  text-align:left;position:relative;overflow:hidden;
  transition:transform .2s var(--e),box-shadow .2s var(--e),border-color .2s var(--e)}
/* trilho de acento que só aparece no hover: sinaliza alvo sem poluir o repouso */
.vaga::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--ac3),var(--deep));
  transform:scaleY(0);transform-origin:50% 0;transition:transform .3s var(--e)}
@media(hover:hover){.vaga:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--ac5)}
  .vaga:hover::before{transform:scaleY(1)}}
.vaga:active{transform:scale(.994)}
.vaga{padding:var(--s2) 16px}
.vaga h3{font-size:var(--lg);font-family:var(--d);letter-spacing:-.02em;margin:5px 0 7px}

/* linha de topo do card: empresa à esquerda, cobertura empurrada à direita */
.vtopo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vtopo b{font-size:var(--sm);font-weight:600;color:var(--i72)}
.vsetor{font-size:var(--xs);color:var(--i62)}
.vtopo .cob{margin-left:auto}

/* A faixa salarial e o segundo criterio de decisao e vinha com o mesmo peso
   de "ha 6 dias". Agora e a unica coisa em tinta cheia da linha. */
.vmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:var(--sm);color:var(--i62)}
.vmeta span{display:flex;align-items:center;gap:5px}
.vmeta svg{color:var(--i34);flex:none}
.vfaixa{color:var(--i92);font-weight:600}
.vaga.sel{border-color:var(--ac3);box-shadow:0 0 0 1px var(--ac3)}
.emp{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.emplogo{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.62rem;
  font-weight:700;color:#fff;flex:none}
.emp b{font-size:var(--sm);font-weight:600;color:var(--i72)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--sm);color:var(--i62);margin-top:9px}
.meta span{display:flex;align-items:center;gap:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.tag{font-size:var(--xs);border:1px solid var(--i14);border-radius:var(--pill);padding:3px 10px;
  color:var(--i72)}
.tag.hi{background:var(--veu);border-color:transparent;color:var(--ac1);font-weight:600}
/* Cobertura: glifo alem da cor. Antes, "0 de 3" e "3 de 5" saiam no mesmo
   verde de sucesso: o sinal mais rapido do card dizia o contrario do dado. */
.tag.cob{border-color:transparent;font-weight:600;display:inline-flex;align-items:center;gap:5px;
  white-space:nowrap}
.tag.cob i{font-style:normal;font-size:.9em;line-height:1}
.cob-tudo {background:var(--ok-bg); color:var(--ok-fg)}
.cob-parte{background:var(--veu);   color:var(--ac1)}
.cob-pouco{background:var(--i04);   color:var(--i62)}
.cob-falta{background:var(--bl-bg); color:var(--bl-fg)}

/* Link esticado: o card inteiro navega, mas o botão de comparar continua
   clicável por cima. Evita botão dentro de botão, que é HTML inválido. */
.vaga .stretch{position:absolute;inset:0;z-index:1;border-radius:var(--r);
  background:none;border:0;padding:0}
.vaga .conteudo{position:relative;z-index:0;min-width:0}
.vaga .vdir{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  gap:9px;justify-self:end}
.cmpbt{font-size:var(--xs);border:1px solid var(--i14);border-radius:var(--pill);padding:4px 11px;
  color:var(--i62);white-space:nowrap;
  transition:border-color .16s var(--e),color .16s var(--e),background .16s var(--e)}
@media(hover:hover){.cmpbt:hover{border-color:var(--ac4);color:var(--ac1)}}
.cmpbt.on{background:var(--ac1);border-color:var(--ac1);color:var(--sobre);font-weight:600}
@media(max-width:900px){.vaga .vdir{justify-self:start;flex-direction:row;align-items:center}}

/* ---- medidor de match: anel de nota + arco de confiança ---- */
.med{position:relative;width:66px;height:66px;flex:none;display:grid;place-items:center}
.med svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.med .tr{fill:none;stroke:var(--i08);stroke-width:6}
.med .pr{fill:none;stroke:var(--ac3);stroke-width:6;stroke-linecap:round;

/* cadeado quando não logado */

.gate h4{font-family:var(--d);font-size:var(--md);margin-bottom:6px}
.gate p{font-size:var(--sm);color:var(--i72);margin-bottom:var(--s2)}

/* ================= DETALHE ================= */
.volta{display:inline-flex;align-items:center;gap:7px;font-size:var(--sm);color:var(--i62);

@media(hover:hover){.volta:hover{color:var(--ac1);gap:11px}}
.split{display:grid;grid-template-columns:1fr 342px;gap:var(--s5);align-items:start}
.corpo h1{font-size:var(--xxl);max-width:20ch}
.corpo h4{font-size:var(--xs);letter-spacing:.12em;text-transform:uppercase;color:var(--i62);
  margin:var(--s4) 0 var(--s2);font-family:var(--f);font-weight:600}
.corpo p{color:var(--i72);font-size:var(--md);margin-bottom:var(--s2);max-width:64ch}

.box{background:var(--card);border:1px solid var(--i08);border-radius:var(--r);padding:var(--s3);

.linha:last-child{border:0}
.linha span{color:var(--i62)} .linha b{font-weight:600;text-align:right}

/* ---- dimensões com barra e confiança ---- */
.eixos{display:grid;gap:11px;margin-top:var(--s2)}
.eixo{display:grid;grid-template-columns:88px 1fr 34px;gap:10px;align-items:center;font-size:var(--xs)}

.porque{font-size:var(--xs);color:var(--i62);line-height:1.65;margin-top:var(--s2);
  padding-top:var(--s2);border-top:1px solid var(--i04)}

/* ---- barra de confiança fina, sob a nota ---- */
.cbar{height:3px;border-radius:2px;background:var(--i08);overflow:hidden;margin-top:5px}
.cbar i{display:block;height:100%;width:0;border-radius:2px;background:var(--ac5);

/* ================= EVIDÊNCIAS ================= */
.evs{display:grid;gap:7px;margin-top:var(--s2)}
.ev{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r3);

.ev code{display:block;font-family:var(--mono);font-size:.75rem;color:var(--i62);margin-top:3px;

.ev.gap{border-left-color:var(--al);background:var(--al-bg)}
.ev.gap .ei{background:var(--al)}
.ev.constraint{border-left-color:var(--bl);background:var(--bl-bg)}
.ev.constraint .ei{background:var(--bl)}

/* ================= PORTÃO DE POLÍTICA ================= */
.gt{display:inline-flex;align-items:center;gap:7px;font-size:var(--xs);font-weight:700;

.gt.allow{background:var(--ok-bg);color:var(--ok-fg)}
.gt.review{background:var(--al-bg);color:var(--al-fg)}

.gt.block{background:var(--bl-bg);color:var(--bl-fg)}
.gtbox{border:1px solid var(--i08);border-radius:var(--r2);padding:var(--s2) 14px;
  background:var(--papel2);margin-top:var(--s2)}
.gtbox ul{list-style:none;margin-top:9px;display:grid;gap:6px}
.gtbox li{font-size:var(--xs);color:var(--i72);line-height:1.55;padding-left:15px;position:relative}
.gtbox li::before{content:"";position:absolute;left:0;top:.5em;width:6px;height:1.5px;
  background:var(--i34);border-radius:1px}

/* ================= PROVENIÊNCIA ================= */
.prov{display:inline-flex;align-items:center;gap:6px;font-size:var(--xs);color:var(--i62);

.prov.user i,.prov.company i,.prov.curator i{background:var(--ok)}
.prov.conversation i{background:var(--al)}
.prov.document i{background:var(--ne)}

/* ================= RADAR DOS 14 EIXOS ================= */
.radarw{position:relative;display:grid;place-items:center;padding:var(--s2) 0}
.radar{width:100%;max-width:330px;height:auto;overflow:visible}
.radar .malhaR{fill:none;stroke:var(--i08);stroke-width:1}
.radar .spoke{stroke:var(--i08);stroke-width:1}
.radar .polC{fill:rgba(var(--ac-rgb),.20);stroke:var(--ac3);stroke-width:2;stroke-linejoin:round;
  transition:d .8s var(--e)}
.radar .polE{fill:none;stroke:var(--ac1);stroke-width:2;stroke-dasharray:4 3;stroke-linejoin:round}
.radar .lbl{font-size:8.6px;fill:var(--i62);font-family:var(--f);font-weight:500}
.radar .hit{fill:transparent;cursor:pointer}
.radar .hit:hover+.dotp,.radar .dotp.on{r:3.4}
.radar .dotp{fill:var(--ac3);r:2;transition:r .2s var(--e)}
.radar .dotp.fora{fill:var(--al)}
.radarleg{display:flex;gap:var(--s3);justify-content:center;flex-wrap:wrap;
  font-size:var(--xs);color:var(--i62);margin-top:var(--s1)}
.radarleg span{display:flex;align-items:center;gap:6px}
.radarleg i{width:14px;height:2px;border-radius:1px;background:var(--ac3)}
.radarleg i.e{background:var(--ac1);height:0;border-top:2px dashed var(--ac1)}
.radartip{min-height:2.6em;font-size:var(--xs);color:var(--i72);text-align:center;
  margin-top:var(--s1);line-height:1.55;max-width:40ch}

/* ================= BOTÕES ================= */
.btn{background:var(--ac1);color:var(--sobre);border-radius:var(--r2);padding:13px 20px;
  font-size:var(--md);font-weight:600;display:inline-flex;align-items:center;justify-content:center;
  gap:9px;transition:transform .13s var(--e),background .18s var(--e),opacity .18s var(--e),
  box-shadow .18s var(--e);position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
@media(hover:hover){.btn:hover{background:var(--deep);box-shadow:0 8px 20px -12px rgba(var(--ac-rgb),.7)}}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.w{width:100%}
.btn.g{background:var(--card);color:var(--i72);border:1px solid var(--i14);box-shadow:none}
@media(hover:hover){.btn.g:hover{background:var(--papel2);color:var(--i92);box-shadow:none}}
.btn.sm{padding:9px 14px;font-size:var(--sm)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(128,128,128,.35);
  border-top-color:currentColor;animation:gira .7s linear infinite;display:inline-block;flex:none}

/* ================= TRIAGEM ================= */
.tri{display:grid;grid-template-columns:1fr 372px;gap:var(--s4);align-items:start;
  padding-top:var(--s4)}
.conversa{background:var(--card);border:1px solid var(--i08);border-radius:var(--r);

.msgs{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2);flex:1;overflow-y:auto;
  max-height:430px;scroll-behavior:smooth}
.m{max-width:86%;font-size:var(--md);line-height:1.6;animation:msg .4s var(--e) both}

.m.bot{display:flex;gap:11px}
.m.bot .ava{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--veu);color:var(--ac2)}
.m.bot .txt{background:var(--papel2);border-radius:4px var(--r2) var(--r2) var(--r2);
  padding:11px 15px;color:var(--i92)}

.digita i:nth-child(2){animation-delay:.18s} .digita i:nth-child(3){animation-delay:.36s}
@keyframes pt{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.entrada{border-top:1px solid var(--i08);padding:var(--s3)}
.opcoes{display:flex;gap:8px;flex-wrap:wrap}
.op{border:1px solid var(--i14);border-radius:var(--pill);padding:9px 15px;font-size:var(--sm);

@media(hover:hover){.op:hover{border-color:var(--ac3);color:var(--ac1);background:var(--veu2)}}
.op:active{transform:scale(.96)}
.campoLivre{display:flex;gap:8px}
.campoLivre textarea{flex:1;border:1px solid var(--i14);border-radius:var(--r2);padding:11px 13px;
  font-size:var(--md);resize:none;outline:0;transition:border-color .16s var(--e);
  font-family:var(--f);min-height:76px;background:var(--card)}

/* ---- painel do schema ---- */
.schema{background:var(--escura);border-radius:var(--r);padding:var(--s3);position:sticky;top:82px;
  color:var(--escura-tx);box-shadow:var(--sh2);border:1px solid var(--escura-li)}

.vetor{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--escura-li);

/* ================= CANDIDATURAS ================= */
.cds{display:grid;gap:var(--s2);margin-top:var(--s3)}
.cd{background:var(--card);border:1px solid var(--i08);border-radius:var(--r);padding:var(--s3);
  box-shadow:var(--sh)}
.cdtop{display:flex;gap:var(--s3);align-items:flex-start;flex-wrap:wrap}
.trilha{display:flex;align-items:center;margin-top:var(--s3);gap:0}
.et{flex:1;text-align:center;position:relative;font-size:var(--xs);color:var(--i62)}
.et i{width:13px;height:13px;border-radius:50%;background:var(--i08);display:block;margin:0 auto 7px;
  border:2px solid var(--papel);box-shadow:0 0 0 1px var(--i14);transition:all .5s var(--e)}
.et::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--i08);
  z-index:-1;transition:background .5s var(--e)}
.et:first-child::before{display:none}
.et.done i{background:var(--ac3);box-shadow:0 0 0 1px var(--ac3)}
.et.done::before{background:var(--ac3)}
.et.now i{background:var(--card);box-shadow:0 0 0 2px var(--ac3),0 0 0 6px var(--veu)}
.et.done,.et.now{color:var(--i72);font-weight:600}
.trilhaw{position:relative;z-index:0}
.expect{font-size:var(--xs);color:var(--i62);margin-top:var(--s2);display:flex;align-items:center;gap:7px}

/* ================= EMPRESA ================= */
.wiz{display:flex;gap:var(--s2);margin:var(--s4) 0 var(--s3);flex-wrap:wrap}
.wz{display:flex;align-items:center;gap:9px;font-size:var(--sm);color:var(--i62);
  border:1px solid var(--i08);border-radius:var(--pill);padding:7px 15px;background:var(--card)}

  display:grid;place-items:center;font-size:var(--xs);font-weight:700}

.wz.ok b{background:var(--ok);color:var(--sobre)}
.wz.ok{color:var(--i72)}

.form{display:grid;gap:var(--s3);max-width:660px}
.fg label{display:block;font-size:var(--sm);font-weight:600;margin-bottom:6px}
.fg .hint{font-size:var(--xs);color:var(--i62);margin-bottom:8px;line-height:1.6}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid var(--i14);border-radius:var(--r2);
  padding:11px 13px;font-size:var(--md);outline:0;background:var(--card);
  transition:border-color .16s var(--e);font-family:var(--f)}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--ac3)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}

.slider{display:grid;gap:7px;padding:var(--s3) 0;border-bottom:1px solid var(--i04)}
.slider .top{display:flex;justify-content:space-between;font-size:var(--sm);gap:12px}
.slider .top b{font-weight:600} .slider .top span{color:var(--i62);font-size:var(--xs);text-align:right}
.slider input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;
  border-radius:3px;background:linear-gradient(90deg,var(--ac5),var(--ac3));outline:0}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
  border-radius:50%;background:var(--card);border:3px solid var(--ac2);cursor:grab;
  box-shadow:var(--sh);transition:transform .15s var(--e)}
.slider input[type=range]::-webkit-slider-thumb:active{transform:scale(1.18);cursor:grabbing}
.slider input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;
  background:var(--card);border:3px solid var(--ac2);cursor:grab}
.polos{display:flex;justify-content:space-between;font-size:var(--xs);color:var(--i62);gap:12px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:var(--s2);
  margin-top:var(--s3)}
.kpi{background:var(--card);border:1px solid var(--i08);border-radius:var(--r);padding:var(--s3);
  box-shadow:var(--sh)}
.kpi .l{font-size:var(--xs);letter-spacing:.06em;text-transform:uppercase;color:var(--i62)}
.kpi .n{font-family:var(--d);font-size:1.9rem;font-weight:700;letter-spacing:-.03em;margin-top:5px;
  font-variant-numeric:tabular-nums;line-height:1}
.kpi .d{font-size:var(--xs);color:var(--i62);margin-top:6px}
.kpi .d b{color:var(--ok)} .kpi .d b.dn{color:var(--al)}
.kpi .spark{margin-top:10px;display:block;width:100%;height:26px;overflow:visible}
.kpi .spark path{fill:none;stroke:var(--ac3);stroke-width:1.8;stroke-linecap:round;
  stroke-linejoin:round}
.kpi .spark .fill{fill:var(--veu);stroke:none}
.kpi .spark circle{fill:var(--ac3)}

.tabw{overflow-x:auto}
.tab{width:100%;border-collapse:collapse;font-size:var(--sm);min-width:560px}
.tab th{text-align:left;font-size:var(--xs);letter-spacing:.06em;text-transform:uppercase;
  color:var(--i62);font-weight:600;padding:10px var(--s3);background:var(--papel2);white-space:nowrap}
.tab td{padding:14px var(--s3);border-bottom:1px solid var(--i04)}
.tab tbody tr{cursor:pointer;transition:background .15s var(--e)}
@media(hover:hover){.tab tbody tr:hover{background:var(--veu2)}}
.tab tbody tr:last-child td{border:0}
/* pipeline da empresa: seletor de vaga, filtro por etapa e busca */
.selVaga{background:var(--card);border:1px solid var(--i14);border-radius:var(--r3);
  padding:7px 12px;font-size:var(--sm);font-weight:600;color:var(--i92);margin-left:12px}
.pipToolbar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s2)}
.pipToolbar .chips{margin:0}
.pipToolbar .chip small{color:inherit;opacity:.65;font-weight:400;margin-left:3px}
.pipToolbar input[type=search]{flex:1;min-width:180px;background:var(--card);
  border:1px solid var(--i14);border-radius:var(--pill);padding:8px 16px;font-size:var(--sm)}
.pipAcoes{display:flex;gap:5px;white-space:nowrap}
.pipAcoes .btn{padding:7px 9px}
.tab input[type=checkbox]{accent-color:var(--ac1);width:16px;height:16px}

.bloco{background:var(--card);border:1px solid var(--i08);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--sh);margin-top:var(--s3)}
.bloco>header{display:flex;align-items:center;gap:var(--s2);padding:var(--s3);flex-wrap:wrap}
.bloco>header h3{font-size:var(--md);font-family:var(--d)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--xs);font-weight:600;
  padding:4px 10px;border-radius:var(--pill);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pill.al{background:var(--al-bg);color:var(--al-fg)}
.pill.bl{background:var(--bl-bg);color:var(--bl-fg)}
.pill.ac{background:var(--veu);color:var(--ac1)}
.pill.n{background:var(--i04);color:var(--i62)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---- gráfico ---- */
.graf{padding:var(--s3);display:flex;align-items:flex-end;gap:9px;height:172px}
.gb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;
  height:100%}
.gb .col{width:100%;max-width:44px;border-radius:5px 5px 2px 2px;
  background:linear-gradient(180deg,var(--ac4),var(--ac2));height:0;
  transition:height .85s var(--e);position:relative}
.gb .col:hover::after{content:attr(data-v);position:absolute;top:-24px;left:50%;
  transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);font-size:var(--xs);
  padding:4px 8px;border-radius:4px;white-space:nowrap;z-index:2}
.gb small{font-size:var(--xs);color:var(--i62)}

/* ================= COMPARADOR ================= */
.cmp{display:grid;gap:var(--s2);grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  margin-top:var(--s3)}
.cmpc{background:var(--card);border:1px solid var(--i08);border-radius:var(--r);padding:var(--s3);
  box-shadow:var(--sh);display:grid;gap:var(--s2);align-content:start;
  animation:sobe .4s var(--e) both}
.cmpc.win{border-color:var(--ac3);box-shadow:0 0 0 1px var(--ac3),var(--sh2)}
.cmpc .cw{font-size:var(--xs);color:var(--ac1);font-weight:700;letter-spacing:.05em;
  text-transform:uppercase}
.cmpbar{position:sticky;bottom:0;z-index:25;background:var(--card);border:1px solid var(--i08);
  border-radius:var(--r);box-shadow:var(--sh3);padding:12px var(--s3);display:flex;
  align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3);
  animation:sobeB .35s var(--e2) both}
@keyframes sobeB{from{opacity:0;transform:translateY(16px)}}

/* ================= INSPETOR DE TRACE ================= */
.drw{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);
  border-left:1px solid var(--i08);box-shadow:var(--sh3);z-index:80;display:flex;

.drw>header{display:flex;align-items:center;gap:var(--s2);padding:var(--s3);

.scrim{position:fixed;inset:0;background:rgba(6,14,22,.5);backdrop-filter:blur(3px);

.mbox{background:var(--card);border-radius:var(--r);box-shadow:var(--sh3);width:min(432px,100%);
  padding:var(--s4);opacity:0;transform:translateY(14px) scale(.98);pointer-events:none;
  transition:opacity .3s var(--e),transform .3s var(--e);max-height:92dvh;overflow-y:auto;
  border:1px solid var(--i08)}

.mbox h2{font-size:var(--xl);margin-bottom:6px}
.mbox .sub{font-size:var(--sm);color:var(--i72);margin-bottom:var(--s3)}
.tabs{display:flex;background:var(--i04);border-radius:var(--r2);padding:3px;margin-bottom:var(--s3)}
.tabs button{flex:1;padding:9px;border-radius:var(--r3);font-size:var(--sm);font-weight:600;
  color:var(--i62);transition:background .2s var(--e),color .2s var(--e)}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ac1);box-shadow:var(--sh)}
.oauth{display:grid;gap:9px}
.ob{display:flex;align-items:center;justify-content:center;gap:11px;border:1px solid var(--i14);
  border-radius:var(--r2);padding:12px;font-size:var(--md);font-weight:600;background:var(--card);
  transition:background .16s var(--e),border-color .16s var(--e),transform .13s var(--e)}
@media(hover:hover){.ob:hover{background:var(--papel2);border-color:var(--i34)}}
.ob:active{transform:scale(.98)}
.ob.li{background:#0A66C2;border-color:#0A66C2;color:#fff}
@media(hover:hover){.ob.li:hover{background:#08528F;border-color:#08528F}}
.ou{display:flex;align-items:center;gap:12px;color:var(--i34);font-size:var(--xs);margin:var(--s3) 0}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--i08)}
.mini{font-size:var(--xs);color:var(--i62);line-height:1.65;margin-top:var(--s3)}

/* ======= tags ======= */
.tagin{border:1px solid var(--i14);border-radius:var(--r2);padding:9px;background:var(--card);
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;transition:border-color .16s var(--e)}
.tagin:focus-within{border-color:var(--ac3)}
.tagin input{border:0;outline:0;background:none;flex:1;min-width:130px;font-size:var(--sm);padding:4px}
.tk{display:inline-flex;align-items:center;gap:7px;background:var(--veu);color:var(--ac1);
  border-radius:var(--pill);padding:5px 7px 5px 12px;font-size:var(--sm);font-weight:600;
  animation:tkin .28s var(--e2) both}
@keyframes tkin{from{opacity:0;transform:scale(.85)}}
.tk button{color:var(--ac2);display:grid;place-items:center;width:18px;height:18px;
  border-radius:50%;flex:none;transition:background .15s var(--e)}
.tk .nvbt{background:rgba(var(--ac-rgb),.18);width:auto;height:20px;padding:0 9px;
  border-radius:var(--pill);font-size:var(--xs);font-weight:600}
@media(hover:hover){.tk button:hover{background:rgba(var(--ac-rgb),.22)}}
.sugt{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.sugt button{font-size:var(--xs);border:1px dashed var(--i14);border-radius:var(--pill);
  padding:5px 11px;color:var(--i62);transition:border-color .16s var(--e),color .16s var(--e),
  border-style .16s var(--e),transform .13s var(--e)}
@media(hover:hover){.sugt button:hover{border-style:solid;border-color:var(--ac4);color:var(--ac1)}}
.sugt button:active{transform:scale(.95)}
.grupoTag{padding:var(--s3) 0;border-bottom:1px solid var(--i04)}
.grupoTag>b{font-size:var(--sm);display:block;margin-bottom:4px}
.grupoTag>.hint{font-size:var(--xs);color:var(--i62);margin-bottom:9px;line-height:1.6}

/* ======= aviso de perfil no painel da vaga =======
   Mesma informação que o portão dá à empresa, dita como ação de quem lê:
   "confirme seu perfil", não "revisão humana". */
.acaoperfil{display:flex;gap:11px;align-items:flex-start;text-align:left;
  background:var(--al-bg);border:1px solid var(--al);border-radius:var(--r2);
  padding:12px 13px;margin-top:var(--s2)}
.acaoperfil .ic{width:26px;height:26px;border-radius:8px;background:var(--al);color:var(--sobre);
  display:grid;place-items:center;flex:none}
.acaoperfil b{font-family:var(--d);font-size:var(--sm);display:block}
.acaoperfil p{font-size:var(--xs);color:var(--i72);line-height:1.55;margin:3px 0 9px}
.acaoperfil .btn{width:100%}

/* ======= faixa de confirmação de perfil ======= */
.confirma{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;
  background:var(--al-bg);border:1px solid var(--al);border-radius:var(--r);padding:var(--s3);
  margin-top:var(--s3)}
.confirma .ic{width:38px;height:38px;border-radius:11px;background:var(--al);color:var(--sobre);
  display:grid;place-items:center;flex:none}
.confirma b{font-family:var(--d);font-size:var(--md);display:block}
.confirma p{font-size:var(--sm);color:var(--i72);margin-top:3px}

/* alinha a barra de confiança sob o rótulo da dimensão, na coluna da nota */
.cfw{margin:-4px 0 10px;padding-left:98px}
.envbt{align-self:flex-end}

/* ═══════════════════════════════════════════════════════════════════
   MOVIMENTO
   Regra que vale para tudo aqui: a animação serve para explicar uma
   relação, não para enfeitar. O radar cresce do centro porque distância
   ao centro é o que ele mede; as evidências entram em cascata porque são
   uma lista ordenada por peso; o anel preenche porque é uma fração.

   Nenhuma delas parte de um estado escondido no CSS base — todas usam
   `animation ... both` com o `from` no keyframe. Isso importa porque o
   bloco de prefers-reduced-motion no fim do arquivo mata `animation`, e
   um elemento com `opacity:0` de base ficaria invisível para sempre.
   ═══════════════════════════════════════════════════════════════════ */

@keyframes sobeSuave{from{opacity:0;transform:translateY(14px)}}
@keyframes aparece{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.82)}}

/* ---- entrada do hero: uma leitura conduzida, não tudo de uma vez ---- */
.hero>.selo     {animation:sobeSuave .5s var(--e) both .04s}
.hero>h1        {animation:sobeSuave .58s var(--e) both .12s}
.hero>p         {animation:sobeSuave .58s var(--e) both .2s}
.hero>.buscador {animation:sobeSuave .58s var(--e) both .28s}
.hero>.sugere   {animation:sobeSuave .58s var(--e) both .36s}

/* a malha de fundo respira devagar. 26s é longo de propósito: movimento
   perceptível numa tela de trabalho vira distração em dez minutos */
@keyframes deriva{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%    {transform:translate3d(-16px,9px,0) scale(1.04)}
}
.malha{animation:deriva 26s ease-in-out infinite;will-change:transform}

/* ---- radar: cresce do centro, e os pontos assentam em sequência ---- */
@keyframes radarAbre{from{opacity:0;transform:scale(.55)}}
.radar .polC,.radar .polE{transform-box:fill-box;transform-origin:center}
.radar .polE{animation:radarAbre .62s var(--e) both .1s}
.radar .polC{animation:radarAbre .7s var(--e) both .2s}
.radar .dotp{transform-box:fill-box;transform-origin:center;
  animation:pop .36s var(--e2) both;animation-delay:calc(.52s + var(--i,0) * .028s)}
.radar .malhaR,.radar .spoke{animation:aparece .5s var(--e) both}
.radar .lbl{animation:aparece .5s var(--e) both .45s}

/* ---- evidências em cascata: a ordem é a ordem de peso ---- */
.ev{animation:evin .42s var(--e) both;animation-delay:calc(var(--i,0) * .05s)}

/* ---- selo do portão: aparece como decisão, com peso ---- */
.gt{animation:pop .34s var(--e2) both}

/* ---- o medidor sobe junto com o card ---- */
.med{transition:transform .25s var(--e)}
@media(hover:hover){.vaga:hover .med{transform:translateY(-2px) scale(1.05)}}

/* ---- barra de abas: indicador que cresce sob a aba ativa ---- */
.tabbar button{position:relative}
.tabbar button::before{content:"";position:absolute;top:2px;left:50%;width:0;height:2.5px;
  border-radius:2px;background:var(--ac1);transform:translateX(-50%);
  transition:width .3s var(--e2)}
.tabbar button[aria-current=page]::before{width:22px}

/* ---- troca de conteúdo da lista sem corte seco ---- */
.vagas{animation:aparece .32s var(--e) both}

/* nada acima pode deixar rastro quando o sistema pede menos movimento */
@media(prefers-reduced-motion:reduce){
  .malha{animation:none}
  .radar .dotp,.radar .polC,.radar .polE,.radar .lbl{opacity:1;transform:none}
}

/* ═══════════════════════════════════════════════════════════════════
   RESPONSIVO
   Três faixas: 900px solta as colunas, 620px é o telefone deitado ou
   pequeno, 400px é o telefone estreito. A barra de abas inferior existe
   porque abaixo de 900px a navegação do topo é escondida, e sem ela não
   havia como sair da lista de vagas no celular.
   ═══════════════════════════════════════════════════════════════════ */

.tabbar{display:none}
.tabbar[hidden]{display:none!important}

@media(max-width:900px){
  .split,.tri{grid-template-columns:1fr}
  .lateral,.schema{position:static}
  .vaga{grid-template-columns:1fr}
  .dupla{grid-template-columns:1fr}
  .tnav{display:none}
  .msgs{max-height:none}
  .utin{gap:var(--s2)}
  .drw{width:100%}

  /* ---- barra de abas ---- */
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;gap:2px;
    background:color-mix(in srgb,var(--card) 93%,transparent);
    backdrop-filter:saturate(1.5) blur(14px);
    border-top:1px solid var(--i08);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
    padding-left:max(6px,env(safe-area-inset-left,0px));
    padding-right:max(6px,env(safe-area-inset-right,0px));
  }
  .tabbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:6px 3px;border-radius:var(--r3);color:var(--i62);
    font-size:.63rem;font-weight:600;line-height:1.15;min-height:48px;text-align:center;
    transition:color .16s var(--e),background .16s var(--e);
  }
  .tabbar button svg{width:20px;height:20px;flex:none}
  .tabbar button span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .tabbar button[aria-current=page]{color:var(--ac1);background:var(--veu)}
  @media(hover:hover){.tabbar button:hover{color:var(--i92)}}

  /* o conteúdo precisa terminar acima da barra, e o que flutua também.
     Só reserva o espaço quando a barra existe: deslogado ela não aparece. */
  .toast{left:var(--s2);right:var(--s2);transform:translateY(140px);max-width:none;
    bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .toast.on{transform:none}
  .comAbas .pg{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .comAbas .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .comAbas .cmpbar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .drw .body{padding-bottom:calc(var(--s3) + env(safe-area-inset-bottom,0px))}

  /* a barra utilitária fica só com o essencial: os dois links de suporte
     abrem aviso e não cabem junto do resto num telefone */
  .util a{display:none}
  .uidir{margin-left:0;width:100%;justify-content:space-between}

  /* 16px é o mínimo que evita o iOS dar zoom ao focar o campo */
  .fg input,.fg select,.fg textarea,.bfield input,.bfield select,
  .tagin input,.campoLivre textarea,.tab input,.tab select,.cmdk input{font-size:16px}

  /* o card de vaga vira coluna: medidor e comparar assentam numa faixa
     própria, separada do conteúdo por uma linha */
  .vaga .vdir{justify-self:stretch;flex-direction:row;align-items:center;
    justify-content:space-between;gap:var(--s2);
    padding-top:var(--s2);border-top:1px solid var(--i04)}

  .cfw{padding-left:0}
  .campoLivre{flex-direction:column}
  .envbt{align-self:stretch}
}

@media(max-width:620px){
  .fbarra{position:relative}
  .filtro{position:static}
  .fpop,.fordem .fpop{left:0;right:0;min-width:0;top:calc(100% + 6px)}
  .fordem{margin-left:0}
  .hero{padding:var(--s4) 0 var(--s3)}
  .hero p{font-size:var(--md)}
  .buscador{margin-top:var(--s3);gap:2px}
  /* separador vertical não faz sentido quando os campos empilham */
  .bfield+.bfield{border-left:0;border-top:1px solid var(--i08)}
  .bfield{flex:1 1 100%}
  .buscador .btn{width:100%;margin-top:6px}

  /* filtros correm na horizontal em vez de virar três linhas */
  .barra{align-items:flex-start;gap:var(--s1)}
  .chips{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;
    padding:2px 0 6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}

  /* a trilha de etapas tem cinco marcos e não cabe: rola preservando a linha */
  .trilhaw{overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .trilhaw::-webkit-scrollbar{display:none}
  .trilha{min-width:430px}

  .split{gap:var(--s4)}
  .corpo h1{font-size:1.55rem}
  .box,.cd,.kpi{padding:var(--s2) 14px}
  .radar{max-width:100%}
  .radar .lbl{font-size:8.6px}
  .eixo{grid-template-columns:78px 1fr 30px}
  .vers{grid-template-columns:1fr auto}
  .drw>header{padding:var(--s2) 14px}
  .drw .body{padding:14px}
  .drw pre{padding:14px;font-size:.75rem}
  .hashbox{font-size:.75rem}

  /* diálogo vira folha de baixo: alcança melhor com o polegar e sobra
     espaço quando o teclado virtual abre */
  .modal{place-items:end center;padding:0}
  .mbox{width:100%;max-width:none;border-radius:var(--r) var(--r) 0 0;
    padding:var(--s3) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom,0px));
    transform:translateY(28px);max-height:92dvh}
  .mbox.on{transform:none}

  .cmdk{padding:10px var(--s2) var(--s2)}
  .cmdk .lst{max-height:56vh}
  .cmdk .top{padding:12px 14px}
  .cmdk .rod{display:none}

  .graf{height:140px;gap:6px;padding:var(--s2)}
  .confirma{padding:14px;gap:var(--s2)}
  .wiz{gap:6px}
  .wz{padding:6px 12px;font-size:var(--xs)}
  .nota{margin-top:var(--s4)}
}

@media(max-width:400px){
  .kpis{grid-template-columns:1fr}
  .logo img.s{height:25px} .logo img.w{height:14px}
  .tin{gap:var(--s2);padding:11px 14px}
  .pg{padding-left:14px;padding-right:14px}
  .btn{padding:12px 16px}
  .btn.sm{padding:9px 11px;font-size:var(--xs)}
  .tabbar button{font-size:.58rem}
  .hero h1{font-size:1.95rem}
}

/* Dedo não é cursor: alvo pequeno demais erra. Vale para telefone e para
   tela sensível ao toque de qualquer tamanho. */
@media(pointer:coarse){
  .chip,.sug,.op,.cmpbt,.sugt button{min-height:38px;display:inline-flex;align-items:center}
  .tnav button,.dd button,.tabs button{min-height:44px}
  .tk button{width:28px;height:28px}
  .tk .nvbt{width:auto;height:28px;padding:0 12px}
  .tk{padding:5px 7px 5px 13px;gap:8px}
  .slider input[type=range]{height:9px}
  .slider input[type=range]::-webkit-slider-thumb{width:26px;height:26px}
  .slider input[type=range]::-moz-range-thumb{width:26px;height:26px}
  .volta{padding-top:var(--s3);min-height:40px}
  .tab tbody tr td{padding-top:16px;padding-bottom:16px}
}

/* Deitado num telefone: pouca altura, então o que é grudento solta e as
   folhas de baixo não podem ocupar a tela inteira. */
@media(max-height:520px) and (orientation:landscape){
  .lateral,.schema,.topo{position:static}
  .mbox{max-height:96dvh}
  .cmdk{padding-top:8px}
  .cmdk .lst{max-height:44vh}
}

/* região que rola na horizontal recebe foco por teclado via JS; o anel
   precisa aparecer sem colar no conteúdo */
.tabw:focus-visible{outline:2px solid var(--ac3);outline-offset:3px;border-radius:var(--r3)}


/* ═══════════════════════════════════════════════════════════════════
   ONBOARDING POR CURRÍCULO
   Uma coluna de leitura à esquerda, o perfil sendo montado à direita.
   Cada bloco da revisão é uma seção com título, origem e o interruptor
   de visibilidade: a pessoa decide o que a empresa vê, bloco a bloco.
   ═══════════════════════════════════════════════════════════════════ */
.onb{padding-top:var(--s4)}
.onbg{display:grid;grid-template-columns:1fr 300px;gap:var(--s5);align-items:start}
.onbm{min-width:0}
.onbm h1{font-size:var(--xxl);max-width:20ch;margin-bottom:var(--s2)}
.onbm .lead{color:var(--i72);font-size:var(--md);max-width:60ch;margin-bottom:var(--s3);line-height:1.6}
.onbl{position:sticky;top:82px}
.onbl h4{display:flex;align-items:center;gap:8px}
.onbl small{color:var(--i62);font-weight:400}

/* stepper */
.stp{list-style:none;display:flex;gap:6px;margin-bottom:var(--s4)}
.stp li{flex:1;display:flex;flex-direction:column;gap:7px;font-size:var(--xs);color:var(--i62);min-width:0}
.stp li i{height:4px;border-radius:2px;background:var(--i08);transition:background .4s var(--e)}
.stp li.ok i{background:var(--ac3)}
.stp li.on i{background:var(--ac1)}
.stp li.on{color:var(--ac1);font-weight:600}
.stp li.ok{color:var(--i72)}
.stp li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* boas-vindas */
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin:var(--s3) 0 var(--s4)}
.c3{background:var(--card);border:1px solid var(--i08);border-radius:var(--r);padding:var(--s3)}
.c3 .ic{width:34px;height:34px;border-radius:10px;background:var(--veu);color:var(--ac2);display:grid;place-items:center;margin-bottom:10px}
.c3 b{font-family:var(--d);font-size:var(--md);display:block;margin-bottom:4px}
.c3 p{font-size:var(--sm);color:var(--i72);line-height:1.55}

/* escolha */
.dois{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin:var(--s3) 0}
.cx{text-align:left;background:var(--card);border:1px solid var(--i14);border-radius:var(--r);padding:var(--s3);display:grid;gap:8px;align-content:start;transition:border-color .2s var(--e),transform .2s var(--e),box-shadow .2s var(--e)}
@media(hover:hover){.cx:hover{border-color:var(--ac3);transform:translateY(-2px);box-shadow:var(--sh2)}}
.cx .ic{width:38px;height:38px;border-radius:11px;background:var(--veu);color:var(--ac2);display:grid;place-items:center}
.cx b{font-family:var(--d);font-size:var(--lg)}
.cx p{font-size:var(--sm);color:var(--i72);line-height:1.55}
.cx .fmt{font-size:var(--xs);color:var(--i62);letter-spacing:.04em;text-transform:uppercase}

/* upload */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:2px dashed var(--i14);border-radius:var(--r);padding:var(--s5) var(--s3);background:var(--card);cursor:pointer;transition:border-color .2s var(--e),background .2s var(--e)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.drop .ic{width:44px;height:44px;border-radius:12px;background:var(--veu);color:var(--ac2);display:grid;place-items:center}
.drop b{font-family:var(--d);font-size:var(--md)}
.drop>span:last-child{font-size:var(--xs);color:var(--i62)}
.drop.over,.drop:focus-within{border-color:var(--ac3);background:var(--veu2)}
.alt{margin-top:var(--s2);border:1px solid var(--i08);border-radius:var(--r2);padding:12px 14px;background:var(--card)}
.alt summary{cursor:pointer;font-size:var(--sm);font-weight:600;color:var(--ac1)}
.alt textarea{width:100%;margin:10px 0;border:1px solid var(--i14);border-radius:var(--r2);padding:10px 12px;font:inherit;font-size:16px;background:var(--papel2);color:var(--i92);resize:vertical;min-height:120px}
.alt textarea:focus{border-color:var(--ac3);outline:0}
.modelo{background:var(--escura);color:#DCE9F2;border-radius:var(--r2);padding:14px;font-family:var(--mono);font-size:.74rem;line-height:1.7;overflow-x:auto;margin:10px 0;white-space:pre}

/* análise */
.etapas{list-style:none;display:grid;gap:10px;margin-top:var(--s3);max-width:420px}
.etapas li{display:flex;align-items:center;gap:12px;font-size:var(--md);color:var(--i62);padding:12px 14px;border-radius:var(--r2);background:var(--card);border:1px solid var(--i08);transition:color .3s var(--e),border-color .3s var(--e)}
.etapas li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--i14);flex:none;display:grid;place-items:center;transition:all .3s var(--e)}
.etapas li.on{color:var(--i92);border-color:var(--ac5)}
.etapas li.on i{border-color:var(--ac3);border-top-color:transparent;animation:gira .8s linear infinite}
.etapas li.ok{color:var(--i72)}
.etapas li.ok i{background:var(--ok);border-color:var(--ok)}
.etapas li.ok i::after{content:"";width:5px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* encontrado */
.achados{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:var(--s3) 0}
.ach{background:var(--card);border:1px solid var(--i08);border-radius:var(--r2);padding:12px 14px}
.ach span{display:block;font-size:var(--xs);color:var(--i62);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.ach b{font-size:var(--sm);font-weight:600;line-height:1.4}
.ach.nao b{color:var(--i62);font-weight:400;font-style:italic}

/* revisão: blocos */
.blk{background:var(--card);border:1px solid var(--i08);border-radius:var(--r);padding:var(--s3);margin-bottom:var(--s2);box-shadow:var(--sh)}
.blk>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.blk>header h3{font-size:var(--md);flex:1;min-width:140px}
.blk .hint{font-size:var(--xs);color:var(--i62);line-height:1.6;margin-bottom:8px}
.blk .chips{margin-left:0}
.blk .chip small{color:var(--i62);font-weight:400;margin-left:4px}
.blk .chip[aria-pressed=true] small{color:inherit;opacity:.8}
.vis{display:inline-flex;align-items:center;gap:7px;font-size:var(--xs);color:var(--i62);cursor:pointer;border:1px solid var(--i08);border-radius:var(--pill);padding:4px 10px 4px 6px}
.vis input{accent-color:var(--ac1);width:14px;height:14px;margin:0}
.vis:has(input:checked){border-color:var(--ac5);color:var(--ac1);background:var(--veu2)}
.pend{display:flex;gap:10px;align-items:flex-start;background:var(--al-bg);border:1px solid var(--al);border-radius:var(--r2);padding:12px 14px;font-size:var(--sm);color:var(--i92);margin-bottom:var(--s3);line-height:1.55}
.pend svg{flex:none;margin-top:2px;color:var(--al)}
.blk textarea{width:100%;border:1px solid var(--i14);border-radius:var(--r2);padding:10px 12px;font:inherit;font-size:16px;background:var(--papel2);color:var(--i92);resize:vertical;line-height:1.55}
.blk textarea:focus{border-color:var(--ac3);outline:0}

/* competências na revisão */
.cmps{display:grid;gap:6px}
.cmp{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--i08);border-radius:var(--r2);background:var(--papel2);transition:opacity .2s var(--e)}
.cmp.off{opacity:.45}
.cmp.off .cmpi b{text-decoration:line-through}
.okb{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ok);color:#fff;transition:background .15s var(--e)}
.cmp.off .okb{background:var(--i14);color:var(--i62)}
.cmpi{min-width:0}
.cmpi b{font-size:var(--sm);display:block}
.cmpi q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:var(--xs);color:var(--i62);line-height:1.5;margin-top:2px;font-style:italic}
.cmp .nvbt{background:rgba(var(--ac-rgb),.14);color:var(--ac1);border-radius:var(--pill);padding:4px 10px;font-size:var(--xs);font-weight:600;white-space:nowrap}
.cmp .prov{white-space:nowrap}
@media(max-width:560px){.cmp{grid-template-columns:auto 1fr}.cmp .nvbt{grid-column:2}.cmp .prov{grid-column:2;justify-self:start}}

/* consentimentos */
/* Base de checkbox com rótulo. Nunca existia display aqui — cada label
   ficava inline por padrão do navegador, e com texto curto (um modelo de
   trabalho, uma palavra) isso passava despercebido. Com texto longo (os
   consentimentos de LGPD), o rótulo de um item continuava fluindo direto
   no fim da linha do item anterior. */
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{flex:none;accent-color:var(--ac1);width:16px;height:16px}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.check.cons{align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--i04);font-size:var(--sm);line-height:1.55}
.check.cons:last-of-type{border:0}
.check.cons input{margin-top:3px;flex:none}
.check.cons em{font-style:normal;font-size:var(--xs);border-radius:var(--pill);padding:1px 8px;margin-left:6px;white-space:nowrap}
.check.cons em.necessário{background:var(--al-bg);color:var(--al-fg)}
.check.cons em.opcional{background:var(--i04);color:var(--i62)}
.resumoFinal .linha b{max-width:60%;font-weight:500;font-size:var(--xs)}

/* paginação das preferências: avisos e consentimentos são duas telas
   curtas, não uma rolagem longa. O indicador é o que deixa claro que
   falta uma página, não que a tela ficou incompleta. */
.pgprefs{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.pgprefs span{font-size:var(--xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ac1);background:var(--veu);border-radius:var(--pill);padding:3px 10px}
.pgprefs b{font-size:var(--sm);color:var(--i62);font-weight:500}

.lgpdInfo{display:flex;gap:10px;align-items:flex-start;background:var(--papel2);
  border:1px solid var(--i08);border-radius:var(--r2);padding:12px 14px;margin:var(--s2) 0 var(--s3)}
.lgpdInfo svg{flex:none;margin-top:2px;color:var(--ac2)}
.lgpdInfo p{font-size:var(--xs);color:var(--i72);line-height:1.6;margin:0}

/* faixa de retomada na home */
.retoma{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--veu);border:1px solid var(--ac5);border-radius:var(--r);padding:12px 16px;margin:var(--s3) 0 0}
.retoma svg{color:var(--ac2);flex:none}
.retoma>div{flex:1;min-width:220px}
.retoma b{font-family:var(--d);font-size:var(--md);display:block}
.retoma p{font-size:var(--sm);color:var(--i72);margin:2px 0 0;max-width:none}

@media(max-width:900px){
  .onbg{grid-template-columns:1fr}
  .onbl{position:static}
  .tres{grid-template-columns:1fr}
  .dois{grid-template-columns:1fr}
  .stp li span{font-size:.62rem}
}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}
}

/* ══════════════════ CONECTARIA VAGAS · ACRÉSCIMOS ══════════════════
   O visual é o do protótipo (prototipo-front/partes/app.css, que entra
   inteiro antes deste arquivo). Aqui só o que a versão operada tem de
   novo, sempre pelos mesmos tokens, para funcionar nos dois temas. */

/* ── barra de teste ── */
.teste{display:inline-flex;align-items:center;gap:7px;font-weight:600;letter-spacing:.01em;min-width:0}
.teste i{width:7px;height:7px;border-radius:50%;background:var(--al);flex:none}
.papel{display:inline-flex;background:rgba(255,255,255,.08);border-radius:var(--pill);padding:3px;gap:2px}
.papel button{border-radius:var(--pill);padding:5px 12px;font-weight:600;color:rgba(255,255,255,.72)}
.papel button[aria-pressed="true"]{background:#fff;color:#0E2233}
.papel button:focus-visible{outline:2px solid var(--ac4);outline-offset:1px}

/* ── vitrine ── */
.hv{padding-bottom:var(--s3)}
.hv p{max-width:62ch;line-height:1.6}
.achips{margin:var(--s2) 0 6px}
.vres{font-size:var(--sm);color:var(--i72);margin-top:8px;line-height:1.55;max-width:70ch}
.vver{display:inline-flex;align-items:center;gap:4px;font-size:var(--sm);font-weight:600;color:var(--ac1);white-space:nowrap}
.tag.trab{border-color:transparent;background:var(--veu);color:var(--ac1);font-weight:600}
.ctaeq{margin:var(--s5) 0 var(--s3);padding:var(--s4) var(--s3);border-radius:var(--r);background:var(--escura);
  color:#E6F1F8;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.ctaeq h3{font-family:var(--d);font-size:var(--xl);text-wrap:balance}
.ctaeq p{color:rgba(230,241,248,.72);margin-top:6px;font-size:var(--md)}
.ctaeq .btn{background:#fff;color:#0E2233}

/* ── cadastro ── */
.comofunc{list-style:none;display:grid;gap:10px;margin-top:var(--s2);font-size:var(--sm);color:var(--i72);line-height:1.5;counter-reset:cf}
.comofunc li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.comofunc li::before{counter-increment:cf;content:counter(cf);width:22px;height:22px;border-radius:50%;
  background:var(--veu);color:var(--ac1);font-size:var(--xs);font-weight:700;display:grid;place-items:center}
.comofunc b{color:var(--i92)}
.achou{display:flex;gap:10px;align-items:flex-start;background:var(--ok-bg);border:1px solid var(--ok);border-radius:var(--r2);
  padding:12px 14px;font-size:var(--sm);color:var(--i92);margin:var(--s2) 0 var(--s3);line-height:1.55}
.achou svg{flex:none;margin-top:2px;color:var(--ok)}
.opc{font-size:var(--xs);font-weight:500;color:var(--i34);margin-left:auto}
label .opc{margin-left:6px}
.acoesform{display:flex;gap:9px;flex-wrap:wrap}
.erroform{font-size:var(--sm);color:var(--bl-fg);min-height:0}
.erroform:empty{display:none}
.btn.perigo{color:var(--bl-fg)}
.btn.w.perigo:not(.g){background:var(--bl);color:#fff}
.link{color:var(--ac1);font-weight:600;font-size:inherit;text-decoration:underline;text-underline-offset:3px;padding:0}
.fg .link{justify-self:start;margin-top:6px;font-size:var(--sm)}
.expect.enc svg{color:var(--al)}

/* ── tabelas da Conectaria ── */
.sub2{font-size:var(--xs);color:var(--i62)}
.celemp{display:flex;align-items:center;gap:10px}
.celemp > div{min-width:0}
.tab tr.off td{opacity:.55}
.nomebt{font-family:var(--d);font-size:var(--md);font-weight:600;color:var(--i92);text-align:left;padding:0;display:inline-flex;align-items:center;gap:5px}
@media(hover:hover){.nomebt:hover{color:var(--ac1);text-decoration:underline;text-underline-offset:3px}}
.nomebt .fav{color:var(--al);display:inline-flex}
.porq{max-width:260px;color:var(--i72);font-size:var(--sm)}
.fitb{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.fitb > span{width:64px;height:6px;border-radius:3px;background:var(--i08);overflow:hidden;display:block}
.fitb i{display:block;height:100%;background:var(--ok);border-radius:3px}
.fitb.medio i{background:var(--al)} .fitb.baixo i{background:var(--bl)}
.fitb b{font-size:var(--sm);min-width:2ch}

/* o seletor de vaga do processo leva "empresa · título", que pode ser longo */
#v-pipeline .barra{min-width:0}
#v-pipeline .selVaga{max-width:min(100%,460px);min-width:0;text-overflow:ellipsis}
#v-pipeline .barra > .cont{max-width:100%}

/* ── painel ── */
.painelg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.painelg > .bloco{margin-top:var(--s3)}
.bloco > .hint, .bloco > p.hint{padding:0 var(--s3) var(--s3)}
.bloco header .hint{font-size:var(--xs)}
.tab td small{color:var(--i62);font-weight:500}
.avisoex{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--veu2);border:1px solid var(--veu);
  border-radius:var(--r2);padding:12px 14px;font-size:var(--sm);color:var(--i92);margin-bottom:var(--s3)}
.avisoex > svg{color:var(--ac1);flex:none}
.avisoex > div{flex:1;min-width:220px}

/* ── formulário de vaga ── */
.corpo.form{gap:0}
.reqs{display:grid;gap:8px}
.req{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:8px 10px;
  border:1px solid var(--i08);border-radius:var(--r3);background:var(--card)}
.req b{font-size:var(--sm);font-weight:600;min-width:0}
.req select{padding:6px 8px;font-size:var(--sm);width:auto}
.req .check{font-size:var(--xs)}
.vfacoes{display:grid;gap:8px}

/* ── banco de talentos ── */
.filtrost{display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;gap:var(--s2);margin-bottom:var(--s3)}
.apsl{list-style:none;display:grid;gap:8px;font-size:var(--sm)}
.apsl li{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ── gaveta do candidato ── */
.gv{display:grid;gap:6px}
.gv h4{font-family:var(--d);font-size:var(--md);margin-bottom:4px}
.gvres{font-size:var(--sm);color:var(--i72);line-height:1.6;margin-bottom:6px}
.gvtopo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gvacoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.gvacoes .btn{padding:8px 11px}
.sel{user-select:all;font-variant-numeric:tabular-nums}
.fitgrande{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.fitgrande .fitb > span{width:140px;height:9px}
.fitgrande .fitb b{font-size:var(--xl);font-family:var(--d)}
.hist{list-style:none;display:grid;gap:10px;border-left:2px solid var(--i08);padding-left:14px}
.hist li{display:grid;gap:2px;font-size:var(--sm);position:relative}
.hist li::before{content:"";position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--ac3)}
.hist li span{font-size:var(--xs);color:var(--i62)}

@media(max-width:900px){
  .painelg{grid-template-columns:1fr;gap:0}
  .filtrost{grid-template-columns:1fr 1fr}
  .teste{font-size:.68rem}
}
@media(max-width:560px){
  .utin{flex-wrap:wrap;row-gap:6px;padding-block:6px}
  .teste{width:100%}
  .uidir{width:100%;justify-content:space-between}
  .filtrost{grid-template-columns:1fr}
  .req{grid-template-columns:1fr auto auto}
  .req b{grid-column:1 / -1}
  .ctaeq{padding:var(--s3)}
  .ctaeq .btn{width:100%}
  .porq{min-width:180px}
  #v-pipeline .selVaga{width:100%;max-width:100%}
}
</style>
</head>

   não política: por isso mora aqui e não no artefato versionado. */
const EIXO_CURTO = {
  ritmo:'Ritmo', autonomia:'Autonomia', formal:'Formal.', erro:'Erro',
  decisao:'Decisão', colab:'Colab.', previsib:'Previsib.', presenca:'Presença',

  dados:'Dados', relacional:'Relac.',

const EIXOS = POLITICA.eixos.map(e => ({...e, curto: EIXO_CURTO[e.id] || e.nome}));
const EIXO = Object.fromEntries(EIXOS.map(e => [e.id, e]));
const EIXO_IDS = EIXOS.map(e => e.id);
const pesosDe = (pol, fam) => pol.pesos_por_familia[fam] || pol.pesos_por_familia._padrao;

/* ══════════════════ 2 · SOURCED VALUE ══════════════════
   Todo dado que entra no match carrega de onde veio e quanta confiança
   tem. É o tipo que impõe a regra "IA sugere, pessoa confirma": extração
   de documento não vira fato só por estar preenchida.                  */
const OBSERVADO = '2026-09-01T12:00:00.000Z';
const sv = (value, source='user', confidence=1, extra) =>
  ({value, source, confidence, observedAt:OBSERVADO,
    ...(source==='user'||source==='company'||source==='curator' ? {confirmedAt:OBSERVADO} : {}),
    ...extra});
const confirmado = v => v.source==='user'||v.source==='company'||v.source==='curator'||!!v.confirmedAt;

  conversation:'extraído da conversa', document:'extraído de documento',

/* ══════════════════ 3 · PROJEÇÃO DE FEATURES ══════════════════
   Passagem obrigatória. É aqui, e só aqui, que se garante que feature
   proibida nunca chega ao cálculo. Se a checagem morasse no motor, cada
   caminho novo de entrada precisaria lembrar de fazer a verificação.   */
class ErroFeatureProibida extends Error {}

function projetar(ent, pol){
  const porId = new Map();
  const deny = new Set(pol.features.denylist);
  const allow = new Set(pol.features.allowlist);
  const por = f => {
    if(deny.has(f.id)) throw new ErroFeatureProibida(
      'feature "'+f.id+'" está na denylist da política '+pol.policy_version+
      '. Proxy de característica protegida não entra no modelo.');
    if(!allow.has(f.id)) throw new ErroFeatureProibida(
      'feature "'+f.id+'" não está na allowlist da política '+pol.policy_version+
      '. Feature entra por lista positiva; adicione à política e versione.');
    porId.set(f.id, f);
  };
  const nova = (id,v) => ({id, valor:v.value, fonte:v.source, confidence:v.confidence});
  const {candidato, empresa, vaga} = ent;

  if(candidato){
    for(const id of EIXO_IDS) por(nova('eixo.'+id, candidato.eixos[id]));
    por(nova('contexto.uf', candidato.uf));
    por(nova('contexto.modelo', candidato.modelos));
    if(candidato.pretensao) por(nova('contexto.pretensao', candidato.pretensao));
    for(const c of candidato.competencias){
      // skill.nivel é família de features: o id do skill vai no valor, não
      // no id da feature, para a allowlist não crescer a cada skill nova.
      const f = nova('skill.nivel', c.nivel);
      if(deny.has('skill.nivel') || !allow.has('skill.nivel'))
        throw new ErroFeatureProibida('feature "skill.nivel" fora da allowlist');
      porId.set('skill.nivel:'+c.skillId, {...f, id:'skill.nivel'});
    }
  }
  if(empresa){ for(const id of EIXO_IDS) por(nova('eixo.'+id, empresa.eixos[id])); }
  if(vaga){
    por({id:'vaga.familia', valor:vaga.familia, fonte:'company', confidence:1});
    por({id:'vaga.faixa', valor:vaga.faixaMax, fonte:'company', confidence:1});
  }
  return {featureSchemaVersion: pol.feature_schema_version, porId};
}

/* Confiança agregada, ponderada pela fonte. Perfil montado por extração
   de currículo vale menos que o mesmo perfil confirmado pela pessoa.   */
function confiancaDe(valores, pol){
  if(!valores.length) return 0;
  const soma = valores.reduce((acc,v)=>{
    const peso = pol.confianca.peso_fonte[v.source] ?? .5;
    return acc + Math.max(0, Math.min(1, v.confidence)) * peso;
  },0);
  return soma / valores.length;
}

/* ══════════════════ 4 · MOTOR ══════════════════
   Função pura. Sem rede, sem banco, sem relógio implícito. Mesma entrada
   e mesmas versões produzem o mesmo resultado.                          */
const clamp = (n,min=0,max=100) => Math.max(min, Math.min(max, n));

function fitTecnico(i){
  const {candidato, vaga, politica} = i;
  const rot = i.rotuloSkill || (id=>id);
  const evidencias = [];

  if(!vaga.requisitos.length){
    return {nota:60, confidence:.3, evidencias:[{kind:'constraint', featureId:'vaga.requisitos',
      reasonCode:'REQ_AUSENTE',
      humano:'A vaga não declarou requisitos, então o técnico não pôde ser avaliado.'}]};
  }

  const tem = new Map(candidato.competencias.map(c=>[c.skillId,c]));
  let ganho=0, total=0, furouObrigatorio=false;

  for(const r of vaga.requisitos){
    total += r.peso;
    const c = tem.get(r.skillId);
    if(!c){
      if(r.obrigatorio) furouObrigatorio = true;
      evidencias.push({kind:'gap', featureId:'skill.nivel',
        reasonCode: r.obrigatorio ? 'REQ_OBRIGATORIO_AUSENTE' : 'REQ_AUSENTE',
        contribution: -r.peso/total,
        humano: r.obrigatorio
          ? 'Requisito obrigatório ausente: '+rot(r.skillId)+'.'
          : 'Requisito desejável ausente: '+rot(r.skillId)+'.'});
      continue;
    }
    const parcial = r.peso * Math.min(1, c.nivel.value/3);
    ganho += parcial;
    evidencias.push({kind:'strength', featureId:'skill.nivel', sourceRef:c.nivel.evidenceRef,
      reasonCode:'REQ_COBERTO', contribution:parcial,
      humano: rot(r.skillId)+' em nível '+c.nivel.value+' de 3.'});
  }

  let nota = Math.round(ganho/total*100);

  // Teto, não média. Se o obrigatório virasse mais um peso, um candidato
  // forte em quatro requisitos e zerado no único obrigatório sairia com ~70
  // e passaria despercebido. A lacuna crítica não pode se diluir.
  if(furouObrigatorio && politica.requisito_obrigatorio.modo==='cap'){
    nota = Math.min(nota, politica.requisito_obrigatorio.nota_maxima);
    evidencias.push({kind:'constraint', featureId:'politica.requisito_obrigatorio',
      reasonCode:'TETO_APLICADO',
      humano:'Nota limitada a '+politica.requisito_obrigatorio.nota_maxima+
        ' por requisito obrigatório não atendido.'});
  }

  const confidence = confiancaDe(candidato.competencias.map(c=>c.nivel), politica);
  return {nota:clamp(nota), confidence, evidencias};
}

function fitCultural(i){
  const {candidato, empresa, politica} = i;
  const fator = politica.cultural.fator_decaimento;

  const porEixo = politica.eixos.map(e=>{
    const cv = candidato.eixos[e.id] ? candidato.eixos[e.id].value : 50;
    const ev = empresa.eixos[e.id] ? empresa.eixos[e.id].value : 50;
    const d = Math.abs(cv-ev);
    const ponto = Math.max(0, 1 - d/(e.tolerancia*fator));
    return {e, d, ponto};
  });

  const nota = Math.round(porEixo.reduce((a,x)=>a+x.ponto,0)/porEixo.length*100);
  const ordenado = [...porEixo].sort((a,b)=>a.ponto-b.ponto);

  const evidencias = ordenado.slice(0,3).map(x=>({
    kind: x.d > x.e.tolerancia ? 'gap' : 'strength',
    featureId:'eixo.'+x.e.id,
    reasonCode: x.d > x.e.tolerancia ? 'EIXO_FORA_TOLERANCIA' : 'EIXO_ALINHADO',
    contribution: x.ponto/porEixo.length,
    humano: x.d > x.e.tolerancia
      ? x.e.nome+': '+x.d+' pontos de distância, acima da tolerância de '+x.e.tolerancia+'.'
      : x.e.nome+': '+x.d+' pontos de distância, dentro da tolerância de '+x.e.tolerancia+'.',
  }));

  const confidence = confiancaDe([
    ...EIXO_IDS.map(id=>candidato.eixos[id]),
    ...EIXO_IDS.map(id=>empresa.eixos[id]),
  ], politica);

  return {nota:clamp(nota), confidence, evidencias, porEixo:ordenado};
}

function fitContexto(i){
  const {candidato, vaga, politica} = i;
  const c = politica.contexto;
  const evidencias=[], notas=[];

  const okLocal = vaga.uf==='BR' || candidato.uf.value===vaga.uf;
  notas.push(okLocal ? c.localidade.compativel : c.localidade.incompativel);
  evidencias.push({kind: okLocal?'strength':'constraint', featureId:'contexto.uf',
    reasonCode: okLocal?'LOCAL_OK':'LOCAL_DIVERGENTE',
    humano: okLocal ? 'Localidade compatível.'
      : 'Vaga em '+vaga.uf+', candidato em '+candidato.uf.value+'.'});

  const okModelo = candidato.modelos.value.includes(vaga.modelo);
  notas.push(okModelo ? c.modelo.compativel : c.modelo.incompativel);
  evidencias.push({kind: okModelo?'strength':'constraint', featureId:'contexto.modelo',
    reasonCode: okModelo?'MODELO_OK':'MODELO_DIVERGENTE',
    humano: okModelo ? 'Modelo '+vaga.modelo+' está nas preferências.'
      : 'Modelo '+vaga.modelo+' fora das preferências declaradas.'});

  if(candidato.pretensao){
    const p = candidato.pretensao.value, teto = vaga.faixaMax;
    const margem = teto*(1+c.pretensao.tolerancia_relativa);
    const nota = p<=teto ? c.pretensao.dentro : p<=margem ? c.pretensao.margem : c.pretensao.fora;
    notas.push(nota);
    evidencias.push({kind: nota===c.pretensao.dentro?'strength':'constraint',
      featureId:'contexto.pretensao',
      reasonCode: nota===c.pretensao.dentro?'PRETENSAO_OK'
        : nota===c.pretensao.margem?'PRETENSAO_MARGEM':'PRETENSAO_FORA',
      humano: nota===c.pretensao.dentro ? 'Pretensão dentro da faixa.'
        : 'Pretensão acima do teto da faixa (R$ '+teto.toLocaleString('pt-BR')+').'});
  }

  const confidence = confiancaDe([candidato.uf, candidato.modelos,
    ...(candidato.pretensao?[candidato.pretensao]:[])], politica);

  return {nota:clamp(Math.round(notas.reduce((a,b)=>a+b,0)/notas.length)), confidence, evidencias};
}

function evaluate(i){
  // Passagem obrigatória pela projeção: garante que feature proibida não
  // chega ao cálculo, mesmo quando o motor for chamado por caminho novo.
  const vetor = projetar({candidato:i.candidato, empresa:i.empresa, vaga:i.vaga}, i.politica);

  const tecnico = fitTecnico(i), cultural = fitCultural(i), contexto = fitContexto(i);
  const w = pesosDe(i.politica, i.vaga.familia);
  const total = Math.round(tecnico.nota*w.tecnico + cultural.nota*w.cultural + contexto.nota*w.contexto);

  // Confiança do conjunto é a MENOR das dimensões, não a média: uma dimensão
  // apoiada em dado fraco contamina a recomendação inteira, e média esconderia.
  const confidence = Math.min(tecnico.confidence, cultural.confidence, contexto.confidence);

  return {tecnico, cultural, contexto, total:clamp(total), confidence, pesos:w,
    features:[...vetor.porId.keys()]};
}

/* ══════════════════ 5 · PORTÃO DE POLÍTICA ══════════════════
   Score nunca é publicado direto. Passa por um portão que pode liberar,
   mandar para revisão humana ou bloquear.                              */
function avaliarPoliticas(r, pol){
  const d=[], conf = pol.confianca;

  if(r.confidence < conf.minima_para_publicar){
    d.push({policyId:'confianca.minima', outcome:'block', reasonCode:'CONFIANCA_ABAIXO_DO_MINIMO'});
  } else if(r.confidence < conf.revisar_abaixo_de){
    d.push({policyId:'confianca.revisao', outcome:'review', reasonCode:'CONFIANCA_EM_FAIXA_DE_REVISAO'});
  } else {
    d.push({policyId:'confianca.minima', outcome:'allow', reasonCode:'CONFIANCA_OK'});
  }

  // Score alto apoiado em lacuna obrigatória é o falso positivo mais caro:
  // gera entrevista que não deveria existir, dos dois lados.
  const furou = r.tecnico.evidencias.some(e=>e.reasonCode==='REQ_OBRIGATORIO_AUSENTE');
  if(furou && r.total >= 60){
    d.push({policyId:'coerencia.obrigatorio', outcome:'review',
      reasonCode:'TOTAL_ALTO_COM_OBRIGATORIO_AUSENTE'});
  }
  return d;
}
const desfechoFinal = d => d.some(x=>x.outcome==='block') ? 'block'
  : d.some(x=>x.outcome==='review') ? 'review' : 'allow';

let _malha=null;
function malha(){
  if(_malha) return _malha;
  const pts=[]; for(let i=0;i<26;i++) pts.push([Math.random()*1200, Math.random()*420]);
  let l='';
  pts.forEach((a,i)=>pts.forEach((b,j)=>{ if(j<=i) return;
    const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(d<178) l+='<line x1="'+a[0].toFixed(0)+'" y1="'+a[1].toFixed(0)+'" x2="'+b[0].toFixed(0)+
      '" y2="'+b[1].toFixed(0)+'" stroke="currentColor" stroke-width="1" opacity="'+
      (0.3-d/700).toFixed(2)+'"/>';}));
  const c=pts.map(p=>'<circle cx="'+p[0].toFixed(0)+'" cy="'+p[1].toFixed(0)+'" r="'+
    (1.8+Math.random()*2).toFixed(1)+'" fill="currentColor" opacity="'+
    (0.22+Math.random()*0.3).toFixed(2)+'"/>').join('');
  _malha='<svg class="malha" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" '+
    'style="color:var(--ac3)" aria-hidden="true">'+l+c+'</svg>';
  return _malha;
}

function skillsDosCargos(cargoIds){
