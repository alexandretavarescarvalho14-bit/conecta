/* ══════════════════ 7b · ALEATÓRIO DETERMINÍSTICO ══════════════════

   Os dados de demonstração são gerados, não escritos à mão, mas precisam
   ser os MESMOS a cada carregamento: sem isso não dá para reproduzir um
   bug de funil, e o dashboard muda de forma a cada F5.

   O mesmo PRNG do core (fixtures.ts), com uma diferença importante: a
   semente vem de uma string, não de um contador. Semente por id significa
   que inserir a vaga 17 não desloca as vagas 18 a 32 — cada item é
   reconstruível isoladamente, e a persistência guarda só o id.          */

function prng(semente){
  let s = semente >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/* FNV-1a: string → semente. Determinística entre execuções e navegadores. */
function sementeDe(str){
  let h = 0x811c9dc5 >>> 0;
  for(let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h >>> 0;
}

const escolher = (r, arr) => arr[Math.floor(r() * arr.length)];
const entre = (r, a, b) => a + Math.floor(r() * (b - a + 1));

/* Sorteio ponderado por `p`. Os pesos não precisam somar 1. */
function sortearPonderado(r, itens){
  const total = itens.reduce((a, x) => a + x.p, 0);
  let k = r() * total;
  for(const x of itens){ k -= x.p; if(k <= 0) return x; }
  return itens[itens.length - 1];
}

/* Embaralha sem mutar a origem, usando o PRNG injetado (nunca Math.random). */
function embaralhar(r, arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(r() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ══════════════════ 7e · EXTRAÇÃO DE CURRÍCULO ══════════════════

   Lê o arquivo e devolve texto; depois interpreta o texto e devolve
   SUGESTÕES, nunca fatos. Tudo que sai daqui entra no perfil com
   source: 'document', que a política pesa em 0,7 contra 1,0 do que a
   pessoa confirma. É a regra "IA sugere, pessoa confirma" do contrato,
   agora com uma interface na frente.

   Nada aqui usa biblioteca externa: o Artifact precisa abrir sem rede.
   TXT e MD são texto. DOCX é um zip com XML dentro, e o navegador
   descompacta deflate nativamente.

   PDF foi testado e tirado do fluxo aceito: a leitura funciona só para
   fonte padrão, e a maioria dos currículos reais exportados do Word ou
   do Canva usa fonte embutida com codificação própria, que sai como
   lixo. Em vez de aceitar o formato e falhar silenciosamente para boa
   parte de quem usa, a extração recusa PDF de saída e orienta para
   DOCX, que lê com precisão. O código de leitura de PDF continua
   abaixo, sem uso: fica pronto para o dia em que uma extração de
   verdade (servidor, OCR) o tornar confiável de novo.                 */

class ErroExtracao extends Error {
  constructor(msg, motivo){ super(msg); this.motivo = motivo; }
}

const FORMATOS = {
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document': 'docx',
  'text/plain': 'txt', 'text/markdown': 'md', 'text/x-markdown': 'md',
};
/* PDF fica fora de propósito: ver a nota de leitura acima. */
function formatoDe(arquivo){
  const ext = (arquivo.name.split('.').pop() || '').toLowerCase();
  if(['docx','txt','md'].includes(ext)) return ext;
  return FORMATOS[arquivo.type] || null;
}
const LIMITE_BYTES = 8 * 1024 * 1024;

/* ── leitura por formato ── */

async function inflar(dados, formato){
  const ds = new DecompressionStream(formato);
  const w = ds.writable.getWriter();
  w.write(dados); w.close();
  const buf = await new Response(ds.readable).arrayBuffer();
  return new Uint8Array(buf);
}
const utf8 = u8 => new TextDecoder('utf-8').decode(u8);
const latin = u8 => new TextDecoder('latin1').decode(u8);

/* DOCX: procura word/document.xml pelo diretório central do zip, que é
   onde os tamanhos são confiáveis. O cabeçalho local pode ter tamanho
   zero quando o gravador usou descritor de dados. */
async function lerDocx(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for(let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new ErroExtracao('O arquivo não é um DOCX válido.', 'formato');
  const n = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  for(let i = 0; i < n; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const metodo = dv.getUint16(p + 10, true);
    const tamComp = dv.getUint32(p + 20, true);
    const nomeLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const comentLen = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const nome = utf8(u8.subarray(p + 46, p + 46 + nomeLen));
    if(nome === 'word/document.xml'){
      const lNome = dv.getUint16(local + 26, true), lExtra = dv.getUint16(local + 28, true);
      const ini = local + 30 + lNome + lExtra;
      const dados = u8.subarray(ini, ini + tamComp);
      const xml = metodo === 8 ? utf8(await inflar(dados, 'deflate-raw'))
                : metodo === 0 ? utf8(dados)
                : null;
      if(xml === null) throw new ErroExtracao('O DOCX usa uma compressão que não consigo ler.', 'formato');
      return docxParaTexto(xml);
    }
    p += 46 + nomeLen + extraLen + comentLen;
  }
  throw new ErroExtracao('Não encontrei o conteúdo do documento dentro do DOCX.', 'formato');
}
function docxParaTexto(xml){
  return xml
    .replace(/<w:tab\/>/g, '\t')
    .replace(/<w:br[^>]*\/>/g, '\n')
    .replace(/<\/w:p>/g, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}

/* PDF: varre os streams, infla os FlateDecode e lê os operadores de
   texto Tj e TJ. Cobre PDF com fonte padrão. Fonte com codificação
   própria (Identity-H sem ToUnicode) sai como lixo, e o teste de
   legibilidade abaixo pega isso e devolve falha em vez de perfil errado. */
async function lerPdf(buf){
  const u8 = new Uint8Array(buf);
  const s = latin(u8);
  if(!s.startsWith('%PDF')) throw new ErroExtracao('O arquivo não é um PDF válido.', 'formato');
  const partes = [];
  const re = /stream\r?\n/g; let m;
  while((m = re.exec(s))){
    const ini = m.index + m[0].length;
    const fim = s.indexOf('endstream', ini);
    if(fim < 0) break;
    const dict = s.slice(Math.max(0, s.lastIndexOf('<<', m.index)), m.index);
    // /Length diz o tamanho exato. Sem ele, corta o fim de linha antes de
    // endstream: byte sobrando depois do trailer zlib faz o inflate rejeitar.
    const len = /\/Length\s+(\d+)(?!\s+\d+\s+R)/.exec(dict);
    let fimDados = len ? Math.min(ini + (+len[1]), fim) : fim;
    while(fimDados > ini && (s[fimDados - 1] === '\n' || s[fimDados - 1] === '\r')) fimDados--;
    const dados = u8.subarray(ini, fimDados);
    let txt;
    try{
      txt = /FlateDecode/.test(dict) ? latin(await inflar(dados, 'deflate')) : latin(dados);
    }catch(_){ re.lastIndex = fim; continue; }
    if(/\bT[jJ]\b/.test(txt)) partes.push(pdfOperadoresParaTexto(txt));
    re.lastIndex = fim;
  }
  const texto = partes.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  if(!textoLegivel(texto)){
    throw new ErroExtracao(
      'Consegui abrir o PDF, mas o texto dele não saiu legível. Isso acontece quando o ' +
      'arquivo foi exportado com fontes embutidas de um jeito que não consigo decodificar.',
      'ilegivel');
  }
  return texto;
}
function pdfOperadoresParaTexto(s){
  const out = [];
  const re = /\[((?:[^\]\\]|\\.)*)\]\s*TJ|\(((?:[^)\\]|\\.)*)\)\s*Tj|\bT\*|\bET\b/g;
  let m;
  while((m = re.exec(s))){
    if(m[1] !== undefined){
      const strs = m[1].match(/\(((?:[^)\\]|\\.)*)\)/g) || [];
      out.push(strs.map(x => pdfDesescapar(x.slice(1, -1))).join(''));
    } else if(m[2] !== undefined){
      out.push(pdfDesescapar(m[2]));
    } else out.push('\n');
  }
  return out.join(' ').replace(/[ \t]+/g, ' ').replace(/ \n/g, '\n');
}
function pdfDesescapar(s){
  return s.replace(/\\\(/g, '(').replace(/\\\)/g, ')').replace(/\\n/g, '\n')
    .replace(/\\r/g, '').replace(/\\t/g, ' ').replace(/\\\\/g, '\\')
    .replace(/\\(\d{3})/g, (_, o) => String.fromCharCode(parseInt(o, 8)));
}
/* Teste de legibilidade: texto de currículo em português tem palavras
   comuns. Se quase nenhuma aparece, o que saiu é codificação, não texto. */
function textoLegivel(t){
  if(t.replace(/\s/g, '').length < 60) return false;
  const comuns = ['de', 'e', 'em', 'com', 'para', 'do', 'da', 'que', 'um', 'uma', 'na', 'no', 'por'];
  const palavras = t.toLowerCase().match(/[a-záéíóúâêôãõç]{2,}/g) || [];
  if(palavras.length < 15) return false;
  const acertos = palavras.filter(p => comuns.includes(p)).length;
  return acertos / palavras.length > 0.03;
}

async function lerArquivo(arquivo){
  const fmt = formatoDe(arquivo);
  if(!fmt){
    const ext = (arquivo.name.split('.').pop() || '').toLowerCase();
    if(ext === 'pdf') throw new ErroExtracao(
      'PDF não é aceito nesta versão: a leitura falha na maioria dos currículos exportados ' +
      'com fonte própria. Exporte como DOCX (Word: Salvar como → Word) e envie de novo.',
      'formato');
    throw new ErroExtracao('Aceito DOCX, TXT ou MD. Este arquivo é outra coisa.', 'formato');
  }
  if(arquivo.size > LIMITE_BYTES) throw new ErroExtracao('O arquivo passa de 8 MB. Currículo costuma ter bem menos que isso.', 'tamanho');
  if(arquivo.size === 0) throw new ErroExtracao('O arquivo está vazio.', 'vazio');
  const buf = await arquivo.arrayBuffer();
  let texto;
  if(fmt === 'txt' || fmt === 'md') texto = utf8(new Uint8Array(buf));
  else texto = await lerDocx(buf);
  if(!textoLegivel(texto)) throw new ErroExtracao('Abri o arquivo, mas não achei texto suficiente para montar um perfil.', 'vazio');
  return {texto, formato: fmt};
}

function trechoEm(texto, norm, idx, len){
  let ini = idx, fim = idx + len;
  while(ini > 0 && !/[\n.;:•·]/.test(norm[ini - 1]) && idx - ini < 110) ini--;
  while(fim < norm.length && !/[\n.;•·]/.test(norm[fim]) && fim - idx < 130) fim++;
  return texto.slice(ini, fim).replace(/\s+/g, ' ').trim();
}
function nivelPorContexto(trecho){
  const t = normalizar(trecho);
  if(/\b(avancad|senior|lider|coorden|gerenci|especialista|responsavel por|implantei|estruturei|head|diretor)/.test(t)) return 3;
  if(/\b(basic|junior|nocoes|iniciante|apoio|auxiliar|estagi|aprendiz)/.test(t)) return 1;
  return 2;
}
const escaparRe = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function interpretar(texto){
  const norm = normalizar(texto);

  // competências com evidência
  const competencias = [];
  for(const sk of SKILLS){
    if(sk.st !== 'ativa') continue;
    const termos = [normalizar(sk.r), ...(SINONIMOS[sk.id] || [])];
    for(const t of termos){
      const re = new RegExp('(^|[^a-z0-9])' + escaparRe(t) + '($|[^a-z0-9])');
      const m = re.exec(norm);
      if(m){
        const idx = m.index + m[1].length;
        const trecho = trechoEm(texto, norm, idx, t.length);
        competencias.push({skillId: sk.id, nivel: nivelPorContexto(trecho), evidencia: trecho, termo: t});
        break;
      }
    }
  }

  // área: a que mais competências encontradas
  const porArea = {};
  competencias.forEach(c => (SKILL[c.skillId].a || []).forEach(a => porArea[a] = (porArea[a] || 0) + 1));
  const areaId = Object.entries(porArea).sort((a, b) => b[1] - a[1])[0]?.[0] || null;

  // cargos citados literalmente
  const cargos = CARGOS.filter(c => norm.includes(normalizar(c.n))).map(c => c.id);

  // UF: sigla no formato "Cidade - PE" / "Cidade/PE", nome de estado ou cidade grande
  let uf = null;
  const sigla = norm.match(/\b[a-z ]{3,25}\s*[-\/,]\s*([a-z]{2})\b/);
  if(sigla && Object.values(UFS).includes(sigla[1].toUpperCase())) uf = sigla[1].toUpperCase();
  if(!uf) for(const [nome, s] of Object.entries(CIDADES)) if(new RegExp('\\b' + nome + '\\b').test(norm)){ uf = s; break; }
  if(!uf) for(const [nome, s] of Object.entries(UFS)) if(new RegExp('\\b' + nome + '\\b').test(norm)){ uf = s; break; }

  // anos de experiência: menção explícita ou soma de intervalos de datas
  let anos = null;
  const exp = norm.match(/(\d{1,2})\s*anos?\s*(de\s*)?(experiencia|atuacao|carreira)/) || norm.match(/(experiencia|atuacao)\s*(de|com)?\s*(\d{1,2})\s*anos/);
  if(exp){ const n = +(exp[1] || exp[3]); if(n > 0 && n <= 45) anos = n; }
  if(anos === null){
    const anoAtual = new Date().getFullYear();
    const faixas = [...norm.matchAll(/\b(19[89]\d|20[0-4]\d)\s*(?:-|a|ate|–)\s*(19[89]\d|20[0-4]\d|atual|presente|hoje|momento)\b/g)];
    let soma = 0;
    for(const f of faixas){ const a = +f[1]; const b = /\d/.test(f[2]) ? +f[2] : anoAtual; if(b >= a && b - a <= 40) soma += b - a; }
    if(soma > 0) anos = Math.min(soma, 45);
  }

  // resumo: seção nomeada, senão o primeiro parágrafo com cara de prosa
  let resumo = '';
  const paragrafos = texto.split(/\n\s*\n/).map(p => p.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const idxSecao = paragrafos.findIndex(p => /^(resumo|perfil|sobre mim|sobre|objetivo|apresentacao|summary)\b/i.test(normalizar(p)));
  if(idxSecao >= 0){
    const mesmo = paragrafos[idxSecao].replace(/^[^\n:]{0,25}[:\n]\s*/, '');
    resumo = mesmo.length > 60 ? mesmo : (paragrafos[idxSecao + 1] || '');
  }
  if(!resumo) resumo = paragrafos.find(p => p.length > 80 && p.length < 900 && !/@|\(\d{2}\)|\d{5}-?\d{3}|linkedin/i.test(p)) || '';
  resumo = resumo.slice(0, 700);

  // modelos de trabalho citados
  const modelos = [];
  if(/\bremot[oa]\b|home office|trabalho remoto/.test(norm)) modelos.push('remoto');
  if(/\bhibrid[oa]\b/.test(norm)) modelos.push('hibrido');
  if(/\bpresencial\b/.test(norm)) modelos.push('presencial');

  return {competencias, areaId, cargos, uf, anos, resumo, modelos,
    caracteres: texto.length, palavras: (texto.match(/\S+/g) || []).length};
}

/* ══════════════════ POLÍTICA DA VERSÃO OPERADA ══════════════════

   Derivada da política publicada no core (POLITICA, injetada pelo build),
   nunca escrita à mão. A única diferença é o peso cultural: zero.

   Motivo: nesta versão nem a empresa nem o candidato preenchem os 14
   eixos de ambiente. Com eixo neutro dos dois lados o fit cultural daria
   100 para todo mundo e inflaria o total sem dizer nada. Técnico e
   contexto são renormalizados para somar 1, mantendo a proporção entre
   eles que cada família já tinha. A validação do core aceita isso: só
   exige que a soma seja 1. */
const POLITICA_VAGAS = Object.freeze({
  ...POLITICA,
  policy_version: 'policy-vagas-' + POLITICA.policy_version.replace(/^policy-/, ''),
  pesos_por_familia: Object.freeze(Object.fromEntries(
    Object.entries(POLITICA.pesos_por_familia).map(([fam, w]) => {
      const t = Math.round(w.tecnico / (w.tecnico + w.contexto) * 100) / 100;
      return [fam, Object.freeze({tecnico: t, cultural: 0, contexto: Math.round((1 - t) * 100) / 100})];
    }))),
});

/* ══════════════════ TAXONOMIA · ACRÉSCIMOS DA VERSÃO OPERADA ══════════════════

   A taxonomia base (prototipo-front/partes/js/10-taxonomia.js) entra

   família própria usa `_padrao` de propósito, e o admin mostra isso. */

function acrescentar(lista, mapa, itens){
  for(const it of itens){
    if(mapa[it.id]) throw new Error('id repetido na taxonomia: ' + it.id);
    lista.push(it); mapa[it.id] = it;
  }
}

   primeira obrigatória. Quem publica ajusta na tela da vaga. */
function requisitosDoCargo(cargoId){
  const c = CARGO[cargoId]; if(!c) return [];
  const pesos = [3, 2, 2, 1];
  return c.sk.slice(0, 4).map((skillId, i) => ({skillId, peso:pesos[i], obrigatorio:i === 0}));
}

/* Maior valor em reais citado na faixa, para comparar com a pretensão.
   "A combinar" não tem número, e aí a pretensão simplesmente não entra
   no cálculo em vez de penalizar alguém por uma faixa que não existe. */
function tetoDaFaixa(txt){
  const nums = (String(txt || '').match(/\d[\d.]*/g) || [])
    .map(n => Number(n.replace(/\./g, ''))).filter(n => n >= 500);
  return nums.length ? Math.max(...nums) : null;
}

/* ══ parte: partes/js/20-banco.js ══ */
/* ══════════════════ BANCO LOCAL ══════════════════

   No app real isto é o Supabase. Aqui é um objeto só, guardado no
   navegador, com as mesmas tabelas do plano: empresas, vagas, candidatos,
   candidaturas (com o histórico dentro). A forma dos registros é a mesma
   que as migrations vão ter, para o João testar exatamente o que vai
   existir depois.

   Tudo que muda dado passa por salvar(). O storage pode não existir (aba
   anônima, prévia, bloqueio de dados do site): a página funciona igual,
   só não lembra de nada ao recarregar. */

const CHAVE_BANCO = 'conectaria.vagas.teste.v1';
const DIA = 86400000;

let DB = null;

const S = {
  papel: 'cand',          // 'cand' | 'admin' — a troca do topo
  userId: null,           // candidato logado, no lado do candidato
  view: 'vagas', arg: null,
  q: '', area: null,      // vitrine
  vagaAlvo: null,         // vaga para voltar depois do cadastro
  cad: null,              // cadastro em andamento
  adm: {vagaSel:null, etapa:null, busca:'', stVagas:'publicada', tal:{area:'', uf:'', q:'', vaga:''}},
};

function salvar(){
  try{
    localStorage.setItem(CHAVE_BANCO, JSON.stringify({
      db: DB,
      sessao: {papel:S.papel, userId:S.userId, vagaAlvo:S.vagaAlvo, cad:S.cad, vagaSel:S.adm.vagaSel},
    }));
  }catch(_){}
}
function carregar(){
  try{
    const bruto = localStorage.getItem(CHAVE_BANCO);
    if(!bruto) return false;
    const d = JSON.parse(bruto);
    if(!d || !d.db || !Array.isArray(d.db.vagas)) return false;
    DB = d.db;
    const s = d.sessao || {};
    S.papel = s.papel === 'admin' ? 'admin' : 'cand';
    S.userId = s.userId && DB.candidatos.some(c => c.id === s.userId) ? s.userId : null;
    S.vagaAlvo = s.vagaAlvo || null;
    S.cad = s.cad || null;
    S.adm.vagaSel = s.vagaSel || null;
    return true;
  }catch(_){ return false; }
}

const iso = t => new Date(t).toISOString();
function novoId(prefixo){
  DB.seq = (DB.seq || 0) + 1;
  return prefixo + '-' + Date.now().toString(36) + DB.seq.toString(36);
}

/* Estado de partida: empresas e vagas do site atual, mais os exemplos. */
function semear(){
  const base = Date.now();
  DB = {versao:1, base, seq:0, empresas:[], vagas:[], candidatos:[], candidaturas:[]};
  DB.empresas = EMPRESAS_SEED.map(e => ({...e, site:'', cnpj:'', contato:'', obs:'', criadaEm:iso(base - 60 * DIA)}));
  DB.vagas = VAGAS_SEED.map(([id, empresaId, cargoId, titulo, local, uf, modelo, regime, faixa, resumo, conectaria, dias]) => ({
    id, empresaId, cargoId, areaId:CARGO[cargoId].a, titulo, local, uf, modelo, regime, faixa,
    faixaMax: tetoDaFaixa(faixa), resumo,
    descricao: resumo + '\n\nA Conectaria faz a primeira conversa com você e acompanha todas as etapas até a resposta final da empresa.',
    conectaria, status:'publicada', requisitos: requisitosDoCargo(cargoId),
    criadaEm: iso(base - dias * DIA), publicadaEm: iso(base - dias * DIA), __v:0,
  }));
  gerarExemplos(base);
  S.userId = null; S.cad = null; S.vagaAlvo = null; S.adm.vagaSel = null;
  salvar();
}

/* ── consultas ── */
const empresaPor = id => DB.empresas.find(e => e.id === id);
const vagaPor = id => DB.vagas.find(v => v.id === id);
const candidatoPor = id => DB.candidatos.find(c => c.id === id);
const candidaturaPor = id => DB.candidaturas.find(a => a.id === id);
const candidaturasDaVaga = vid => DB.candidaturas.filter(a => a.vagaId === vid);
const candidaturasDoCandidato = cid => DB.candidaturas.filter(a => a.candidatoId === cid);
const vagasPublicadas = () => DB.vagas.filter(v => v.status === 'publicada');
const eu = () => S.userId ? candidatoPor(S.userId) : null;
const jaCandidatou = (cid, vid) => DB.candidaturas.some(a => a.candidatoId === cid && a.vagaId === vid);

/* Único lugar que incrementa versão de vaga ou candidato. É o que avisa
   o pipeline de que o fit congelado ficou para trás. */
function tocar(e){ if(e) e.__v = (e.__v || 0) + 1; }

/* Cria candidatura. Serve o candidato (origem site) e a Conectaria
   (origem banco, quando ela traz alguém do banco de talentos). */
function criarCandidatura(cid, vid, origem, quem){
  if(jaCandidatou(cid, vid)) return null;
  const agora = iso(Date.now());
  const ap = {id:novoId('ap'), vagaId:vid, candidatoId:cid, etapa:0, status:'ativa', motivoId:null,
    nota:'', favorito:false, origem, criadaEm:agora, atualizadaEm:agora,
    historico:[{de:null, para:0, em:agora, quem, status:'ativa'}], rec:null, recAnteriores:[]};
  DB.candidaturas.push(ap);
  salvar();
  return ap;
}

/* ══ parte: partes/js/21-match.js ══ */
/* ══════════════════ MATCH (SÓ A CONECTARIA VÊ) ══════════════════

   Mesmo motor do core (evaluate, em prototipo-front/partes/js/01-motor.js),
   com a política da versão operada. Três ajustes, todos na entrada, nunca
   na fórmula:

   1. Eixos culturais neutros dos dois lados. Com peso cultural zero eles
      não mexem no total; existem só porque o motor os exige na projeção.
   2. Confiança do conjunto = menor entre técnico e contexto. A cultural
      fica de fora, porque ninguém preencheu eixo nenhum e ela não pode
      derrubar (nem sustentar) a recomendação.
   3. Pretensão só entra quando a vaga tem faixa com número. "A combinar"
      não pode reprovar ninguém por pretensão.

   O resultado é congelado na candidatura (montarRec) na primeira vez que
   a Conectaria abre o pipeline. Nunca é calculado na tela do candidato:
   no app real isso roda do lado da Conectaria, onde não dá para adulterar. */

const NEUTROS = Object.freeze(Object.fromEntries(EIXO_IDS.map(id => [id, sv(50, 'curator', 1)])));

function entidadeCandidato(c, comPretensao){
  return {
    id: c.id, versao: 'cand-v' + (c.__v || 0),
    uf: sv(c.uf || '', 'user', 1),
    modelos: sv(c.modelos || [], 'user', 1),
    pretensao: comPretensao && c.pretensao ? sv(Number(c.pretensao), 'user', 1) : undefined,
    competencias: (c.competencias || []).map(x => ({skillId:x.skillId, nivel:sv(x.nivel, 'user', 1)})),
    eixos: NEUTROS,
  };
}
function entidadeVaga(v){
  return {id:v.id, versao:'vaga-v' + (v.__v || 0), empresaId:v.empresaId, familia:familiaDaVaga(v),
    uf:v.uf, modelo:v.modelo, faixaMax:v.faixaMax || undefined, requisitos:v.requisitos};
}

function avaliar(c, v){
  const r = evaluate({candidato:entidadeCandidato(c, !!v.faixaMax), vaga:entidadeVaga(v),
    empresa:{eixos:NEUTROS}, politica:POLITICA_VAGAS, rotuloSkill:skillNome});
  r.confidence = Math.min(r.tecnico.confidence, r.contexto.confidence);
  r.decisoes = avaliarPoliticas(r, POLITICA_VAGAS);
  r.desfecho = desfechoFinal(r.decisoes);
  return r;
}

const chaveRec = (c, v) => c.id + '@' + (c.__v || 0) + '|' + v.id + '@' + (v.__v || 0) + '|' + POLITICA_VAGAS.policy_version;

/* Snapshot no formato que 36-painel-base e 37-pipeline-base esperam.
   cultural_ev vai vazio: não há evidência cultural nesta versão, e uma
   lista de "eixo alinhado, 0 pontos de distância" só confundiria. */
function montarRec(c, v, quando){
  const m = avaliar(c, v);
  return Object.freeze({
    total:m.total, tecnico:m.tecnico.nota, contexto:m.contexto.nota, cultural:null,
    confidence:m.confidence, desfecho:m.desfecho, decisoes:m.decisoes, pesos:m.pesos,
    tecnico_ev:m.tecnico.evidencias, cultural_ev:[], contexto_ev:m.contexto.evidencias,
    chave:chaveRec(c, v), geradoEm: quando || iso(Date.now()),
  });
}

function garantirRec(ap){
  if(ap.rec) return false;
  const c = candidatoPor(ap.candidatoId), v = vagaPor(ap.vagaId);
  if(!c || !v) return false;
  ap.rec = montarRec(c, v);
  return true;
}
function garantirRecs(){
  let mudou = false;
  DB.candidaturas.forEach(ap => { if(garantirRec(ap)) mudou = true; });
  if(mudou) salvar();
}
/* O perfil ou a vaga mudou depois do cálculo? */
function recDesatualizado(ap){
  const c = candidatoPor(ap.candidatoId), v = vagaPor(ap.vagaId);
  return !!(ap.rec && c && v && ap.rec.chave !== chaveRec(c, v));
}
/* Recalcula e arquiva o anterior. Nunca sobrescreve. */
function recalcularRec(ap){
  const c = candidatoPor(ap.candidatoId), v = vagaPor(ap.vagaId);
  const novo = montarRec(c, v);
  if(ap.rec) ap.recAnteriores.push(ap.rec);
  ap.rec = novo; ap.atualizadaEm = iso(Date.now());
  salvar();
  return novo;
}
/* Principal motivo em uma linha, para a tabela. */
function motivoPrincipal(rec){
  const ev = [...rec.tecnico_ev, ...rec.contexto_ev];
  const gap = ev.find(e => e.kind === 'gap' && e.reasonCode === 'REQ_OBRIGATORIO_AUSENTE')
    || ev.find(e => e.kind !== 'strength');
  return gap ? gap.humano : 'Cobre os requisitos e o contexto da vaga.';
}

/* ══ parte: partes/js/14-exemplos.js ══ */
/* ══════════════════ CANDIDATOS DE EXEMPLO ══════════════════

   Para o pipeline não abrir vazio no teste. Gerados de forma
   determinística a partir do id de cada vaga (mesmo PRNG do core), todos
   marcados com `exemplo: true`, e o painel tem um botão que remove todos
   de uma vez sem tocar no que foi cadastrado no teste.

   Nomes, e-mails e telefones são fictícios: e-mail em example.com e
   WhatsApp com o prefixo 90000, que não existe.

   Arquétipo controla a forma do perfil em relação à vaga, para o
   pipeline ter gente forte, mediana, fraca e o caso "furou o
   obrigatório" (o teto de nota existe para ele). */

const ARQ_EX = [
  {id:'forte',   p:.20, cob:1.00, nivel:3},
  {id:'bom',     p:.30, cob:0.80, nivel:3},
  {id:'mediano', p:.25, cob:0.60, nivel:2},
  {id:'furou',   p:.12, cob:0.75, nivel:3, pulaObrig:true},
  {id:'fraco',   p:.13, cob:0.35, nivel:1},
];
const NOMES_EX = ['Ana','Bruno','Camila','Diego','Eduarda','Felipe','Gabriela','Heitor','Isabela','João Pedro',
  'Karina','Lucas','Mariana','Natália','Otávio','Paula','Rafael','Sabrina','Thiago','Vanessa','Wesley','Yasmin',
  'Letícia','Marcos','Renata','Caio','Débora','Igor','Juliana','Leandro'];
const SOBRENOMES_EX = ['Albuquerque','Barros','Cavalcanti','Dantas','Esteves','Farias','Gusmão','Holanda','Lins',
  'Macedo','Nogueira','Pimentel','Queiroz','Rocha','Siqueira','Teixeira','Uchôa','Vasconcelos','Xavier','Moura'];
const CIDADE_UF = {PE:'Recife', SP:'São Paulo', MG:'Belo Horizonte', RJ:'Rio de Janeiro', SC:'Joinville',
  RS:'Porto Alegre', BA:'Salvador', PR:'Curitiba', AM:'Manaus', CE:'Fortaleza'};
const DDD_UF = {PE:'81', SP:'11', MG:'31', RJ:'21', SC:'47', RS:'51', BA:'71', PR:'41', AM:'92', CE:'85'};
const UFS_EX = Object.keys(CIDADE_UF);

const semAcento = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '');

function candidatoExemplo(r, n, areaId, cargoId, vaga, base){
  const arq = vaga ? sortearPonderado(r, ARQ_EX) : ARQ_EX[1];
  const nome = escolher(r, NOMES_EX) + ' ' + escolher(r, SOBRENOMES_EX);
  const slug = semAcento(nome.toLowerCase()).replace(/[^a-z]+/g, '.');
  const uf = vaga && UFS_EX.includes(vaga.uf) && r() < .75 ? vaga.uf : escolher(r, UFS_EX);
  const cargo = CARGO[cargoId];

  let cobre = [], fora = [];
  if(vaga){
    const obrig = vaga.requisitos.filter(x => x.obrigatorio).map(x => x.skillId);
    cobre = vaga.requisitos.map(x => x.skillId).filter(() => r() < arq.cob);
    // 'furou' tem de continuar sem o obrigatório: nem os extras do cargo podem devolvê-lo
    if(arq.pulaObrig){ cobre = cobre.filter(x => !obrig.includes(x)); fora = obrig; }
  }
  const extras = (cargo ? cargo.sk : []).filter(x => !cobre.includes(x) && !fora.includes(x)).slice(0, entre(r, 1, 2));
  const competencias = [...new Set([...cobre, ...extras])].map(skillId => ({
    skillId, nivel: Math.max(1, Math.min(3, arq.nivel - (r() < .3 ? 1 : 0))), de:'user'}));

  const modeloVaga = vaga ? vaga.modelo : 'presencial';
  const modelos = r() < .8 ? [...new Set([modeloVaga, r() < .5 ? 'hibrido' : 'presencial'])]
    : ['remoto', 'hibrido'].filter(m => m !== modeloVaga);
  const anos = entre(r, 1, 14);
  const [bmin, bmax] = cargo ? cargo.base : [2500, 5000];
  const cadastradoHa = entre(r, 3, 45);

  return {
    id: 'ex-' + String(n).padStart(3, '0'), exemplo:true,
    nome, email: slug + '@example.com',
    whatsapp: '(' + DDD_UF[uf] + ') 90000-' + String(entre(r, 1000, 9999)),
    linkedin: '', areaId, cargos: cargoId ? [cargoId] : [], competencias,
    uf, cidade: CIDADE_UF[uf], modelos,
    pretensao: Math.round((bmin + (bmax - bmin) * r() * 1.1) / 100) * 100,
    resumo: anos + (anos === 1 ? ' ano' : ' anos') + ' de experiência' + (cargo ? ' como ' + cargo.n.toLowerCase() : '') +
      '. Procuro uma oportunidade em que eu possa crescer e aplicar o que já sei.',
    anos, cvNome: r() < .6 ? slug.replace(/\./g, '-') + '-curriculo.docx' : null,
    fonte:'user', consentEm: iso(base - cadastradoHa * DIA), criadoEm: iso(base - cadastradoHa * DIA), __v:0,
    _cadastradoHa: cadastradoHa,
  };
}

function gerarExemplos(base){
  let n = 1;
  const ORIGENS_EX = ['site', 'site', 'site', 'whatsapp', 'indicacao', 'banco'];

  for(const v of DB.vagas){
    const r = prng(sementeDe('ex|' + v.id));
    const qtd = entre(r, 1, 4);
    for(let i = 0; i < qtd; i++){
      const c = candidatoExemplo(r, n++, v.areaId, v.cargoId, v, base);
      DB.candidatos.push(c);

      const rec = montarRec(c, v, iso(base));
      const etapa = etapaSorteada(r);
      const chanceReprovar = [.42, .34, .24, .14, .05][etapa];
      let status = 'ativa', motivoId = null;
      if(r() < chanceReprovar){ status = 'reprovada'; motivoId = motivoPara(r, rec, etapa); }
      else if(etapa === ETAPAS.length - 1 && r() < .5) status = 'contratada';

      // a candidatura nunca é anterior ao cadastro nem à publicação da vaga
      const vagaHa = Math.round((base - new Date(v.publicadaEm).getTime()) / DIA);
      const iniciouHa = Math.max(0, Math.min(c._cadastradoHa, vagaHa) - entre(r, 0, 2));
      const historico = [{de:null, para:0, em:iso(base - iniciouHa * DIA), quem:'candidato', status:'ativa'}];
      let cursor = iniciouHa;
      for(let e = 1; e <= etapa; e++){
        cursor = Math.max(0, cursor - entre(r, 1, 4));
        historico.push({de:e - 1, para:e, em:iso(Math.min(base, base - cursor * DIA + e * 3600000)), quem:'conectaria', status:'ativa'});
      }
      if(status !== 'ativa'){
        cursor = Math.max(0, cursor - entre(r, 0, 2));
        historico.push({de:etapa, para:etapa, em:iso(Math.min(base, base - cursor * DIA + 9 * 3600000)), quem:'conectaria',
          status, ...(motivoId ? {motivoId} : {})});
      }
      DB.candidaturas.push({
        id:'ap-' + c.id, vagaId:v.id, candidatoId:c.id, etapa, status, motivoId, nota:'',
        favorito: r() < .1, origem: escolher(r, ORIGENS_EX),
        criadaEm: historico[0].em, atualizadaEm: historico[historico.length - 1].em,
        historico, rec, recAnteriores:[],
      });
      delete c._cadastradoHa;
    }
  }

  // Banco de talentos: gente cadastrada que ainda não se candidatou a nada.
  // É quem a Conectaria procura quando abre uma vaga nova.
  for(const a of areasOrdenadas()){
    const r = prng(sementeDe('talento|' + a.id));
    const cargos = cargosDaArea(a.id);
    if(!cargos.length) continue;
    const c = candidatoExemplo(r, n++, a.id, escolher(r, cargos).id, null, base);
    delete c._cadastradoHa;
    DB.candidatos.push(c);
  }
}

/* ══ parte: prototipo-front/partes/js/31-ui-comp.js ══ */
/* ══════════════════ 11 · COMPONENTES ══════════════════ */

/* Medidor: anel externo é a nota, arco interno é a confiança. Duas
   informações que a plataforma nunca deve mostrar separadas, porque nota
   alta com confiança baixa é exatamente o caso que engana.             */
const R_NOTA=44, R_CONF=35;
const C_NOTA=2*Math.PI*R_NOTA, C_CONF=2*Math.PI*R_CONF;

function medidor(p, conf, grande){
  if(!S.logado) return '<span class="lockw"><span class="lock" title="Crie sua conta para ver">'+
    I.cad+'</span><small>aderência</small></span>';
  const est = p>=70 ? '' : p>=50 ? 'baixa' : 'blk';
  return '<span class="medw"><span class="med '+(grande?'g ':'')+est+'" data-p="'+p+'" data-c="'+
    conf.toFixed(4)+'" style="--circ:'+C_NOTA.toFixed(2)+';--circ2:'+C_CONF.toFixed(2)+'" '+
    'title="Aderência '+p+' de 100. O arco interno é a confiança do dado: '+pc(conf)+'." '+
    'role="img" aria-label="Aderência '+p+' de 100, confiança do dado '+pc(conf)+'">'+
    '<svg viewBox="0 0 100 100" aria-hidden="true">'+
      '<circle class="tr" cx="50" cy="50" r="'+R_NOTA+'"/>'+
      '<circle class="pr" cx="50" cy="50" r="'+R_NOTA+'"/>'+
      '<circle class="cf" cx="50" cy="50" r="'+R_CONF+'"/>'+
    '</svg><b data-n="'+p+'">0</b></span>'+
    '<small>'+(conf < POLITICA.confianca.revisar_abaixo_de ? 'match estimado' : 'match')+
    '</small></span>';
}

function contar(el, alvo){
  if(reduz()){ el.textContent=alvo; return; }
  const t0=performance.now(), dur=750;
  // Rede de segurança: requestAnimationFrame não roda em aba de segundo
  // plano. Sem isto, quem abre o link numa aba que não está à frente vê
  // "0 vagas" congelado até trocar de aba. O número correto vale mais que
  // a animação.
  const rede = setTimeout(() => { el.textContent = alvo; }, 1400);
  const passo = t => {
    const k = Math.min(1, (t - t0) / dur), eased = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(alvo * eased);
    if(k < 1) requestAnimationFrame(passo);
    else clearTimeout(rede);
  };
  requestAnimationFrame(passo);
}

function animaMed(){
  requestAnimationFrame(()=>$$('.med[data-p]').forEach((el,i)=>setTimeout(()=>{
    const p=+el.dataset.p, c=+el.dataset.c;
    const pr=$('.pr',el), cf=$('.cf',el);
    if(pr) pr.style.strokeDashoffset = (C_NOTA*(1-p/100)).toFixed(2);
    if(cf) cf.style.strokeDashoffset = (C_CONF*(1-c)).toFixed(2);
    const b=$('b',el); if(b) contar(b,p);
  }, 90+i*70)));
}
function animaEixos(){
  requestAnimationFrame(()=>$$('.eixo .t i[data-w]').forEach((el,i)=>
    setTimeout(()=>{el.style.width=el.dataset.w+'%'}, 140+i*80)));
  requestAnimationFrame(()=>$$('.cbar i[data-w]').forEach((el,i)=>
    setTimeout(()=>{el.style.width=el.dataset.w+'%'}, 200+i*80)));
}

/* Evidência: nota nunca viaja sozinha. Cada afirmação carrega o código
   de razão e a feature que a originou, para a explicação ser auditável
   e não só simpática.                                                  */
const EV_IC = {strength:'✓', gap:'!', constraint:'×'};
function evidencias(list, limite){
  const l = limite ? list.slice(0,limite) : list;
  if(!l.length) return '';
  // --i alimenta o atraso em cascata: a lista já vem ordenada por peso,
  // então a cascata acompanha a ordem de importância em vez de contrariá-la
  return '<div class="evs">'+l.map((e,i)=>
    '<div class="ev '+e.kind+'" style="--i:'+Math.min(i,12)+'">'+
    '<span class="ei" aria-hidden="true">'+EV_IC[e.kind]+'</span>'+
    '<div><p>'+esc(e.humano)+'</p><code>'+esc(e.reasonCode)+' · '+esc(e.featureId)+'</code></div></div>'
  ).join('')+'</div>';
}

const selo = o => '<span class="gt '+o+'"><i></i>'+GATE_ROT[o]+'</span>';

function portao(m){
  return '<div class="gtbox">'+selo(m.desfecho)+
    '<ul>'+m.decisoes.map(d=>'<li>'+esc(RAZAO[d.reasonCode]||d.reasonCode)+'</li>').join('')+'</ul></div>';
}

const provenienciaSelo = f =>
  '<span class="prov '+f+'"><i></i>'+esc(FONTE_ROT[f]||f)+'</span>';

/* Radar: os 14 eixos de uma vez. Três barras dizem quanto; o radar diz
   onde. É a única leitura em que a forma da distância aparece inteira. */
function radar(cand, emp){
  const n=EIXOS.length, cx=120, cy=116, R=76;
  const ang = i => (Math.PI*2*i/n) - Math.PI/2;
  const pt = (i,v) => [cx+Math.cos(ang(i))*R*(v/100), cy+Math.sin(ang(i))*R*(v/100)];
  const poly = vals => vals.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');

  const vc = EIXOS.map(e=>cand[e.id].value);
  const ve = EIXOS.map(e=>emp[e.id].value);

  const aneis = [25,50,75,100].map(r=>
    '<polygon class="malhaR" points="'+poly(EIXOS.map(()=>r))+'"/>').join('');
  const raios = EIXOS.map((e,i)=>{
    const [x,y]=pt(i,100);
    return '<line class="spoke" x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>';
  }).join('');
  const rots = EIXOS.map((e,i)=>{
    const [x,y]=pt(i,127);
    const a = Math.cos(ang(i));
    const anc = a>0.25?'start':a<-0.25?'end':'middle';
    return '<text class="lbl" x="'+x.toFixed(1)+'" y="'+(y+2.5).toFixed(1)+'" text-anchor="'+anc+'">'+
      esc(e.curto)+'</text>';
  }).join('');
  const pontos = EIXOS.map((e,i)=>{
    const [x,y]=pt(i,vc[i]);
    const d=Math.abs(vc[i]-ve[i]);
    return '<circle class="dotp'+(d>e.tolerancia?' fora':'')+'" cx="'+x.toFixed(1)+'" cy="'+
      y.toFixed(1)+'" r="2" style="--i:'+i+'" data-eixo="'+e.id+'"/>';
  }).join('');

  return '<div class="radarw"><svg class="radar" viewBox="0 0 240 236" role="img" '+
    'aria-label="Radar comparando os 14 eixos do candidato com os da empresa">'+
    aneis+raios+
    '<polygon class="polE" points="'+poly(ve)+'"/>'+
    '<polygon class="polC" points="'+poly(vc)+'"/>'+
    pontos+rots+'</svg></div>'+
    '<div class="radarleg"><span><i></i>você</span><span><i class="e"></i>empresa</span>'+
    '<span style="color:var(--al)">● fora da tolerância</span></div>';
}

/* Sparkline para os KPIs: número sozinho não diz direção. */
function spark(vals){
  const w=120,h=26,max=Math.max(...vals),min=Math.min(...vals),amp=(max-min)||1;
  const px=(v,i)=>[ (i/(vals.length-1))*w, h-((v-min)/amp)*(h-4)-2 ];
  const d=vals.map((v,i)=>px(v,i).map(x=>x.toFixed(1)).join(',')).map((p,i)=>(i?'L':'M')+p).join(' ');
  const fim=px(vals[vals.length-1],vals.length-1);
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<path class="fill" d="'+d+' L'+w+','+h+' L0,'+h+' Z"/><path d="'+d+'"/>'+
    '<circle cx="'+fim[0].toFixed(1)+'" cy="'+fim[1].toFixed(1)+'" r="2.2"/></svg>';
}

/* Revelação escalonada na rolagem. Um observador só, reaproveitado. */
/* Revelação por rolagem.

   O estado inicial é aplicado AQUI, por JS, e nunca no CSS. A diferença
   não é estilística: com `opacity:0` no CSS, qualquer coisa que impeça o
   observador de rodar — script quebrado, navegador antigo, aba que o
   sistema congelou — entrega uma página em branco com o conteúdo todo
   presente no DOM. Já vi acontecer nesta peça.

   Por isso, além do observador, existe um prazo: passados 2,5s, o que
   ainda estiver escondido aparece de qualquer jeito. Animação não pode
   ser condição para o conteúdo existir. */
function mostrar(el){
  el.style.opacity = '';
  el.style.transform = '';
  el.classList.add('vis');
}
const io = ('IntersectionObserver' in window) ? new IntersectionObserver(ents=>{
  ents.forEach((en,i)=>{ if(en.isIntersecting){
    setTimeout(()=>mostrar(en.target), i*60);
    io.unobserve(en.target);
  }});
},{rootMargin:'0px 0px -40px 0px'}) : null;

function revelar(escopo){
  const alvos = $$('.rv:not(.vis)', escopo);
  if(!io || reduz()){ alvos.forEach(mostrar); return; }
  alvos.forEach(el=>{
    el.style.opacity = '0';
    el.style.transform = 'translateY(14px)';
    io.observe(el);
  });
  setTimeout(()=>alvos.forEach(el=>{ if(!el.classList.contains('vis')) mostrar(el); }), 2500);
}

/* ══ parte: prototipo-front/partes/js/34-cnpj.js ══ */
/* ══════════════════ CNPJ ══════════════════
   Compartilhado entre o protótipo e o Conectaria Vagas (montar.py).

   Dígito verificador de CNPJ, mod 11. Confirma só que o número está bem
   formado, não que a empresa existe de verdade — por isso o texto na
   tela diz "formato válido", nunca "verificado". Consulta cadastral real
   é integração que este protótipo não tem. */
function validarCNPJ(cnpj){
  const d = String(cnpj || '').replace(/\D/g, '');
  if(d.length !== 14) return false;
  if(/^(\d)\1{13}$/.test(d)) return false; // todos os dígitos iguais: formalmente inválido
  const calc = base => {
    const pesos = base.length === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2];
    const soma = base.split('').reduce((a, n, i) => a + (+n) * pesos[i], 0);
    const resto = soma % 11;
    return resto < 2 ? 0 : 11 - resto;
  };
  const dv1 = calc(d.slice(0, 12));
  const dv2 = calc(d.slice(0, 12) + dv1);
  return d === d.slice(0, 12) + String(dv1) + String(dv2);
}
function mascararCNPJ(v){
  const d = String(v || '').replace(/\D/g, '').slice(0, 14);
  return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2}\.\d{3})(\d)/, '$1.$2')
    .replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
}

/* ══════════════════ DESCRIÇÃO DE VAGA POR IA ══════════════════
   Compartilhado entre o protótipo e o Conectaria Vagas (montar.py).

   "IA sugere, pessoa confirma" — a mesma regra da extração de currículo
   (16-extracao.js), do outro lado do match. Nada aqui chama serviço
   externo: é um rascunho por template a partir do que quem cadastra já
   preencheu, sempre editável antes de publicar. Trocar por um modelo de
   linguagem de verdade é mexer só nesta função.

   `extras` é opcional: {empresa, regime, requisitos:[nomes], obrigatorios:[nomes]}.
   Sem ele sai o parágrafo curto de sempre. */
const FAMILIA_ROTINA = {
  'Gente':       ['cuidar dos processos de pessoas do dia a dia', 'apoiar as lideranças em decisões de gente', 'acompanhar clima e retenção do time'],
  'Liderança':   ['liderar o time e distribuir a rotina entre as pessoas', 'reportar resultados e prioridades para a diretoria', 'desenvolver quem está no time'],
  'Tecnologia':  ['desenvolver e manter os sistemas em produção', 'participar do planejamento técnico do time', 'resolver problemas de performance e estabilidade'],
  'Marketing':   ['planejar e executar campanhas', 'acompanhar métricas de canal e ajustar investimento', 'alinhar a mensagem com o time comercial'],
  'Financeiro':  ['acompanhar os indicadores financeiros do mês', 'apoiar o fechamento e as conciliações', 'dar suporte a decisões de orçamento'],
  'Operações':   ['garantir que a operação rode dentro do padrão', 'acompanhar indicadores de produtividade e qualidade', 'resolver gargalos do dia a dia'],
  'Produto':     ['priorizar o backlog junto com o time', 'conduzir descoberta com usuários', 'acompanhar métricas de uso do produto'],
  'Atendimento': ['atender e resolver as demandas dos clientes', 'acompanhar indicadores de SLA e satisfação', 'escalar os casos fora do padrão'],
  'Vendas':      ['prospectar e qualificar oportunidades', 'conduzir negociações até o fechamento', 'acompanhar a carteira e a meta do mês'],
};
function gerarDescricaoVaga(cargo, local, familia, extras){
  const cidade = (local || '').split(',')[0].trim() || 'nossa unidade';
  const cargoTxt = (cargo || '').trim() || 'a posição';
  const [r1, r2, r3] = FAMILIA_ROTINA[familia] || FAMILIA_ROTINA['Operações'];
  const base = 'Buscamos ' + cargoTxt + ' para atuar em ' + cidade + '. No dia a dia, a pessoa vai ' +
    r1 + ', ' + r2 + ' e ' + r3 + '. Valorizamos quem já passou por rotina parecida e consegue ' +
    'propor melhoria sem esperar processo pronto.';
  if(!extras) return base;

  const partes = [];
  if(extras.empresa) partes.push('Sobre a empresa\n' + extras.empresa + ' está contratando e conta com a Conectaria para conduzir o processo.');
  partes.push('Sobre a vaga\n' + base);
  const obrig = extras.obrigatorios || [], desej = (extras.requisitos || []).filter(n => !obrig.includes(n));
  if(obrig.length || desej.length){
    partes.push('O que buscamos\n' +
      obrig.map(n => '- Experiência com ' + n.toLowerCase() + ' (obrigatório)').concat(
      desej.map(n => '- ' + n + ' é um diferencial')).join('\n'));
  }
  if(extras.regime) partes.push('Contratação\n' + extras.regime + '.');
  partes.push('Como funciona\nA Conectaria faz a primeira conversa com você e acompanha todas as etapas até a resposta final da empresa.');
  return partes.join('\n\n');
}

/* ══ parte: prototipo-front/partes/js/36-painel-base.js ══ */
/* ══════════════════ PAINEL · BASE ══════════════════
   Compartilhado entre o protótipo e o Conectaria Vagas (montar.py).

   Uma função só calcula tudo (derivarDash), e nenhum widget faz conta
   dentro de template string. P é sempre um array de candidaturas no
   formato {etapa, status, motivoId, favorito, origem, criadaEm,
   historico[], rec} — a mesma função serve o painel geral e o cabeçalho
   de KPIs de uma vaga só. */
const media = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;

function derivarDash(P){
  const ativas = P.filter(a => a.status === 'ativa');
  const reprovadas = P.filter(a => a.status === 'reprovada');

  // Funil por HISTÓRICO, não por etapa atual: quem foi reprovado na
  // etapa 4 tem que contar como tendo passado pelas 1, 2 e 3.
  const alcancou = i => P.filter(a => a.historico.some(h => h.para >= i)).length;
  const funil = ETAPAS.map((n, i) => {
    const chegou = alcancou(i);
    const base = i === 0 ? P.length : alcancou(i - 1);
    return {n, chegou, taxa: base ? chegou / base : 0};
  });

  // tempo médio entre marcos consecutivos do histórico, por etapa de origem
  const temposPorEtapa = ETAPAS.map(() => []);
  P.forEach(a => {
    for(let i = 1; i < a.historico.length; i++){
      const h0 = a.historico[i - 1], h1 = a.historico[i];
      if(h0.para == null) continue;
      const dias = (new Date(h1.em) - new Date(h0.em)) / 86400000;
      if(dias >= 0) temposPorEtapa[h0.para].push(dias);
    }
  });

  const fontes = {};
  P.forEach(a => { fontes[a.origem] = (fontes[a.origem] || 0) + 1; });

  const porMotivo = {}, porGrupo = {};
  reprovadas.forEach(a => {
    porMotivo[a.motivoId] = (porMotivo[a.motivoId] || 0) + 1;
    const g = MOTIVO[a.motivoId]?.g || 'processo';
    porGrupo[g] = (porGrupo[g] || 0) + 1;
  });

  // "o motor já tinha avisado?": das reprovações cujo motivo tem um
  // reasonCode correspondente, em quantas esse reasonCode já estava nas
  // evidências do trace? É o sinal de calibração mais direto que existe.
  const comEng = reprovadas.filter(a => MOTIVO[a.motivoId]?.eng);
  const acertos = comEng.filter(a => {
    const ev = [...a.rec.tecnico_ev, ...a.rec.cultural_ev, ...a.rec.contexto_ev];
    return ev.some(e => e.reasonCode === MOTIVO[a.motivoId].eng);
  });

  return {
    total: P.length, emProcesso: ativas.length, favoritos: P.filter(a => a.favorito).length,
    contratados: P.filter(a => a.status === 'contratada').length,
    fitMedio: media(P.map(a => a.rec.total)),
    fitMedioAvancou: media(P.filter(a => a.etapa >= 2).map(a => a.rec.total)),
    confMedia: media(P.map(a => a.rec.confidence)),
    aguardandoDecisao: ativas.filter(a => a.rec.desfecho !== 'allow').length,
    retidasBlock: P.filter(a => a.rec.desfecho === 'block').length,
    retidasReview: P.filter(a => a.rec.desfecho === 'review').length,
    porEtapaAtiva: ETAPAS.map((n, i) => ({n, q: ativas.filter(a => a.etapa === i).length})),
    funil, tempoMedio: temposPorEtapa.map(media),
    fontes, porMotivo, porGrupo, reprovadasTotal: reprovadas.length,
    motorAcertos: comEng.length ? acertos.length / comEng.length : null, motorBaseN: comEng.length,
  };
}

/* classe 'n' é neutra: contagem sem juízo de valor, então a célula de
   status fica vazia em vez de um chip sem texto nenhum dentro. */
const linhaSaude = (n, val, classe) =>
  '<tr style="cursor:default"><td>'+n+'</td><td style="width:110px"><b>'+val+'</b></td>'+
  '<td style="width:130px">'+(classe==='n' ? '' :
    '<span class="pill '+classe+'">'+(classe==='al'?'atenção':'saudável')+'</span>')+'</td></tr>';

/* Número inteiro puro conta na entrada; o resto ("21 dias", "80%") entra
   direto, porque animar só metade de um rótulo fica pior que não animar. */
function kpi(l,n,d,sp){
  const puro = /^\d+$/.test(String(n));
  const valor = puro ? '<span class="tnum" data-kpi="'+n+'">0</span>' : n;
  return '<div class="kpi rv"><div class="l">'+l+'</div><div class="n">'+valor+'</div>'+
    '<div class="d">'+d+'</div>'+(sp?spark(sp):'')+'</div>';
}

/* ══ parte: prototipo-front/partes/js/37-pipeline-base.js ══ */
/* ══════════════════ PIPELINE · BASE ══════════════════
   Compartilhado entre o protótipo e o Conectaria Vagas (montar.py).
   Depende de ETAPAS, MOTIVO/MOTIVOS_REJEICAO, escolher() e salvar(),
   que cada alvo define. */

const DIST_ETAPA = [.34, .27, .18, .13, .08]; // onde a candidatura "parou", acumulado
function etapaSorteada(r){
  let k = r(), acc = 0;
  for(let i = 0; i < DIST_ETAPA.length; i++){ acc += DIST_ETAPA[i]; if(k <= acc) return i; }
  return DIST_ETAPA.length - 1;
}
/* motivo mais plausível quando a reprovação acontece NAQUELA etapa */
const MOTIVOS_POR_ETAPA = {
  0: ['mr-req', 'mr-exp', 'mr-local', 'mr-modelo'],
  1: ['mr-req', 'mr-exp', 'mr-cultura', 'mr-pretensao'],
  2: ['mr-cultura', 'mr-nivel', 'mr-outro'],
  3: ['mr-outro', 'mr-congelada', 'mr-desistiu'],
  4: ['mr-desistiu', 'mr-semresp'],
};

/* Puxa o motivo alinhado ao que o motor já apontou boa parte das vezes:
   é o que dá sinal real ao widget "o motor já tinha avisado?" no
   dashboard. O resto sorteia do vocabulário fechado da etapa. */
function motivoPara(r, rec, etapa){
  const gap = [...rec.tecnico_ev, ...rec.cultural_ev, ...rec.contexto_ev].find(e => e.kind !== 'strength');
  if(gap && r() < .55){
    const alinhado = MOTIVOS_REJEICAO.find(m => m.eng === gap.reasonCode);
    if(alinhado) return alinhado.id;
  }
  return escolher(r, MOTIVOS_POR_ETAPA[etapa] || ['mr-outro']);
}

/* ── ação única que muda estado de candidatura ──
   Toda mudança passa por aqui, e toda mudança empilha em `historico` —
   é de onde o funil do painel sai. `quem` diz de onde partiu: 'empresa'
   no protótipo, 'conectaria' na versão operada pela Conectaria. */
function aplicar(ap, acao){
  const antes = ap.etapa, agora = new Date().toISOString();
  switch(acao.tipo){
    case 'avancar':  ap.etapa = Math.min(ETAPAS.length - 1, ap.etapa + 1); ap.status = 'ativa'; break;
    case 'voltar':   ap.etapa = Math.max(0, ap.etapa - 1); break;
    case 'mover':
      if(!(acao.etapa >= 0 && acao.etapa < ETAPAS.length)) throw new Error('etapa inválida: ' + acao.etapa);
      ap.etapa = acao.etapa; ap.status = 'ativa';
      break;
    case 'reprovar':
      if(!MOTIVO[acao.motivoId]) throw new Error('motivo fora do vocabulário: ' + acao.motivoId);
      ap.status = 'reprovada'; ap.motivoId = acao.motivoId; ap.nota = acao.nota || '';
      break;
    case 'contratar': ap.status = 'contratada'; ap.etapa = ETAPAS.length - 1; break;
    case 'reabrir':   ap.status = 'ativa'; ap.motivoId = null; break;
    case 'favoritar': ap.favorito = !ap.favorito; break;
    default: throw new Error('ação desconhecida: ' + acao.tipo);
  }
  if(acao.tipo !== 'favoritar'){
    ap.historico.push({de:antes, para:ap.etapa, em:agora, quem:acao.quem || 'empresa',
      ...(ap.motivoId ? {motivoId:ap.motivoId} : {}), status:ap.status});
  }
  ap.atualizadaEm = agora;
  salvar();
}

/* ── modal ──
   Reaproveita o #modal do corpo. confirm() e prompt() não existem dentro
   do Artifact, então toda confirmação é um modal desta página. */
const FOCAVEIS = 'a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
let focoAntes = null;
function abrirModal(html){
  focoAntes = document.activeElement;
  $('#mbox').innerHTML = html;
  $('#scrim').classList.add('on'); $('#mbox').classList.add('on');
  $('#modal').setAttribute('aria-hidden', 'false');
  setTimeout(() => { const f = $('#mbox input, #mbox select, #mbox textarea') || $('#mbox button'); if(f) f.focus(); }, 60);
}
function fecharModal(){
  $('#scrim').classList.remove('on'); $('#mbox').classList.remove('on');
  $('#modal').setAttribute('aria-hidden', 'true');
  if(focoAntes && focoAntes.isConnected) focoAntes.focus();
}
function confirmar(titulo, texto, rotulo, acao, perigo){
  abrirModal('<h2 id="mTit">' + esc(titulo) + '</h2><p class="sub">' + texto + '</p>' +
    '<div class="form" style="gap:8px"><button class="btn w' + (perigo ? ' perigo' : '') + '" id="mOk">' + esc(rotulo) + '</button>' +
    '<button class="btn g w" id="mCancela">Cancelar</button></div>');
  $('#mCancela').onclick = fecharModal;
  $('#mOk').onclick = () => { fecharModal(); acao(); };
}
function prenderFoco(e){
  if(e.key !== 'Tab' || !$('#mbox').classList.contains('on')) return;
  const f = $$(FOCAVEIS, $('#mbox')).filter(x => x.offsetParent !== null);
  if(!f.length) return;
  const pri = f[0], ult = f[f.length - 1];
  if(e.shiftKey && document.activeElement === pri){ e.preventDefault(); ult.focus(); }
  else if(!e.shiftKey && document.activeElement === ult){ e.preventDefault(); pri.focus(); }
}

/* ── gaveta lateral (perfil do candidato no lado da Conectaria) ── */
let gavetaAberta = null;
function abrirGaveta(titulo, etiqueta, html, chave){
  gavetaAberta = chave || titulo;
  $('#drwTit').textContent = titulo;
  $('#drwId').textContent = etiqueta || '';
  $('#drwId').hidden = !etiqueta;
  $('#drwBody').innerHTML = html;
  $('#drw').classList.add('on'); $('#drw').setAttribute('aria-hidden', 'false');
  $('#drwX').focus();
}
function fecharGaveta(){
  gavetaAberta = null;
  $('#drw').classList.remove('on'); $('#drw').setAttribute('aria-hidden', 'true');
}

async function copiar(txt){
  try{ await navigator.clipboard.writeText(txt); toast('Copiado: ' + txt); }
  catch(_){ toast('Não consegui copiar. Selecione o texto e copie manualmente.', I.al); }
}

/* ══════════════════ VITRINE E PÁGINA DA VAGA ══════════════════
   O que qualquer pessoa vê, com ou sem cadastro. Nenhum percentual de
   aderência aparece deste lado: o match é ferramenta da Conectaria. */

function filtrarVagas(){
  const q = normalizar(S.q.trim());
  return vagasPublicadas()
    .filter(v => !S.area || v.areaId === S.area)
    .filter(v => {
      if(!q) return true;
      const e = empresaPor(v.empresaId);
      return normalizar([v.titulo, e.n, v.local, AREA[v.areaId].n, v.regime].join(' ')).includes(q);
    })
    .sort((a, b) => new Date(b.publicadaEm) - new Date(a.publicadaEm));
}

function vVagas(){
  const pub = vagasPublicadas();
  const porArea = {};
  pub.forEach(v => { porArea[v.areaId] = (porArea[v.areaId] || 0) + 1; });
  const areas = areasOrdenadas().filter(a => porArea[a.id]);

  $('#v-vagas').innerHTML =
  '<section class="heroc hv">' +
    '<h1>Vagas conectadas a você</h1>' +
    '<p>Oportunidades das empresas parceiras da Conectaria. Cadastre-se uma vez, candidate-se com um clique ' +
    'e acompanhe cada etapa por aqui. A nossa equipe fala com você pelo WhatsApp.</p>' +
  '</section>' +
  '<div class="buscador">' +
    '<div class="bfield">' + I.lupa + '<div style="flex:1;min-width:0">' +
      '<label for="q">Cargo, empresa ou cidade</label>' +
      '<input id="q" type="search" placeholder="Vendedor, Recife, estágio..." value="' + esc(S.q) + '"></div></div>' +
  '</div>' +
  '<div class="chips achips" role="group" aria-label="Filtrar por área">' +
    '<button class="chip" data-farea="" aria-pressed="' + !S.area + '">Todas <small>' + pub.length + '</small></button>' +
    areas.map(a => '<button class="chip" data-farea="' + a.id + '" aria-pressed="' + (S.area === a.id) + '">' +
      esc(a.n) + ' <small>' + porArea[a.id] + '</small></button>').join('') +
  '</div>' +
  '<p class="cont" id="contVagas" aria-live="polite"></p>' +
  '<div id="listaVagas"></div>' +
  '<section class="ctaeq">' +
    '<div><h3>Buscando uma vaga? A gente te apoia no processo.</h3>' +
    '<p>Fale com a nossa equipe para ter apoio na sua mentoria de carreira.</p></div>' +
    '<a class="btn" href="' + WHATS_EQUIPE + '" target="_blank" rel="noopener">Falar com a equipe</a>' +
  '</section>';

  $('#q').oninput = debounce(e => { S.q = e.target.value; renderListaVagas(); }, 160);
  $$('[data-farea]').forEach(b => b.onclick = () => {
    S.area = b.dataset.farea || null;
    $$('[data-farea]').forEach(x => x.setAttribute('aria-pressed', String((x.dataset.farea || null) === S.area)));
    renderListaVagas();
  });
  renderListaVagas();
}

function renderListaVagas(){
  const lista = filtrarVagas(), c = eu();
  $('#contVagas').textContent = plural(lista.length, 'vaga', 'vagas') + (S.area || S.q ? ' com esse recorte' : ' abertas');
  if(!lista.length){
    $('#listaVagas').innerHTML = '<div class="estado"><div class="ic">' + I.vazio + '</div>' +
      '<h3>Nenhuma vaga com esse recorte.</h3><p>Tente outro termo ou veja todas as áreas.</p>' +
      '<button class="btn" id="limpaVitrine">Ver todas as vagas</button></div>';
    $('#limpaVitrine').onclick = () => { S.q = ''; S.area = null; vVagas(); };
    return;
  }
  $('#listaVagas').innerHTML = '<div class="vagas">' + lista.map(v => {
    const e = empresaPor(v.empresaId), foi = c && jaCandidatou(c.id, v.id);
    return '<article class="vaga">' +
      '<button class="stretch" data-abrevaga="' + v.id + '" aria-label="Abrir vaga ' + esc(v.titulo) + ' em ' + esc(e.n) + '"></button>' +
      '<div class="conteudo">' +
        '<div class="vtopo">' + logoEmp(e) + '<b>' + esc(e.n) + '</b>' +
          '<span class="vsetor">' + esc(AREA[v.areaId].n) + '</span>' +
          (v.conectaria ? '<span class="tag trab">Vaga trabalhada pela Conectaria</span>' : '') + '</div>' +
        '<h3>' + esc(v.titulo) + '</h3>' +
        '<div class="vmeta"><span>' + I.pin + esc(v.local) + '</span><span>' + esc(v.regime) + '</span>' +
          '<span>' + tempoRel(v.publicadaEm) + '</span></div>' +
        '<p class="vres">' + esc(v.resumo) + '</p>' +
      '</div>' +
      '<div class="vdir">' + (foi ? '<span class="pill ok"><i></i>candidatura enviada</span>'
        : '<span class="vver">Ver vaga ' + I.ch + '</span>') + '</div>' +
    '</article>';
  }).join('') + '</div>';
  $$('[data-abrevaga]').forEach(b => b.onclick = () => ir('vaga', b.dataset.abrevaga));
}

function vVaga(id){
  const v = vagaPor(id);
  if(!v || (v.status !== 'publicada' && S.papel !== 'admin')){
    $('#v-vaga').innerHTML = '<div class="estado"><div class="ic">' + I.vazio + '</div><h3>Esta vaga não está mais aberta.</h3>' +
      '<p>Ela pode ter sido encerrada ou pausada. Veja as outras vagas publicadas.</p>' +
      '<button class="btn" data-ir="vagas">Ver vagas abertas</button></div>';
    return;
  }
  const e = empresaPor(v.empresaId), c = eu(), foi = c && jaCandidatou(c.id, v.id);
  const obrig = v.requisitos.filter(r => r.obrigatorio), desej = v.requisitos.filter(r => !r.obrigatorio);
  const paragrafos = String(v.descricao || v.resumo).split(/\n{2,}/).map(p => {
    const linhas = p.split('\n');
    const titulo = linhas.length > 1 && linhas[0].length < 40 && !/^[-•]/.test(linhas[0]) ? linhas.shift() : null;
    const itens = linhas.every(l => /^\s*[-•]/.test(l));
    return (titulo ? '<h4>' + esc(titulo) + '</h4>' : '') + (itens
      ? '<ul>' + linhas.map(l => '<li>' + esc(l.replace(/^\s*[-•]\s*/, '')) + '</li>').join('') + '</ul>'
      : '<p>' + linhas.map(esc).join('<br>') + '</p>');
  }).join('');

  $('#v-vaga').innerHTML =
  '<button class="volta" data-ir="' + (S.papel === 'admin' ? 'avagas' : 'vagas') + '">' + I.volta + (S.papel === 'admin' ? 'Vagas' : 'Todas as vagas') + '</button>' +
  (v.status !== 'publicada' ? '<div class="pend">' + I.al + '<div><b>Prévia.</b> Esta vaga está como ' + ST_VAGA[v.status][1].toLowerCase() + ' e não aparece para candidatos.</div></div>' : '') +
  '<div class="split"><div class="corpo">' +
    '<div class="emp">' + logoEmp(e) + '<b>' + esc(e.n) + '</b><span class="tag">' + esc(e.setor) + '</span></div>' +
    '<h1>' + esc(v.titulo) + '</h1>' +
    '<div class="meta" style="margin-bottom:var(--s3)"><span>' + I.pin + esc(v.local) + '</span>' +
      '<span>' + esc(MODELO_ROT[v.modelo]) + '</span><span>' + esc(v.regime) + '</span>' +
      '<span>' + esc(v.faixa) + '</span></div>' +
    (v.conectaria ? '<p class="tag trab" style="display:inline-flex;margin-bottom:var(--s2)">Vaga trabalhada pela Conectaria</p>' : '') +
    paragrafos +
    (v.requisitos.length ? '<h4>O que a vaga pede</h4><ul>' +
      obrig.map(r => '<li><b>' + esc(skillNome(r.skillId)) + '</b> <span class="pill al">obrigatório</span></li>').join('') +
      desej.map(r => '<li>' + esc(skillNome(r.skillId)) + ' <span class="pill n">diferencial</span></li>').join('') + '</ul>' : '') +
  '</div><aside class="lateral">' +
    '<div class="box">' +
      (S.papel === 'admin'
        ? '<p class="hint" style="margin:0">Você está vendo como a Conectaria. Troque para "Candidato" no topo para testar a candidatura.</p>'
        : foi
        ? '<button class="btn w" disabled>' + I.ok + 'Candidatura enviada</button>' +
          '<p class="mini" style="text-align:center">Acompanhe em Minhas candidaturas.</p>'
        : '<button class="btn w" id="btCandidatar">Candidatar-se</button>' +
          '<p class="mini">' + (c
            ? 'Seu perfil já está pronto. A candidatura vai com ele, e a equipe da Conectaria fala com você pelo WhatsApp.'
            : 'Primeira vez aqui? O cadastro leva poucos minutos e serve para todas as vagas.') + '</p>') +
    '</div>' +
    '<div class="box"><h4>Sobre a empresa</h4>' +
      '<div class="linha"><span>Setor</span><b>' + esc(e.setor) + '</b></div>' +
      '<div class="linha"><span>Onde</span><b>' + esc(e.cidade) + '</b></div>' +
      (e.site ? '<div class="linha"><span>Site</span><b>' + esc(e.site) + '</b></div>' : '') +
    '</div>' +
    '<div class="box"><h4>Dúvidas sobre a vaga?</h4>' +
      '<p class="hint">Fale com a equipe da Conectaria no WhatsApp ' + NUMERO_EQUIPE + '.</p>' +
      '<a class="btn g sm w" href="' + WHATS_EQUIPE + '" target="_blank" rel="noopener">Falar com a equipe</a></div>' +
  '</aside></div>';

  const bt = $('#btCandidatar');
  if(bt) bt.onclick = () => {
    if(eu()) candidatar(v.id);
    else { S.vagaAlvo = v.id; iniciarCadastro(); }
  };
}

/* Único caminho pelo qual o candidato fecha uma candidatura. */
async function candidatar(vid){
  const c = eu(); if(!c || jaCandidatou(c.id, vid)) return;
  const b = $('#btCandidatar');
  if(b){ b.disabled = true; b.innerHTML = '<span class="spin"></span>Enviando'; }
  await espera(480);
  criarCandidatura(c.id, vid, 'site', 'candidato');
  S.vagaAlvo = null; salvar();
  ir('minhas');
  toast('Candidatura enviada. A equipe da Conectaria vai falar com você pelo WhatsApp.');
}

/* ══ parte: partes/js/41-cadastro.js ══ */
/* ══════════════════ CADASTRO DO CANDIDATO ══════════════════

   Três passos, na ordem em que a pessoa pensa: quem sou (conta), o que
   eu já fiz (currículo), confere e confirma (revisão). Tudo o que o
   protótipo completo tinha e não serve para a Conectaria operar saiu:
   eixos de ambiente, visibilidade por bloco, página de avisos, painel de
   confiança.

   O que veio do currículo continua sendo sugestão: entra marcado "do
   currículo" e só vira perfil quando a pessoa confirma. É a mesma regra
   do protótipo, com uma tela só no lugar de cinco. */

function cadNovo(){
  return {passo:1, editando:null, conta:{nome:'', email:'', whatsapp:''}, fonte:null, arquivo:null,
    lendo:false, falha:null, achado:null, erros:[], consent:{termos:false, compartilhar:false},
    rev:{areaId:null, cargos:[], competencias:[], resumo:'', anos:null, uf:'', cidade:'', modelos:[], pretensao:null, linkedin:''}};
}
function iniciarCadastro(){
  if(!S.cad || S.cad.editando) S.cad = cadNovo();
  salvar(); ir('cadastro');
}
function editarPerfil(){
  const c = eu(); if(!c) return;
  const cad = cadNovo();
  cad.passo = 3; cad.editando = c.id; cad.fonte = 'manual';
  cad.conta = {nome:c.nome, email:c.email, whatsapp:c.whatsapp};
  cad.consent = {termos:true, compartilhar:true};
  cad.rev = {areaId:c.areaId, cargos:[...(c.cargos || [])],
    competencias:(c.competencias || []).map(x => ({skillId:x.skillId, nivel:x.nivel, de:'user', ok:true})),
    resumo:c.resumo || '', anos:c.anos, uf:c.uf || '', cidade:c.cidade || '', modelos:[...(c.modelos || [])],
    pretensao:c.pretensao, linkedin:c.linkedin || ''};
  S.cad = cad; salvar(); ir('cadastro');
}

const PASSOS_CAD = ['Conta', 'Currículo', 'Revisão'];

function vCadastro(){
  if(!S.cad) S.cad = cadNovo();
  const k = S.cad;
  const corpo = k.passo === 1 ? passoConta(k) : k.passo === 2 ? passoCurriculo(k) : passoRevisao(k);
  $('#v-cadastro').innerHTML = '<div class="onb">' +
    (k.editando ? '' : '<ol class="stp stp3" aria-label="Etapas do cadastro">' + PASSOS_CAD.map((p, i) =>
      '<li class="' + (i + 1 < k.passo ? 'ok' : i + 1 === k.passo ? 'on' : '') + '"><i></i><span>' + p + '</span></li>').join('') + '</ol>') +
    '<div class="onbc"><div class="onbg"><div class="onbm">' + corpo + '</div>' + ladoCadastro(k) + '</div></div></div>';
  ligarCadastro(k);
}

function ladoCadastro(k){
  return '<aside class="onbl"><div class="box">' +
    '<h4>' + I.spark + ' Como funciona</h4>' +
    '<ol class="comofunc">' +
      '<li><b>Cadastro único.</b> Serve para todas as vagas, e você edita quando quiser.</li>' +
      '<li><b>Candidatura com um clique.</b> Seu perfil vai junto.</li>' +
      '<li><b>A equipe fala com você.</b> A Conectaria conduz o processo e chama pelo WhatsApp.</li>' +
    '</ol>' +
    (S.vagaAlvo && vagaPor(S.vagaAlvo) ? '<p class="porque">Ao terminar, sua candidatura para <b>' +
      esc(vagaPor(S.vagaAlvo).titulo) + '</b> é enviada.</p>' : '') +
  '</div></aside>';
}

function avisoErros(k){
  return k.erros.length ? '<div class="pend" role="alert">' + I.al + '<div><b>Falta pouco.</b> ' + esc(k.erros.join(' ')) + '</div></div>' : '';
}

/* ── 1 · conta ── */
function passoConta(k){
  const c = k.conta;
  return '<h1>Crie seu cadastro</h1>' +
    '<p class="lead">Só o essencial para a equipe da Conectaria falar com você.</p>' + avisoErros(k) +
    '<form class="form" id="fConta" novalidate>' +
      '<div class="fg"><label for="cNome">Nome completo</label><input id="cNome" autocomplete="name" value="' + esc(c.nome) + '"></div>' +
      '<div class="dupla"><div class="fg"><label for="cEmail">E-mail</label><input id="cEmail" type="email" autocomplete="email" value="' + esc(c.email) + '"></div>' +
      '<div class="fg"><label for="cWhats">WhatsApp</label><input id="cWhats" inputmode="tel" autocomplete="tel" placeholder="(81) 99999-9999" value="' + esc(c.whatsapp) + '"></div></div>' +
      '<div class="fg"><label for="cSenha">Senha</label><input id="cSenha" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres">' +
        '<p class="hint">Nesta versão de teste a senha não é guardada.</p></div>' +
      '<div class="acoesform"><button class="btn" type="submit">Continuar</button>' +
      '<button class="btn g" type="button" id="jaTenho">Já tenho cadastro</button></div>' +
    '</form>';
}

/* ── 2 · currículo ── */
function passoCurriculo(k){
  if(k.lendo) return '<h1>Lendo seu currículo</h1><p class="lead">' + esc(k.arquivo ? k.arquivo.nome : 'texto colado') + '</p>' +
    '<div class="sk"><i style="width:60%"></i><i style="width:85%"></i><i style="width:40%"></i></div>';
  return (k.editando ? '' : '<button class="volta" data-cadpasso="1">' + I.volta + 'Voltar</button>') +
    '<h1>Seu currículo</h1>' +
    '<p class="lead">Envie o arquivo e a gente preenche o que conseguir. Você confere tudo no próximo passo.</p>' +
    (k.falha ? '<div class="pend" role="alert">' + I.al + '<div><b>Não deu para ler este arquivo.</b> ' + esc(k.falha) + '</div></div>' : '') +
    '<label class="drop" id="drop">' +

}

/* ── 3 · revisão ── */

  return (k.editando ? '<button class="volta" data-ir="perfil">' + I.volta + 'Meu perfil</button>'
      : '<button class="volta" data-cadpasso="2">' + I.volta + 'Voltar ao currículo</button>') +
    '<h1>' + (k.editando ? 'Editar meu perfil' : 'Confira seu perfil') + '</h1>' +
    (k.achado ? '<div class="achou">' + I.ok + '<div>' + k.achado + '</div></div>' :

        '<button class="chip" type="button" data-carea="' + a.id + '" aria-pressed="' + (r.areaId === a.id) + '">' + esc(a.n) + '</button>').join('') + '</div>' +

    '<section class="blk"><header><h3>O que você já fez</h3></header>' +
      '<p class="hint">Clique no nível para trocar. ' + (doc ? 'Embaixo de cada item está o trecho do currículo de onde ele saiu.' : 'Adicione pela busca.') + '</p>' +
      '<div class="cmps" id="cmpsBox">' + listaCompsCad(r) + '</div>' +
      '<div class="tagin" style="margin-top:10px"><input id="buscaCmp" placeholder="Buscar atividade: vendas, estoque, Excel..." aria-label="Buscar atividade" autocomplete="off"></div>' +

      '</select></div></div>' +
      '<p class="hint" style="margin-top:10px">Modelos que você aceita:</p>' +

        '<label class="check"><input type="checkbox" data-cmod="' + m + '"' + (r.modelos.includes(m) ? ' checked' : '') + '> ' + MODELO_ROT[m] + '</label>').join('') + '</div>' +
      '<div class="dupla" style="margin-top:10px"><div class="fg"><label for="rPret">Pretensão mensal (R$)</label>' +
        '<input id="rPret" type="number" min="0" step="100" placeholder="opcional" value="' + (r.pretensao ?? '') + '"></div>' +
      '<div class="fg"><label for="rAnos">Anos de experiência</label><input id="rAnos" type="number" min="0" max="45" placeholder="opcional" value="' + (r.anos ?? '') + '"></div></div></section>' +

    '<section class="blk"><header><h3>Sobre você</h3><span class="opc">opcional</span></header>' +
      '<textarea id="rResumo" rows="3" placeholder="Duas ou três frases: o que você faz e o que busca agora">' + esc(r.resumo) + '</textarea>' +

    (k.editando ? '' : '<section class="blk">' +
      '<label class="check cons"><input type="checkbox" data-ccons="termos"' + (k.consent.termos ? ' checked' : '') + '><span>Li e aceito os termos de uso e a política de privacidade da Conectaria. <em class="necessário">necessário</em></span></label>' +
      '<label class="check cons"><input type="checkbox" data-ccons="compartilhar"' + (k.consent.compartilhar ? ' checked' : '') + '><span>Autorizo a Conectaria a usar meu perfil para me indicar a vagas e a compartilhá-lo com as empresas das vagas em que eu me candidatar. Posso pedir para ver, corrigir ou apagar meus dados quando quiser. <em class="necessário">necessário</em></span></label>' +
    '</section>') +

    '<button class="btn w" id="btConfirmaCad" type="button">' + (k.editando ? 'Salvar alterações'
      : S.vagaAlvo && vagaPor(S.vagaAlvo) ? 'Confirmar e enviar candidatura' : 'Confirmar cadastro') + '</button>';
