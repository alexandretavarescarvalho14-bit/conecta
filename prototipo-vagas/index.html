function chipsCargosCad(r){
  const lista = r.areaId ? cargosDaArea(r.areaId) : [];
  if(!lista.length) return '<span class="hint">Escolha uma área para ver os cargos.</span>';
  return lista.map(c => '<button class="chip" type="button" data-ccargo="' + c.id + '" aria-pressed="' + r.cargos.includes(c.id) + '">' +
    esc(c.n) + ' <small>' + SEN_ROT[c.sen] + '</small></button>').join('');
}
function listaCompsCad(r){
  if(!r.competencias.length) return '<p class="hint" style="margin:6px 0">Nenhuma ainda. ' +
    (r.cargos.length ? 'Sugestões pelos cargos escolhidos aparecem ao clicar na busca.' : 'Busque abaixo.') + '</p>';
  return r.competencias.map((c, i) =>
    '<div class="cmp' + (c.ok ? '' : ' off') + '">' +
      '<button class="okb" type="button" data-cok="' + i + '" aria-pressed="' + c.ok + '" aria-label="' + (c.ok ? 'Tirar' : 'Manter') + ' ' + esc(skillNome(c.skillId)) + '">' + (c.ok ? I.ok : I.x) + '</button>' +
      '<div class="cmpi"><b>' + esc(skillNome(c.skillId)) + '</b>' + (c.evidencia ? '<q>' + esc(c.evidencia) + '</q>' : '') + '</div>' +
      '<button class="nvbt" type="button" data-cniv="' + i + '">' + NIVEIS[c.nivel - 1] + '</button>' +
      '<span class="prov ' + (c.de === 'document' ? 'document' : 'user') + '"><i></i>' + (c.de === 'document' ? 'currículo' : 'você') + '</span>' +
    '</div>').join('');
}

function pendenciasCad(k){
  const r = k.rev, p = [];
  if(!r.areaId) p.push('Escolha sua área.');
  if(!r.competencias.some(c => c.ok)) p.push('Marque ao menos uma atividade que você já fez.');
  if(!r.uf) p.push('Diga em que estado você está.');
  if(!r.modelos.length) p.push('Marque ao menos um modelo de trabalho.');
  if(!k.editando && !(k.consent.termos && k.consent.compartilhar)) p.push('Aceite as duas autorizações.');
  return p;
}

function ligarCadastro(k){
  const raiz = $('#v-cadastro');
  $$('[data-cadpasso]', raiz).forEach(b => b.onclick = () => { k.passo = +b.dataset.cadpasso; k.erros = []; salvar(); vCadastro(); });

  const fc = $('#fConta', raiz);
  if(fc){
    const w = $('#cWhats'); w.oninput = () => { w.value = mascararWhats(w.value); };
    fc.onsubmit = e => {
      e.preventDefault();
      const nome = $('#cNome').value.trim(), email = $('#cEmail').value.trim(), whats = $('#cWhats').value.trim();
      const erros = [];
      if(nome.split(/\s+/).length < 2) erros.push('Escreva nome e sobrenome.');
      if(!emailValido(email)) erros.push('Confira o e-mail.');
      else if(DB.candidatos.some(c => c.email.toLowerCase() === email.toLowerCase())) erros.push('Este e-mail já tem cadastro. Use "Já tenho cadastro".');
      if(soDigitos(whats).length < 10) erros.push('Informe o WhatsApp com DDD.');
      if($('#cSenha').value.length < 8) erros.push('A senha precisa de 8 caracteres ou mais.');
      k.conta = {nome, email, whatsapp:whats};
      k.erros = erros;
      if(!erros.length) k.passo = 2;
      salvar(); vCadastro();
    };
    $('#jaTenho').onclick = abrirEntrar;
  }

  const arq = $('#arq', raiz);
  if(arq){
    arq.onchange = () => { if(arq.files[0]) lerCurriculo(k, arq.files[0]); };
    const drop = $('#drop', raiz);
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if(f) lerCurriculo(k, f); });
    $('#usarColado').onclick = () => {
      const tx = $('#colado').value;
      if(tx.trim().length < 60){ toast('Cole um pouco mais de texto para eu conseguir ler.', I.al); return; }
      interpretarCurriculo(k, tx, null);
    };
    $('#semCv').onclick = () => { k.fonte = 'manual'; k.achado = null; k.falha = null; k.passo = 3; salvar(); vCadastro(); };
  }

  if(k.passo === 3) ligarRevisao(k, raiz);
}

async function lerCurriculo(k, arquivo){
  const ext = (arquivo.name.split('.').pop() || '').toLowerCase();
  k.falha = null;
  if(ext === 'pdf'){
    k.arquivo = {nome:arquivo.name, tamanho:arquivo.size}; k.fonte = 'pdf';
    k.achado = 'Guardamos <b>' + esc(arquivo.name) + '</b> para a equipe ler. PDF não preenche o perfil sozinho, então preencha abaixo.';
    k.passo = 3; salvar(); vCadastro(); return;
  }
  k.lendo = true; k.arquivo = {nome:arquivo.name, tamanho:arquivo.size}; vCadastro();
  try{
    const {texto} = await lerArquivo(arquivo);
    await espera(500);
    interpretarCurriculo(k, texto, arquivo.name);
  }catch(e){
    k.lendo = false; k.falha = (e && e.message) || 'Confira se é DOCX, TXT ou MD.'; k.arquivo = null;
    salvar(); vCadastro();
  }
}
function interpretarCurriculo(k, texto, nome){
  const s = interpretar(texto);
  const r = k.rev;
  r.areaId = s.areaId || r.areaId;
  r.cargos = s.cargos.slice(0, 3).length ? s.cargos.slice(0, 3) : r.cargos;
  r.competencias = s.competencias.map(c => ({skillId:c.skillId, nivel:c.nivel, de:'document', evidencia:c.evidencia, ok:true}));
  r.resumo = s.resumo || r.resumo; r.anos = s.anos ?? r.anos; r.uf = s.uf || r.uf;
  if(s.modelos.length) r.modelos = s.modelos;
  k.fonte = 'import'; k.lendo = false; k.passo = 3; k.erros = [];
  k.arquivo = nome ? {nome, tamanho:0} : null;
  const n = s.competencias.length;
  k.achado = 'Lemos seu currículo e encontramos <b>' + plural(n, 'atividade', 'atividades') + '</b>' +
    (s.areaId ? ' e a área <b>' + esc(AREA[s.areaId].n) + '</b>' : '') + '. Confira, ajuste o que precisar e confirme.';
  salvar(); vCadastro();
}

function ligarRevisao(k, raiz){
  const r = k.rev;
  const repintarComps = () => { $('#cmpsBox', raiz).innerHTML = listaCompsCad(r); ligarComps(); salvar(); };
  $$('[data-carea]', raiz).forEach(b => b.onclick = () => {
    r.areaId = r.areaId === b.dataset.carea ? null : b.dataset.carea;
    r.cargos = r.cargos.filter(id => CARGO[id] && CARGO[id].a === r.areaId);
    $$('[data-carea]', raiz).forEach(x => x.setAttribute('aria-pressed', String(x.dataset.carea === r.areaId)));
    $('#cargosBox', raiz).innerHTML = chipsCargosCad(r); ligarCargos(); salvar();
  });
  const ligarCargos = () => $$('[data-ccargo]', raiz).forEach(b => b.onclick = () => {
    const id = b.dataset.ccargo;
    r.cargos = r.cargos.includes(id) ? r.cargos.filter(x => x !== id) : [...r.cargos, id].slice(-3);
    $$('[data-ccargo]', raiz).forEach(x => x.setAttribute('aria-pressed', String(r.cargos.includes(x.dataset.ccargo))));
    salvar();
  });
  const ligarComps = () => {
    $$('[data-cok]', raiz).forEach(b => b.onclick = () => { const c = r.competencias[+b.dataset.cok]; c.ok = !c.ok; repintarComps(); });
    $$('[data-cniv]', raiz).forEach(b => b.onclick = () => { const c = r.competencias[+b.dataset.cniv]; c.nivel = c.nivel % 3 + 1; if(c.de === 'document') c.de = 'user'; repintarComps(); });
  };
  ligarCargos(); ligarComps();

  const busca = $('#buscaCmp', raiz), sug = $('#sugCmp', raiz);
  const pintaSug = () => {
    const q = normalizar(busca.value.trim());
    const tem = new Set(r.competencias.map(c => c.skillId));
    const base = q ? SKILLS : skillsDosCargos(r.cargos).concat(r.areaId ? SKILLS.filter(s => s.a.includes(r.areaId)) : []);
    const lista = [...new Set(base)].filter(s => s.st === 'ativa' && !tem.has(s.id) &&
      (!q || normalizar(s.r).includes(q) || (SINONIMOS[s.id] || []).some(t => t.includes(q)))).slice(0, 10);
    sug.innerHTML = lista.map(s => '<button type="button" data-addc="' + s.id + '">+ ' + esc(s.r) + '</button>').join('') ||
      (q ? '<span class="hint">Nada com esse termo. Tente uma palavra mais curta.</span>' : '');
    $$('[data-addc]', sug).forEach(b => b.onclick = () => {
      r.competencias.push({skillId:b.dataset.addc, nivel:2, de:'user', ok:true});
      busca.value = ''; pintaSug(); repintarComps();
    });
  };
  busca.oninput = pintaSug; busca.onfocus = pintaSug;

  const liga = (id, f) => { const el = $(id, raiz); if(el) el.oninput = el.onchange = () => { f(el); salvar(); }; };
  liga('#rCidade', el => r.cidade = el.value.slice(0, 60));
  liga('#rUf', el => r.uf = el.value);
  liga('#rPret', el => r.pretensao = el.value === '' ? null : Math.max(0, +el.value));
  liga('#rAnos', el => r.anos = el.value === '' ? null : Math.max(0, Math.min(45, +el.value)));
  liga('#rResumo', el => r.resumo = el.value.slice(0, 900));
  liga('#rLinkedin', el => r.linkedin = el.value.trim().slice(0, 120));
  $$('[data-cmod]', raiz).forEach(cb => cb.onchange = () => {
    r.modelos = ['presencial', 'hibrido', 'remoto'].filter(m => $('[data-cmod="' + m + '"]', raiz).checked); salvar();
  });
  $$('[data-ccons]', raiz).forEach(cb => cb.onchange = () => { k.consent[cb.dataset.ccons] = cb.checked; salvar(); });

  $('#btConfirmaCad', raiz).onclick = async () => {
    k.erros = pendenciasCad(k);
    if(k.erros.length){ vCadastro(); scrollTo({top:0, behavior:'smooth'}); return; }
    const b = $('#btConfirmaCad'); b.disabled = true; b.innerHTML = '<span class="spin"></span>Salvando';
    await espera(420);
    confirmarCadastro(k);
  };
}

function confirmarCadastro(k){
  const r = k.rev, agora = iso(Date.now());
  const dados = {areaId:r.areaId, cargos:[...r.cargos],
    competencias:r.competencias.filter(c => c.ok).map(c => ({skillId:c.skillId, nivel:c.nivel, de:'user'})),
    uf:r.uf, cidade:r.cidade, modelos:[...r.modelos], pretensao:r.pretensao || null,
    resumo:r.resumo, anos:r.anos, linkedin:r.linkedin};

  if(k.editando){
    const c = candidatoPor(k.editando);
    Object.assign(c, dados);
    if(k.arquivo) c.cvNome = k.arquivo.nome;
    tocar(c); S.cad = null; salvar();
    ir('perfil'); toast('Perfil atualizado.');
    return;
  }
  const c = {id:novoId('c'), exemplo:false, nome:k.conta.nome, email:k.conta.email, whatsapp:k.conta.whatsapp,
    ...dados, cvNome:k.arquivo ? k.arquivo.nome : null, fonte:'user', consentEm:agora, criadoEm:agora, __v:0};
  DB.candidatos.push(c);
  S.userId = c.id; S.cad = null;
  const alvo = S.vagaAlvo && vagaPor(S.vagaAlvo) && vagaPor(S.vagaAlvo).status === 'publicada' ? S.vagaAlvo : null;
  if(alvo){
    criarCandidatura(c.id, alvo, 'site', 'candidato');
    S.vagaAlvo = null; salvar();
    ir('minhas'); toast('Cadastro pronto e candidatura enviada. A equipe fala com você pelo WhatsApp.');
  } else {
    S.vagaAlvo = null; salvar();
    ir('vagas'); toast('Cadastro pronto. Agora é só escolher a vaga e se candidatar.');
  }
}

/* Entrar de novo: no teste, basta o e-mail. Dá para entrar como um dos
   candidatos de exemplo e ver o lado dele. */
function abrirEntrar(){
  abrirModal('<h2 id="mTit">Entrar</h2><p class="sub">Use o e-mail do seu cadastro.</p>' +
    '<form class="form" id="fEntrar" style="gap:var(--s2)" novalidate>' +
      '<div class="fg"><label for="eEmail">E-mail</label><input id="eEmail" type="email" autocomplete="email"></div>' +
      '<div class="fg"><label for="eSenha">Senha</label><input id="eSenha" type="password" autocomplete="current-password">' +
        '<p class="hint">Nesta versão de teste a senha não é conferida. Para ver o lado de um candidato de exemplo, use por exemplo <b>' +
        esc((DB.candidatos.find(c => c.exemplo) || {email:''}).email) + '</b>.</p></div>' +
      '<p class="erroform" id="eErro" role="alert"></p>' +
      '<button class="btn w" type="submit">Entrar</button>' +
      '<button class="btn g w" type="button" id="eCancela">Cancelar</button></form>');
  $('#eCancela').onclick = fecharModal;
  $('#fEntrar').onsubmit = e => {
    e.preventDefault();
    const email = $('#eEmail').value.trim().toLowerCase();
    const c = DB.candidatos.find(x => x.email.toLowerCase() === email);
    if(!c){ $('#eErro').textContent = 'Não achamos cadastro com este e-mail. Confira ou crie um cadastro.'; return; }
    S.userId = c.id; S.cad = null; fecharModal();

    if(alvo && !jaCandidatou(c.id, alvo)){ ir('vaga', alvo); toast('Olá, ' + c.nome.split(' ')[0] + '. Agora é só confirmar a candidatura.'); }

  };
}

/* ══════════════════ LADO DO CANDIDATO ══════════════════
   Minhas candidaturas mostra a etapa com o mesmo nome que a Conectaria
   usa. Motivo de reprovação não aparece: é anotação interna, feita para

function vMinhas(){
  const c = eu(), el = $('#v-minhas');
  const lista = candidaturasDoCandidato(c.id).sort((a, b) => new Date(b.criadaEm) - new Date(a.criadaEm));
  if(!lista.length){
    el.innerHTML = '<div class="estado"><div class="ic">' + I.vazio + '</div>' +
      '<h3>Você ainda não se candidatou.</h3>' +
      '<p>Quando se candidatar, o andamento aparece aqui, etapa por etapa.</p>' +
      '<button class="btn" data-ir="vagas">Ver vagas abertas</button></div>';
    return;
  }
  const ativas = lista.filter(a => a.status === 'ativa').length;
  el.innerHTML = '<div class="barra" style="margin-top:var(--s5)"><h2>Minhas candidaturas</h2>' +

    '<div class="cds">' + lista.map(a => {
      const v = vagaPor(a.vagaId), e = empresaPor(v.empresaId);

      const fim = a.status === 'reprovada'
        ? '<p class="expect enc">' + I.al + 'Este processo foi encerrado ' + tempoRel(ult.em) + '. Seu cadastro continua ativo e a equipe pode indicar você para outras vagas.</p>'
        : a.status === 'contratada'
        ? '<p class="expect">' + I.ok + 'Parabéns! A contratação foi confirmada ' + tempoRel(ult.em) + '.</p>'
        : '<p class="expect">' + I.ok + 'Última atualização ' + tempoRel(a.atualizadaEm) + '. A equipe da Conectaria fala com você pelo WhatsApp a cada avanço.</p>';
      return '<div class="cd"><div class="cdtop"><div style="flex:1;min-width:210px">' +
        '<div class="emp">' + logoEmp(e) + '<b>' + esc(e.n) + '</b></div>' +
        '<h3 style="font-size:var(--lg);font-family:var(--d)">' + esc(v.titulo) + '</h3>' +
        '<div class="meta"><span>' + esc(v.local) + '</span><span>' + esc(v.regime) + '</span><span>enviada ' + tempoRel(a.criadaEm) + '</span></div></div>' +
        pillStatus(a) + '</div>' +
        (a.status === 'reprovada' ? '' : '<div class="trilhaw"><div class="trilha">' + ETAPAS.map((n, i) =>
          '<div class="et ' + (i < a.etapa || a.status === 'contratada' ? 'done' : i === a.etapa ? 'now' : '') + '"><i></i>' + esc(n) + '</div>').join('') + '</div></div>') +

/* ══ parte: partes/js/50-admin-painel.js ══ */
/* ══════════════════ CONECTARIA · PAINEL ══════════════════
   Visão da operação inteira. Tudo sai de derivarDash() (36-painel-base,
   o mesmo do protótipo), que lê o histórico das candidaturas, e não a
   etapa atual: quem foi reprovado na entrevista conta como tendo passado
   pela triagem. */

function vPainel(){
  const P = DB.candidaturas, d = derivarDash(P);
  const pub = vagasPublicadas(), agora = Date.now();
  const semanas = Array.from({length:6}, (_, i) => {
    const fim = 7 * (5 - i), ini = fim + 7;
    const q = P.filter(a => { const dias = (agora - new Date(a.criadaEm)) / DIA; return dias >= fim && dias < ini; }).length;
    return [i === 5 ? 'esta sem.' : 'há ' + (5 - i) + ' sem.', q];
  });
  const maxS = Math.max(1, ...semanas.map(s => s[1]));
  const naSemana = semanas[5][1];

  // vagas publicadas sem ninguém ativo: é onde a Conectaria precisa buscar gente
  const semGente = pub.map(v => ({v, ativas:candidaturasDaVaga(v.id).filter(a => a.status === 'ativa').length}))
    .filter(x => x.ativas === 0);
  // candidaturas paradas na primeira etapa há mais de 3 dias
  const paradas = P.filter(a => a.status === 'ativa' && a.etapa === 0 && (agora - new Date(a.atualizadaEm)) / DIA > 3);
  const exemplos = DB.candidatos.filter(c => c.exemplo).length;

  $('#v-painel').innerHTML =
  '<div class="barra" style="margin-top:var(--s5)"><h2>Painel</h2>' +
    '<p class="cont">' + plural(DB.empresas.length, 'empresa', 'empresas') + ' · ' + plural(pub.length, 'vaga publicada', 'vagas publicadas') + ' · ' +
    plural(DB.candidatos.length, 'pessoa cadastrada', 'pessoas cadastradas') + '</p></div>' +
  (exemplos ? '<div class="avisoex">' + I.al + '<div><b>' + plural(exemplos, 'candidato de exemplo', 'candidatos de exemplo') +
    '</b> para o pipeline não começar vazio. Quem você cadastrar no teste não é afetado.</div>' +
    '<button class="btn g sm" id="btTiraEx">Remover exemplos</button></div>' : '') +
  '<div class="kpis">' +
    kpi('Candidaturas na semana', naSemana, plural(P.length, 'no total', 'no total'), semanas.map(s => s[1])) +
    kpi('Em processo', d.emProcesso, plural(paradas.length, 'parada em "Recebida" há mais de 3 dias', 'paradas em "Recebida" há mais de 3 dias')) +
    kpi('Vagas sem candidato ativo', semGente.length, 'de ' + pub.length + ' publicadas') +
    kpi('Contratações', d.contratados, 'conduzidas pela Conectaria') +
  '</div>' +

  '<div class="painelg">' +
  '<div class="bloco"><header><h3>Candidaturas por semana</h3></header>' +
    '<div class="graf">' + semanas.map(([m, v]) =>
      '<div class="gb"><div class="col" style="height:' + (v / maxS * 100) + '%" data-v="' + plural(v, 'candidatura', 'candidaturas') + '"></div><small>' + m + '</small></div>').join('') + '</div></div>' +

  '<div class="bloco"><header><h3>Funil</h3><span class="hint" style="margin:0 0 0 auto">quem chegou a cada etapa</span></header>' +
    '<div class="tabw"><table class="tab"><tbody>' +
    d.funil.map((f, i) => linhaSaude(esc(f.n), String(f.chegou) + (i ? ' <small>(' + Math.round(f.taxa * 100) + '%)</small>' : ''),
      i && f.taxa < .5 ? 'al' : 'n')).join('') +
    '</tbody></table></div></div>' +
  '</div>' +

  '<div class="painelg">' +
  '<div class="bloco"><header><h3>Vagas sem candidato ativo</h3></header>' +
    (semGente.length ? '<div class="tabw"><table class="tab"><tbody>' + semGente.map(({v}) => {
      const e = empresaPor(v.empresaId);
      return '<tr data-irpip="' + v.id + '"><td><b>' + esc(v.titulo) + '</b><div class="sub2">' + esc(e.n) + ' · ' + esc(v.local) + '</div></td>' +
        '<td style="width:120px"><button class="btn g sm" data-buscagente="' + v.id + '">Buscar no banco</button></td></tr>';
    }).join('') + '</tbody></table></div>' : '<p class="hint">Todas as vagas publicadas têm alguém em processo.</p>') +
  '</div>' +
  '<div class="bloco"><header><h3>Motivos de encerramento</h3>' +
    '<span class="pill n" style="margin-left:auto">' + d.reprovadasTotal + '</span></header>' +
    (d.reprovadasTotal ? '<div class="tabw"><table class="tab"><tbody>' +
      Object.entries(d.porMotivo).sort((a, b) => b[1] - a[1]).map(([mid, n]) =>
        linhaSaude(esc(MOTIVO[mid] ? MOTIVO[mid].r : mid), n + ' <small>(' + pc(n / d.reprovadasTotal) + ')</small>', 'n')).join('') +
      '</tbody></table></div>' +
      (d.motorBaseN ? '<p class="hint" style="margin-top:10px">Em ' + pc(d.motorAcertos) + ' dos ' + d.motorBaseN +
        ' encerramentos com motivo técnico ou de contexto, o match já apontava a mesma lacuna antes da decisão.</p>' : '')
      : '<p class="hint">Nenhum processo encerrado ainda.</p>') +
  '</div></div>';

  $$('[data-irpip]').forEach(tr => tr.onclick = e => { if(!e.target.closest('button')) ir('pipeline', tr.dataset.irpip); });
  $$('[data-buscagente]').forEach(b => b.onclick = () => { S.adm.tal.vaga = b.dataset.buscagente; ir('talentos'); });
  const tx = $('#btTiraEx');
  if(tx) tx.onclick = () => confirmar('Remover candidatos de exemplo?',
    'Saem ' + plural(exemplos, 'candidato de exemplo', 'candidatos de exemplo') + ' e as candidaturas deles. Empresas, vagas e quem você cadastrou ficam.',
    'Remover exemplos', () => {
      const ids = new Set(DB.candidatos.filter(c => c.exemplo).map(c => c.id));
      DB.candidaturas = DB.candidaturas.filter(a => !ids.has(a.candidatoId));
      DB.candidatos = DB.candidatos.filter(c => !ids.has(c.id));
      if(S.userId && ids.has(S.userId)) S.userId = null;
      salvar(); vPainel(); toast('Exemplos removidos.');
    });
  animaKpis();
}

/* ══════════════════ CONECTARIA · EMPRESAS ══════════════════

   CNPJ é opcional; se vier, precisa ter dígito verificador válido, e a

const CORES_EMP = ['#189CCC','#D9822B','#3D7A4A','#6B2A7A','#8A6A4A','#1F5E9E','#2E7D8F','#C0568A','#4A6FD8','#B3382F'];

function vEmpresas(){
  const linhas = [...DB.empresas].sort((a, b) => a.n.localeCompare(b.n)).map(e => {

    return '<tr data-editemp="' + e.id + '"><td><div class="celemp">' + logoEmp(e) + '<div><b>' + esc(e.n) + '</b>' +
      '<div class="sub2">' + esc(e.setor || 'sem setor') + '</div></div></div></td>' +
      '<td>' + esc(e.cidade || '') + '</td>' +
      '<td>' + pub + (vs.length !== pub ? ' <small class="sub2">de ' + vs.length + '</small>' : '') + '</td>' +
      '<td>' + (e.cnpj ? '<span class="pill ok"><i></i>CNPJ</span>' : '<span class="pill n">sem CNPJ</span>') + '</td></tr>';
  }).join('');
  $('#v-empresas').innerHTML =
  '<div class="barra" style="margin-top:var(--s5)"><h2>Empresas</h2>' +
    '<p class="cont">' + plural(DB.empresas.length, 'empresa parceira', 'empresas parceiras') + '</p>' +
    '<div class="chips"><button class="btn sm" id="btNovaEmp">Nova empresa</button></div></div>' +
  '<div class="bloco" style="margin-top:0"><div class="tabw"><table class="tab"><thead><tr>' +
    '<th>Empresa</th><th>Onde</th><th>Vagas publicadas</th><th>Cadastro</th></tr></thead><tbody>' + linhas + '</tbody></table></div></div>';
  $('#btNovaEmp').onclick = () => formEmpresa(null);
  $$('[data-editemp]').forEach(tr => tr.onclick = () => formEmpresa(tr.dataset.editemp));
}

/* Formulário em modal. `aoSalvar` permite criar a empresa de dentro do
   cadastro de vaga sem perder o que já foi digitado lá. */
function formEmpresa(id, aoSalvar){
  const e = id ? empresaPor(id) : {n:'', setor:'', cidade:'', site:'', cnpj:'', contato:'', obs:''};
  const nVagas = id ? DB.vagas.filter(v => v.empresaId === id).length : 0;
  abrirModal('<h2 id="mTit">' + (id ? 'Editar empresa' : 'Nova empresa') + '</h2>' +
    '<form class="form" id="fEmp" style="gap:var(--s2)" novalidate>' +
      '<div class="fg"><label for="eN">Nome da empresa</label><input id="eN" value="' + esc(e.n) + '"></div>' +
      '<div class="dupla"><div class="fg"><label for="eSetor">Setor</label><input id="eSetor" value="' + esc(e.setor) + '" placeholder="Varejo, Logística..."></div>' +
      '<div class="fg"><label for="eCid">Cidade</label><input id="eCid" value="' + esc(e.cidade) + '" placeholder="Recife, PE"></div></div>' +
      '<div class="dupla"><div class="fg"><label for="eSite">Site</label><input id="eSite" value="' + esc(e.site) + '" placeholder="empresa.com.br"></div>' +
      '<div class="fg"><label for="eCnpj">CNPJ <span class="opc">opcional</span></label><input id="eCnpj" inputmode="numeric" maxlength="18" value="' + esc(e.cnpj) + '" placeholder="00.000.000/0000-00">' +
        '<p class="hint" id="eCnpjHint">Conferimos só o formato do número.</p></div></div>' +
      '<div class="fg"><label for="eCont">Contato na empresa <span class="opc">interno</span></label><input id="eCont" value="' + esc(e.contato) + '" placeholder="Nome, cargo e telefone de quem fala com a Conectaria"></div>' +
      '<div class="fg"><label for="eObs">Observações <span class="opc">interno</span></label><textarea id="eObs" rows="2">' + esc(e.obs) + '</textarea></div>' +
      '<p class="erroform" id="eErroEmp" role="alert"></p>' +
      '<button class="btn w" type="submit">' + (id ? 'Salvar' : 'Cadastrar empresa') + '</button>' +
      (id ? '<button class="btn g w perigo" type="button" id="eApagar"' + (nVagas ? ' disabled title="Tem vagas ligadas"' : '') + '>Apagar empresa</button>' +
        (nVagas ? '<p class="hint" style="text-align:center">Para apagar, encerre e apague as ' + plural(nVagas, 'vaga', 'vagas') + ' dela antes.</p>' : '') : '') +
      '<button class="btn g w" type="button" id="eCancEmp">Cancelar</button></form>');

  const cn = $('#eCnpj');
  cn.oninput = () => {
    cn.value = mascararCNPJ(cn.value);
    const d = soDigitos(cn.value), h = $('#eCnpjHint');
    h.textContent = !d.length ? 'Conferimos só o formato do número.' : d.length < 14 ? 'Faltam ' + (14 - d.length) + ' dígitos.'
      : validarCNPJ(cn.value) ? 'Formato válido.' : 'Os dígitos verificadores não batem. Confira o número.';
    h.style.color = d.length === 14 && !validarCNPJ(cn.value) ? 'var(--bl)' : '';
  };
  $('#eCancEmp').onclick = fecharModal;
  const ap = $('#eApagar');
  if(ap) ap.onclick = () => {
    DB.empresas = DB.empresas.filter(x => x.id !== id); salvar(); fecharModal(); vEmpresas(); toast('Empresa apagada.');
  };
  $('#fEmp').onsubmit = ev => {
    ev.preventDefault();
    const dados = {n:$('#eN').value.trim(), setor:$('#eSetor').value.trim(), cidade:$('#eCid').value.trim(),
      site:$('#eSite').value.trim(), cnpj:cn.value.trim(), contato:$('#eCont').value.trim(), obs:$('#eObs').value.trim()};
    const erro = !dados.n ? 'Escreva o nome da empresa.'
      : DB.empresas.some(x => x.id !== id && normalizar(x.n) === normalizar(dados.n)) ? 'Já existe uma empresa com este nome.'
      : dados.cnpj && !validarCNPJ(dados.cnpj) ? 'CNPJ com formato inválido. Corrija ou deixe em branco.' : '';
    if(erro){ $('#eErroEmp').textContent = erro; return; }
    let emp;
    if(id){ emp = empresaPor(id); Object.assign(emp, dados); }
    else {
      emp = {id:novoId('e'), c:CORES_EMP[DB.empresas.length % CORES_EMP.length], criadaEm:iso(Date.now()), ...dados};
      DB.empresas.push(emp);
    }
    salvar(); fecharModal();
    toast(id ? 'Empresa atualizada.' : 'Empresa cadastrada.');
    if(aoSalvar) aoSalvar(emp); else vEmpresas();
  };
}

}

        '<option value="BR"' + (r.uf === 'BR' ? ' selected' : '') + '>Remoto, Brasil todo</option>' +
        '<option value="EX"' + (r.uf === 'EX' ? ' selected' : '') + '>Exterior</option>' +
        ufs.map(([n, s]) => '<option value="' + s + '"' + (r.uf === s ? ' selected' : '') + '>' + s + '</option>').join('') + '</select></div></div>' +
      '<div class="dupla"><div class="fg"><label for="vMod">Modelo</label><select id="vMod">' +
        Object.entries(MODELO_ROT).map(([k, n]) => '<option value="' + k + '"' + (r.modelo === k ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></div>' +
      '<div class="fg"><label for="vReg">Contratação</label><input id="vReg" list="regimes" value="' + esc(r.regime) + '">' +
        '<datalist id="regimes">' + REGIMES.map(x => '<option value="' + esc(x) + '">').join('') + '</datalist></div></div>' +
      '<div class="fg"><label for="vFaixa">Remuneração</label><input id="vFaixa" value="' + esc(r.faixa) + '" placeholder="R$ 3.000 a R$ 4.000, ou A combinar">' +
        '<p class="hint" id="vFaixaHint">' + hintFaixa(r.faixa) + '</p></div>' +
    '</section>' +

    '<section class="blk"><header><h3>Anúncio</h3></header>' +
      '<div class="fg"><label for="vRes">Resumo</label><input id="vRes" maxlength="200" value="' + esc(r.resumo) + '" placeholder="Uma frase: aparece no card da vaga">' +
        '<p class="hint"><span id="vResN">' + r.resumo.length + '</span> de 200 caracteres.</p></div>' +
      '<div class="fg"><label for="vDesc">Descrição completa</label>' +
        '<button type="button" class="btn g sm" id="vIa" style="justify-self:start;margin-bottom:8px">' + I.spark + (r.descricao ? 'Gerar de novo com IA' : 'Gerar descrição com IA') + '</button>' +
        '<textarea id="vDesc" rows="9" placeholder="Escreva, ou gere um rascunho com IA a partir do que já está preenchido e depois ajuste.">' + esc(r.descricao) + '</textarea>' +
        '<p class="hint">A IA usa empresa, cargo, local, contratação e requisitos. O texto é sempre seu para editar antes de publicar.</p></div>' +
      '<label class="check"><input type="checkbox" id="vConect"' + (r.conectaria ? ' checked' : '') + '> Mostrar o selo "Vaga trabalhada pela Conectaria"</label>' +
    '</section>' +

    '<section class="blk"><header><h3>Requisitos</h3>' +
      (r.cargoId ? '<button type="button" class="btn g sm" id="vSugReq" style="margin-left:auto">Sugerir pelo cargo</button>' : '') + '</header>' +
      '<p class="hint">É com isto que o match compara cada candidato. Obrigatório pesa mais: quem não tem fica com nota limitada.</p>' +
      '<div id="reqBox">' + listaReq(r) + '</div>' +
      '<div class="tagin" style="margin-top:10px"><input id="vBuscaReq" placeholder="Adicionar requisito: negociação, Excel, SAP..." aria-label="Adicionar requisito" autocomplete="off"></div>' +
      '<div class="sugt" id="vSugBox"></div>' +
    '</section>' +

  '</div><aside class="lateral">' +
    '<div class="box vfacoes">' +
      '<button class="btn w" id="vPublicar">' + (v && v.status === 'publicada' ? 'Salvar e manter publicada' : 'Publicar') + '</button>' +
      (!v || v.status === 'rascunho' ? '<button class="btn g w" id="vRascunho">Salvar rascunho</button>' : '') +
      (v ? '<button class="btn g w" id="vPrevia">Ver como o candidato vê</button>' : '') +
      (v && v.status === 'publicada' ? '<button class="btn g w" id="vPausar">Pausar</button>' : '') +
      (v && v.status !== 'encerrada' && v.status !== 'rascunho' ? '<button class="btn g w" id="vEncerrar">Encerrar</button>' : '') +
      (v ? '<button class="btn g w" id="vDuplicar">Duplicar</button>' : '') +
      (v && !candidaturasDaVaga(v.id).length ? '<button class="btn g w perigo" id="vApagar">Apagar</button>' : '') +
      '<button class="btn g w" data-ir="avagas">Cancelar</button>' +
    '</div>' +
    (v ? '<div class="box"><h4>Candidaturas</h4><p class="hint">' + plural(candidaturasDaVaga(v.id).length, 'pessoa', 'pessoas') + ' nesta vaga.</p>' +
      '<button class="btn g sm w" data-irpipv="' + v.id + '">Abrir o processo</button></div>' : '') +
  '</aside></div>';

  ligarVagaform(v);
}

function hintFaixa(txt){
  const t = tetoDaFaixa(txt);
  return t ? 'O match compara a pretensão com ' + brl(t) + ', o maior valor da faixa.' : 'Sem valor: a pretensão do candidato não entra no match.';
}
function listaReq(r){
  if(!r.requisitos.length) return '<p class="hint">Nenhum requisito ainda.</p>';
  return '<div class="reqs">' + r.requisitos.map((q, i) =>
    '<div class="req"><b>' + esc(skillNome(q.skillId)) + '</b>' +
      '<label class="check"><input type="checkbox" data-robrig="' + i + '"' + (q.obrigatorio ? ' checked' : '') + '> obrigatório</label>' +
      '<select data-rpeso="' + i + '" aria-label="Peso de ' + esc(skillNome(q.skillId)) + '">' +
        [1, 2, 3].map(p => '<option value="' + p + '"' + (q.peso === p ? ' selected' : '') + '>peso ' + p + '</option>').join('') + '</select>' +
      '<button type="button" class="btn g sm" data-rtira="' + i + '" aria-label="Tirar ' + esc(skillNome(q.skillId)) + '">' + I.x + '</button></div>').join('') + '</div>';
}

function ligarVagaform(v){
  const r = rasc, raiz = $('#v-vagaform');
  const val = id => $(id, raiz).value;
  const repintarReq = () => { $('#reqBox', raiz).innerHTML = listaReq(r); ligarReq(); };
  const ligarReq = () => {
    $$('[data-robrig]', raiz).forEach(cb => cb.onchange = () => { r.requisitos[+cb.dataset.robrig].obrigatorio = cb.checked; });
    $$('[data-rpeso]', raiz).forEach(s => s.onchange = () => { r.requisitos[+s.dataset.rpeso].peso = +s.value; });
    $$('[data-rtira]', raiz).forEach(b => b.onclick = () => { r.requisitos.splice(+b.dataset.rtira, 1); repintarReq(); });
  };
  ligarReq();

  $('#vEmp', raiz).onchange = e => { r.empresaId = e.target.value; };
  $('#vNovaEmp', raiz).onclick = () => formEmpresa(null, emp => { r.empresaId = emp.id; vVagaform(v ? v.id : null); });
  $('#vArea', raiz).onchange = e => { r.areaId = e.target.value; if(r.cargoId && CARGO[r.cargoId].a !== r.areaId) r.cargoId = ''; vVagaform(v ? v.id : null); };
  $('#vCargo', raiz).onchange = e => {
    r.cargoId = e.target.value;
    if(r.cargoId && !r.titulo.trim()) r.titulo = CARGO[r.cargoId].n;
    if(r.cargoId && !r.requisitos.length) r.requisitos = requisitosDoCargo(r.cargoId);
    vVagaform(v ? v.id : null);
  };
  $('#vTit', raiz).oninput = e => { r.titulo = e.target.value; };
  $('#vLocal', raiz).oninput = e => { r.local = e.target.value; };
  $('#vUf', raiz).onchange = e => { r.uf = e.target.value; if(r.uf === 'BR') r.modelo = 'remoto'; };
  $('#vMod', raiz).onchange = e => { r.modelo = e.target.value; };
  $('#vReg', raiz).oninput = e => { r.regime = e.target.value; };
  $('#vFaixa', raiz).oninput = e => { r.faixa = e.target.value; $('#vFaixaHint', raiz).textContent = hintFaixa(r.faixa); };
  $('#vRes', raiz).oninput = e => { r.resumo = e.target.value; $('#vResN', raiz).textContent = r.resumo.length; };
  $('#vDesc', raiz).oninput = e => { r.descricao = e.target.value; };
  $('#vConect', raiz).onchange = e => { r.conectaria = e.target.checked; };
  const sr = $('#vSugReq', raiz);
  if(sr) sr.onclick = () => {
    const novos = requisitosDoCargo(r.cargoId).filter(q => !r.requisitos.some(x => x.skillId === q.skillId));
    r.requisitos.push(...novos.map(q => ({...q, obrigatorio: q.obrigatorio && !r.requisitos.some(x => x.obrigatorio)})));
    repintarReq(); toast(novos.length ? plural(novos.length, 'requisito sugerido', 'requisitos sugeridos') + ' pelo cargo.' : 'Os requisitos do cargo já estão na lista.');
  };

  const busca = $('#vBuscaReq', raiz), sug = $('#vSugBox', raiz);
  const pinta = () => {
    const q = normalizar(busca.value.trim());
    const tem = new Set(r.requisitos.map(x => x.skillId));
    const base = q ? SKILLS : SKILLS.filter(s => r.areaId && (s.a.includes(r.areaId) || s.tr));
    sug.innerHTML = base.filter(s => s.st === 'ativa' && !tem.has(s.id) &&
      (!q || normalizar(s.r).includes(q) || (SINONIMOS[s.id] || []).some(t => t.includes(q)))).slice(0, 10)
      .map(s => '<button type="button" data-radd="' + s.id + '">+ ' + esc(s.r) + '</button>').join('') ||
      (q ? '<span class="hint">Nada no catálogo com esse termo.</span>' : '');
    $$('[data-radd]', sug).forEach(b => b.onclick = () => {
      r.requisitos.push({skillId:b.dataset.radd, peso:2, obrigatorio:!r.requisitos.length});
      busca.value = ''; pinta(); repintarReq();
    });
  };
  busca.oninput = pinta; busca.onfocus = pinta;

  $('#vIa', raiz).onclick = async () => {
    if(!r.titulo.trim() && !r.cargoId){ toast('Escolha o cargo ou escreva o título antes de gerar.', I.al); $('#vTit', raiz).focus(); return; }
    const b = $('#vIa', raiz); b.disabled = true; b.innerHTML = '<span class="spin"></span>Gerando';
    await espera(650);
    const e = empresaPor(r.empresaId);
    r.descricao = gerarDescricaoVaga(r.titulo || CARGO[r.cargoId].n, r.local, familiaDaVaga(r), {
      empresa: e ? e.n : '', regime: r.regime,
      requisitos: r.requisitos.map(q => skillNome(q.skillId)),
      obrigatorios: r.requisitos.filter(q => q.obrigatorio).map(q => skillNome(q.skillId)),
    });
    if(!r.resumo.trim()){
      const rot = FAMILIA_ROTINA[familiaDaVaga(r)] || FAMILIA_ROTINA['Operações'];
      r.resumo = ((e ? e.n + ' busca ' : 'Vaga de ') + (r.titulo || CARGO[r.cargoId].n) + (r.local ? ' em ' + r.local.split(',')[0].trim() : '') +
        ' para ' + rot[0] + '.').slice(0, 200);
    }
    vVagaform(v ? v.id : null);
    toast('Rascunho gerado. Revise e ajuste antes de publicar.');
  };

  const guardar = status => {
    const faltam = [];
    if(!r.empresaId) faltam.push('empresa');
    if(!r.areaId) faltam.push('área');
    if(!r.titulo.trim()) faltam.push('título');
    if(status === 'publicada'){
      if(!r.local.trim()) faltam.push('local');
      if(!r.uf) faltam.push('estado');
      if(!r.resumo.trim()) faltam.push('resumo');
      if(!r.requisitos.length) faltam.push('ao menos um requisito');
    }
    if(faltam.length){ r._erros = faltam; vVagaform(v ? v.id : null); scrollTo({top:0, behavior:'smooth'}); return; }
    const agora = iso(Date.now());
    const dados = {empresaId:r.empresaId, cargoId:r.cargoId || null, areaId:r.areaId, titulo:r.titulo.trim(), local:r.local.trim(),
      uf:r.uf, modelo:r.modelo, regime:r.regime.trim(), faixa:r.faixa.trim() || 'A combinar', faixaMax:tetoDaFaixa(r.faixa),
      resumo:r.resumo.trim(), descricao:r.descricao.trim() || r.resumo.trim(), conectaria:r.conectaria,
      requisitos:r.requisitos.map(q => ({skillId:q.skillId, peso:q.peso, obrigatorio:q.obrigatorio})), status};
    let alvo;
    if(v){
      alvo = v;
      const mudouMatch = JSON.stringify([v.requisitos, v.uf, v.modelo, v.faixaMax, v.cargoId]) !==
        JSON.stringify([dados.requisitos, dados.uf, dados.modelo, dados.faixaMax, dados.cargoId]);
      Object.assign(v, dados);
      if(status === 'publicada' && !v.publicadaEm) v.publicadaEm = agora;
      if(mudouMatch) tocar(v);
    } else {
      alvo = {id:novoId('v'), criadaEm:agora, publicadaEm:status === 'publicada' ? agora : null, __v:0, ...dados};
      DB.vagas.push(alvo);
    }
    rasc = null; salvar();
    toast(status === 'publicada' ? 'Vaga publicada. Já aparece no site.' : 'Rascunho salvo.');
    ir('avagas');
  };
  $('#vPublicar', raiz).onclick = () => guardar('publicada');
  const rs = $('#vRascunho', raiz); if(rs) rs.onclick = () => guardar('rascunho');
  const pv = $('#vPrevia', raiz); if(pv) pv.onclick = () => ir('vaga', v.id);
  const pa = $('#vPausar', raiz); if(pa) pa.onclick = () => { v.status = 'pausada'; rasc = null; salvar(); toast('Vaga pausada. Saiu do site.'); ir('avagas'); };
  const en = $('#vEncerrar', raiz); if(en) en.onclick = () => confirmar('Encerrar esta vaga?',
    'Ela sai do site. As ' + candidaturasDaVaga(v.id).filter(a => a.status === 'ativa').length + ' candidaturas em andamento continuam no processo para você encerrar uma a uma.',
    'Encerrar vaga', () => { v.status = 'encerrada'; rasc = null; salvar(); toast('Vaga encerrada.'); ir('avagas'); });
  const du = $('#vDuplicar', raiz); if(du) du.onclick = () => {
    rasc = {...JSON.parse(JSON.stringify(v)), id:null, titulo:v.titulo + ' (cópia)', status:'rascunho', _de:'nova', _erros:[]};
    ir('vagaform', null); toast('Cópia criada como rascunho. Ajuste e publique.');
  };
  const apg = $('#vApagar', raiz); if(apg) apg.onclick = () => confirmar('Apagar esta vaga?', 'Ela não tem candidaturas. Isso não pode ser desfeito.', 'Apagar',
    () => { DB.vagas = DB.vagas.filter(x => x.id !== v.id); rasc = null; salvar(); toast('Vaga apagada.'); ir('avagas'); }, true);
  const ap = $('[data-irpipv]', raiz); if(ap) ap.onclick = () => ir('pipeline', v.id);
}

/* ══ parte: partes/js/53-admin-pipeline.js ══ */
/* ══════════════════ CONECTARIA · PROCESSO POR VAGA ══════════════════
   Porte da tela de pipeline do protótipo, agora operada pela Conectaria.
   Toda mudança passa por aplicar() (37-pipeline-base) e fica no
   histórico, com quem = 'conectaria'. Seleção de linhas é estado de tela:
   um Set aqui, não em S. */

let pipSel = new Set();

function vPipeline(vid){
  const vagas = DB.vagas.filter(v => v.status !== 'rascunho');
  if(!vagas.length){
    $('#v-pipeline').innerHTML = '<div class="estado"><div class="ic">' + I.vazio + '</div><h3>Nenhuma vaga publicada ainda.</h3>' +
      '<p>Publique uma vaga para começar a receber candidaturas.</p><button class="btn" data-ir="avagas">Ver vagas</button></div>';
    return;
  }
  const alvo = vid && vagaPor(vid) ? vid : S.adm.vagaSel && vagaPor(S.adm.vagaSel) ? S.adm.vagaSel : vagas[0].id;
  if(alvo !== S.adm.vagaSel){ S.adm.etapa = null; S.adm.busca = ''; }
  S.adm.vagaSel = alvo; pipSel = new Set();
  garantirRecs();
  renderPipeline();
}

function renderPipeline(){
  const v = vagaPor(S.adm.vagaSel), e = empresaPor(v.empresaId);
  const todas = candidaturasDaVaga(v.id);
  const d = derivarDash(todas);
  let P = [...todas].sort((a, b) => (b.status === 'ativa') - (a.status === 'ativa') || b.rec.total - a.rec.total);
  if(S.adm.etapa !== null) P = P.filter(a => a.etapa === S.adm.etapa && a.status === 'ativa');
  if(S.adm.busca.trim()){
    const q = normalizar(S.adm.busca.trim());
    P = P.filter(a => { const c = candidatoPor(a.candidatoId); return normalizar(c.nome + ' ' + (c.cidade || '')).includes(q); });
  }
  const desat = todas.filter(recDesatualizado).length;
  const opcoes = [...DB.vagas].filter(x => x.status !== 'rascunho')
    .sort((a, b) => empresaPor(a.empresaId).n.localeCompare(empresaPor(b.empresaId).n) || a.titulo.localeCompare(b.titulo));

  $('#v-pipeline').innerHTML =
  '<div class="barra" style="margin-top:var(--s5);flex-wrap:wrap"><h2>Processo</h2>' +
    '<select id="selVaga" class="selVaga" aria-label="Escolher vaga">' + opcoes.map(x =>
      '<option value="' + x.id + '"' + (x.id === v.id ? ' selected' : '') + '>' + esc(empresaPor(x.empresaId).n + ' · ' + x.titulo) +
      (x.status !== 'publicada' ? ' (' + ST_VAGA[x.status][1].toLowerCase() + ')' : '') + '</option>').join('') + '</select>' +
    '<div class="chips"><button class="btn g sm" data-editvaga2="' + v.id + '">Editar vaga</button>' +
    '<button class="btn g sm" id="btTrazer">Trazer do banco</button></div></div>' +
  '<p class="cont" style="margin-top:-6px">' + logoEmp(e) + ' ' + esc(e.n) + ' · ' + esc(v.local) + ' · ' + pillVaga(v.status) + '</p>' +

  '<div class="kpis" style="margin-bottom:var(--s3)">' +
    kpi('Em processo', d.emProcesso, plural(todas.length, 'candidatura', 'candidaturas') + ' no total') +
    kpi('Aderência média', todas.length ? Math.round(d.fitMedio) + '' : '—', todas.length ? 'de quem chegou à entrevista: ' + (d.fitMedioAvancou ? Math.round(d.fitMedioAvancou) : '—') : 'sem candidaturas') +
    kpi('Pedem atenção', d.retidasBlock + d.retidasReview, 'nota alta com requisito faltando, ou perfil pouco confiável') +
    kpi('Encerradas', d.reprovadasTotal, d.contratados ? plural(d.contratados, 'contratação', 'contratações') : 'nenhuma contratação ainda') +
  '</div>' +

  (desat ? '<div class="pend">' + I.al + '<div><b>' + plural(desat, 'aderência calculada antes de uma mudança', 'aderências calculadas antes de uma mudança') +
    '.</b> A vaga ou o perfil mudou depois do cálculo. <button class="link" id="btRecalcTodos">Recalcular</button></div></div>' : '') +

  '<div class="pipToolbar">' +
    '<div class="chips" style="margin:0">' +
      '<button class="chip" data-etf="todas" aria-pressed="' + (S.adm.etapa === null) + '">Todas <small>' + todas.length + '</small></button>' +
      ETAPAS.map((n, i) => '<button class="chip" data-etf="' + i + '" aria-pressed="' + (S.adm.etapa === i) + '">' + esc(n) +
        ' <small>' + todas.filter(a => a.etapa === i && a.status === 'ativa').length + '</small></button>').join('') +
    '</div>' +
    '<input id="pipBuscaIn" type="search" placeholder="Buscar por nome ou cidade" value="' + esc(S.adm.busca) + '" aria-label="Buscar candidato">' +
  '</div>' +

  '<div class="bloco" style="margin-top:var(--s2)"><div class="tabw"><table class="tab"><thead><tr>' +
    '<th style="width:30px"><input type="checkbox" id="selTodos" aria-label="Selecionar todas"></th>' +
    '<th>Pessoa</th><th>Aderência</th><th>Principal ponto</th><th>Etapa</th><th></th></tr></thead><tbody>' +
    (P.length ? P.map(linhaPip).join('') :
      '<tr><td colspan="6" style="text-align:center;color:var(--i62);padding:var(--s4) 0">' +
      (todas.length ? 'Ninguém com esse recorte.' : 'Nenhuma candidatura ainda. Use "Trazer do banco" para indicar alguém.') + '</td></tr>') +
  '</tbody></table></div></div>' +
  '<p class="nota">A aderência é calculada quando a Conectaria abre o processo e fica guardada na candidatura. Ela compara as ' +
  'atividades declaradas com os requisitos da vaga e o local, modelo e pretensão com o que a vaga oferece. O candidato não vê este número.</p>' +
  '<div id="pipBarraSel"></div>';

  ligarPipeline(v, P);
}

function linhaPip(ap){
  const c = candidatoPor(ap.candidatoId), off = ap.status !== 'ativa';
  return '<tr data-ap="' + ap.id + '"' + (off ? ' class="off"' : '') + '>' +
    '<td><input type="checkbox" data-sel="' + ap.id + '" aria-label="Selecionar ' + esc(c.nome) + '"' + (pipSel.has(ap.id) ? ' checked' : '') + (off ? ' disabled' : '') + '></td>' +
    '<td><button class="nomebt" data-vercand="' + ap.id + '">' + esc(c.nome) + (ap.favorito ? ' <span class="fav" aria-label="favorito">' + I.spark + '</span>' : '') + '</button>' +
      '<div class="sub2">' + esc([c.cidade, c.uf].filter(Boolean).join(', ')) + ' · ' + esc(ORIGEM_ROT[ap.origem] || ap.origem) + (c.exemplo ? ' · exemplo' : '') + '</div></td>' +
    '<td>' + barraFit(ap.rec.total) + (ap.rec.desfecho !== 'allow' ? '<div style="margin-top:4px">' + selo(ap.rec.desfecho) + '</div>' : '') + '</td>' +
    '<td class="porq">' + esc(motivoPrincipal(ap.rec)) + '</td>' +
    '<td>' + pillStatus(ap) + (ap.status === 'reprovada' && ap.motivoId ? '<div class="sub2" style="margin-top:3px">' + esc(MOTIVO[ap.motivoId] ? MOTIVO[ap.motivoId].r : '') + '</div>' : '') + '</td>' +
    '<td class="pipAcoes">' + acoesPip(ap) + '</td></tr>';
}
function acoesPip(ap){
  if(ap.status === 'reprovada' || ap.status === 'contratada') return '<button class="btn g sm" data-pip="reabrir" data-id="' + ap.id + '">Reabrir</button>';
  const ultima = ap.etapa === ETAPAS.length - 1;
  return (ap.etapa > 0 ? '<button class="btn g sm" data-pip="voltar" data-id="' + ap.id + '" title="Voltar etapa" aria-label="Voltar etapa">' + I.volta + '</button>' : '') +
    (ultima ? '<button class="btn sm" data-pip="contratar" data-id="' + ap.id + '">Contratar</button>'
      : '<button class="btn g sm" data-pip="avancar" data-id="' + ap.id + '" title="Avançar para ' + esc(ETAPAS[ap.etapa + 1]) + '" aria-label="Avançar etapa">' + I.ch + '</button>') +
    '<button class="btn g sm" data-pip="favoritar" data-id="' + ap.id + '" title="Favoritar" aria-pressed="' + ap.favorito + '" aria-label="Favoritar">' + I.spark + '</button>' +
    '<button class="btn g sm" data-pip="reprovar" data-id="' + ap.id + '" title="Encerrar" aria-label="Encerrar candidatura">' + I.x + '</button>';
}

const TOAST_PIP = {
  avancar: ap => 'Movida para ' + ETAPAS[ap.etapa] + '.',
  voltar: ap => 'Voltou para ' + ETAPAS[ap.etapa] + '.',
  contratar: () => 'Contratação registrada.',
  reabrir: () => 'Candidatura reaberta.',
};
function acaoPip(tipo, id){
  const ap = candidaturaPor(id);
  if(tipo === 'reprovar') return abrirEncerrar([id]);
  aplicar(ap, {tipo, quem:'conectaria'});
  if(TOAST_PIP[tipo]) toast(TOAST_PIP[tipo](ap));
  renderPipeline();
  if(gavetaAberta === id) gavetaCandidatura(id);
}

function ligarPipeline(v, P){
  const raiz = $('#v-pipeline');
  $('#selVaga', raiz).onchange = e => ir('pipeline', e.target.value);
  $('#pipBuscaIn', raiz).oninput = debounce(e => { S.adm.busca = e.target.value; renderPipeline(); const i = $('#pipBuscaIn'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 200);
  $$('[data-etf]', raiz).forEach(b => b.onclick = () => { S.adm.etapa = b.dataset.etf === 'todas' ? null : +b.dataset.etf; renderPipeline(); });
  $$('[data-pip]', raiz).forEach(b => b.onclick = () => acaoPip(b.dataset.pip, b.dataset.id));
  $$('[data-vercand]', raiz).forEach(b => b.onclick = () => gavetaCandidatura(b.dataset.vercand));
  $$('[data-editvaga2]', raiz).forEach(b => b.onclick = () => { rasc = null; ir('vagaform', v.id); });
  $('#btTrazer', raiz).onclick = () => { S.adm.tal.vaga = v.id; ir('talentos'); };
  const rt = $('#btRecalcTodos', raiz);
  if(rt) rt.onclick = () => {
    const n = candidaturasDaVaga(v.id).filter(recDesatualizado).map(recalcularRec).length;
    toast(plural(n, 'aderência recalculada', 'aderências recalculadas') + '. As anteriores ficam no histórico.'); renderPipeline();
  };
  $$('[data-sel]', raiz).forEach(cb => cb.onchange = () => { cb.checked ? pipSel.add(cb.dataset.sel) : pipSel.delete(cb.dataset.sel); renderBarraSel(); });
  $('#selTodos', raiz).onchange = e => { P.filter(a => a.status === 'ativa').forEach(a => e.target.checked ? pipSel.add(a.id) : pipSel.delete(a.id)); renderPipeline(); };
  renderBarraSel();
}

function renderBarraSel(){
  const box = $('#pipBarraSel'); if(!box) return;
  if(!pipSel.size){ box.innerHTML = ''; return; }
  box.innerHTML = '<div class="cmpbar">' + I.pes + '<b style="font-family:var(--d);font-size:var(--md)">' +
    plural(pipSel.size, 'selecionada', 'selecionadas') + '</b>' +
    '<select id="moverPara" style="margin-left:auto" aria-label="Mover para">' + ETAPAS.map((n, i) => '<option value="' + i + '">Mover para ' + esc(n) + '</option>').join('') + '</select>' +
    '<button class="btn g sm" id="moverBt">Aplicar</button>' +
    '<button class="btn g sm" id="encSelBt">Encerrar</button>' +
    '<button class="btn g sm" id="limparSelBt">Limpar</button></div>';
  $('#moverBt').onclick = () => {
    const alvo = +$('#moverPara').value, n = pipSel.size;
    pipSel.forEach(id => { const ap = candidaturaPor(id); if(ap && ap.status === 'ativa') aplicar(ap, {tipo:'mover', etapa:alvo, quem:'conectaria'}); });
    toast(plural(n, 'movida', 'movidas') + ' para ' + ETAPAS[alvo] + '.');
    pipSel = new Set(); renderPipeline();
  };
  $('#encSelBt').onclick = () => abrirEncerrar([...pipSel]);
  $('#limparSelBt').onclick = () => { pipSel = new Set(); renderPipeline(); };
}

/* Encerrar sempre pede motivo do vocabulário fechado. É o que alimenta
   o quadro de motivos do painel e a medida "o match já apontava". */
function abrirEncerrar(ids){
  abrirModal('<h2 id="mTit">Encerrar ' + (ids.length > 1 ? ids.length + ' candidaturas' : 'candidatura') + '</h2>' +
    '<p class="sub">Escolha o motivo mais próximo. O candidato vê só que o processo foi encerrado, nunca o motivo.</p>' +
    '<div class="form" style="gap:var(--s2)"><div class="fg"><label for="motivoSel">Motivo</label>' +
    '<select id="motivoSel">' + MOTIVOS_REJEICAO.map(m => '<option value="' + m.id + '">' + esc(m.r) + '</option>').join('') + '</select></div>' +
    '<div class="fg"><label for="notaRep">Nota interna <span class="opc">opcional</span></label><textarea id="notaRep" rows="2"></textarea></div>' +
    '<button class="btn w" id="okEnc">Encerrar</button><button class="btn g w" id="cancEnc">Cancelar</button></div>');
  $('#cancEnc').onclick = fecharModal;
  $('#okEnc').onclick = () => {
    const motivoId = $('#motivoSel').value, nota = $('#notaRep').value.trim();
    ids.forEach(id => { const ap = candidaturaPor(id); if(ap) aplicar(ap, {tipo:'reprovar', motivoId, nota, quem:'conectaria'}); });
    fecharModal();
    toast(ids.length > 1 ? ids.length + ' candidaturas encerradas.' : 'Candidatura encerrada.');
    pipSel = new Set();
    if(S.view === 'pipeline') renderPipeline();
    if(ids.length === 1 && gavetaAberta === ids[0]) gavetaCandidatura(ids[0]);
  };
}

/* Gaveta: tudo o que a Conectaria precisa para decidir e para ligar. */
function gavetaCandidatura(id){

    blocoFit(ap.rec) +
    blocoPerfil(c) +

        : h.status === 'contratada' ? 'Contratação' : h.de === h.para ? 'Reaberta em ' + esc(ETAPAS[h.para]) : (h.para < h.de ? 'Voltou para ' : 'Avançou para ') + esc(ETAPAS[h.para])) + '</b>' +

/* ══ parte: partes/js/54-admin-talentos.js ══ */
/* ══════════════════ CONECTARIA · BANCO DE TALENTOS ══════════════════
   Todo mundo que se cadastrou, com ou sem candidatura. É aqui que a
   Conectaria procura gente quando abre uma vaga nova: escolhe a vaga,
   a lista ordena por aderência e dá para trazer a pessoa para o
   processo, que entra com origem "banco de talentos". */

function vTalentos(){
  const f = S.adm.tal;
  const vaga = f.vaga ? vagaPor(f.vaga) : null;
  const q = normalizar(f.q.trim());
  let lista = DB.candidatos.filter(c =>
    (!f.area || c.areaId === f.area) && (!f.uf || c.uf === f.uf) &&
    (!q || normalizar([c.nome, c.cidade, ...(c.cargos || []).map(id => CARGO[id] ? CARGO[id].n : ''),
      ...(c.competencias || []).map(k => skillNome(k.skillId))].join(' ')).includes(q)));
  const fits = new Map(vaga ? lista.map(c => [c.id, avaliar(c, vaga)]) : []);
  lista = vaga ? lista.sort((a, b) => fits.get(b.id).total - fits.get(a.id).total)
    : lista.sort((a, b) => new Date(b.criadoEm) - new Date(a.criadoEm));
  const ufs = [...new Set(DB.candidatos.map(c => c.uf).filter(Boolean))].sort();
  const vagasOp = vagasPublicadas().sort((a, b) => empresaPor(a.empresaId).n.localeCompare(empresaPor(b.empresaId).n));

  $('#v-talentos').innerHTML =
  '<div class="barra" style="margin-top:var(--s5)"><h2>Banco de talentos</h2>' +
    '<p class="cont">' + plural(lista.length, 'pessoa', 'pessoas') + (lista.length !== DB.candidatos.length ? ' de ' + DB.candidatos.length : '') + '</p></div>' +
  '<div class="filtrost">' +
    '<div class="fg"><label for="tVaga">Comparar com a vaga</label><select id="tVaga"><option value="">nenhuma, ver todos</option>' +
      vagasOp.map(v => '<option value="' + v.id + '"' + (f.vaga === v.id ? ' selected' : '') + '>' + esc(empresaPor(v.empresaId).n + ' · ' + v.titulo) + '</option>').join('') + '</select></div>' +
    '<div class="fg"><label for="tArea">Área</label><select id="tArea"><option value="">todas</option>' +
      areasOrdenadas().map(a => '<option value="' + a.id + '"' + (f.area === a.id ? ' selected' : '') + '>' + esc(a.n) + '</option>').join('') + '</select></div>' +
    '<div class="fg"><label for="tUf">Estado</label><select id="tUf"><option value="">todos</option>' +
      ufs.map(u => '<option' + (f.uf === u ? ' selected' : '') + '>' + u + '</option>').join('') + '</select></div>' +
    '<div class="fg"><label for="tQ">Buscar</label><input id="tQ" type="search" value="' + esc(f.q) + '" placeholder="nome, cargo, atividade"></div>' +
  '</div>' +
  (vaga ? '<p class="hint" style="margin:0 0 var(--s2)">Ordenado por aderência a <b>' + esc(vaga.titulo) + '</b>, com os requisitos e o local da vaga.</p>' : '') +
  '<div class="bloco" style="margin-top:0"><div class="tabw"><table class="tab"><thead><tr>' +
    '<th>Pessoa</th><th>Área e cargo</th><th>Onde</th>' + (vaga ? '<th>Aderência</th><th></th>' : '<th>Candidaturas</th>') + '</tr></thead><tbody>' +
    (lista.length ? lista.map(c => {
      const cargo = (c.cargos || [])[0] && CARGO[c.cargos[0]] ? CARGO[c.cargos[0]].n : '—';
      const noProc = vaga && jaCandidatou(c.id, vaga.id);
      return '<tr><td><button class="nomebt" data-vertal="' + c.id + '">' + esc(c.nome) + '</button>' +
        '<div class="sub2">cadastro ' + tempoRel(c.criadoEm) + (c.exemplo ? ' · exemplo' : '') + '</div></td>' +
        '<td>' + esc(AREA[c.areaId] ? AREA[c.areaId].n : '—') + '<div class="sub2">' + esc(cargo) + '</div></td>' +
        '<td>' + esc([c.cidade, c.uf].filter(Boolean).join(', ')) + '</td>' +
        (vaga ? '<td>' + barraFit(fits.get(c.id).total) + '</td><td class="pipAcoes">' +
          (noProc ? '<span class="pill ok"><i></i>no processo</span>' : '<button class="btn g sm" data-trazer="' + c.id + '">Trazer para a vaga</button>') + '</td>'
          : '<td>' + candidaturasDoCandidato(c.id).length + '</td>') + '</tr>';
    }).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--i62);padding:var(--s4) 0">Ninguém com esse filtro.</td></tr>') +
  '</tbody></table></div></div>';

  $('#tVaga').onchange = e => { f.vaga = e.target.value; vTalentos(); };
  $('#tArea').onchange = e => { f.area = e.target.value; vTalentos(); };
  $('#tUf').onchange = e => { f.uf = e.target.value; vTalentos(); };
  $('#tQ').oninput = debounce(e => { f.q = e.target.value; vTalentos(); const i = $('#tQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 220);
  $$('[data-vertal]').forEach(b => b.onclick = () => gavetaTalento(b.dataset.vertal));
  $$('[data-trazer]').forEach(b => b.onclick = () => trazerParaVaga(b.dataset.trazer, vaga.id));
}

function trazerParaVaga(cid, vid){
  const ap = criarCandidatura(cid, vid, 'banco', 'conectaria');
  if(!ap) return;
  garantirRec(ap); salvar();
  toast(candidatoPor(cid).nome.split(' ')[0] + ' entrou no processo de ' + vagaPor(vid).titulo + '.');
  if(S.view === 'talentos') vTalentos();
  if(gavetaAberta === 't:' + cid) gavetaTalento(cid);
}

function gavetaTalento(cid){
  const c = candidatoPor(cid), vaga = S.adm.tal.vaga ? vagaPor(S.adm.tal.vaga) : null;
  const aps = candidaturasDoCandidato(cid);
  abrirGaveta(c.nome, c.exemplo ? 'exemplo' : '',
    blocoContato(c, vaga) +
    (vaga ? blocoFit(montarRec(c, vaga)) + (jaCandidatou(cid, vaga.id) ? '' :
      '<button class="btn w" id="gvTrazer">Trazer para ' + esc(vaga.titulo) + '</button>') : '') +
    blocoPerfil(c) +
    '<div class="gv"><h4>Candidaturas</h4>' + (aps.length ? '<ul class="apsl">' + aps.map(a => {
      const v = vagaPor(a.vagaId);
      return '<li><button class="link" data-irpipc="' + v.id + '">' + esc(v.titulo) + '</button> ' + pillStatus(a) + '</li>';
    }).join('') + '</ul>' : '<p class="hint">Nenhuma ainda.</p>') + '</div>',
    't:' + cid);
  const t = $('#gvTrazer'); if(t) t.onclick = () => trazerParaVaga(cid, vaga.id);
  $$('#drwBody [data-irpipc]').forEach(b => b.onclick = () => { fecharGaveta(); ir('pipeline', b.dataset.irpipc); });
  animaEixos();
}

const ROTAS = {

  vaga:      {r:vVaga},
  cadastro:  {r:vCadastro, lado:'cand'},
  minhas:    {r:vMinhas, lado:'cand', conta:true},
  perfil:    {r:vPerfil, lado:'cand', conta:true},
  painel:    {r:vPainel, lado:'admin'},
  empresas:  {r:vEmpresas, lado:'admin'},
  avagas:    {r:vAvagas, lado:'admin'},
  vagaform:  {r:vVagaform, lado:'admin'},
  pipeline:  {r:vPipeline, lado:'admin'},
  talentos:  {r:vTalentos, lado:'admin'},
};
const MENU = {
  cand:  [['vagas','Vagas','nvHome'], ['minhas','Minhas candidaturas','nvMala'], ['perfil','Meu perfil','nvTag']],
  admin: [['painel','Painel','nvGraf'], ['avagas','Vagas','nvLista'], ['pipeline','Processos','nvPessoas'],
          ['talentos','Talentos','nvTag'], ['empresas','Empresas','nvPredio']],
};
/* tela filha acende o item do menu de que ela faz parte */
const PAI = {vaga:'vagas', vagaform:'avagas'};

function ir(v, arg){
  const rota = ROTAS[v] || ROTAS.vagas;
  if(rota.lado === 'admin' && S.papel !== 'admin') v = 'vagas';
  else if(rota.lado === 'cand' && S.papel !== 'cand') v = 'painel';
  else if(rota.conta && !eu()){ iniciarCadastro(); return; }
  fecharGaveta();
  S.view = v; S.arg = arg ?? null;
  $$('.view').forEach(x => x.classList.remove('on'));
  const el = $('#v-' + v); el.classList.add('on');
  if(ROTAS[v].lado === 'admin') garantirRecs();
  try{ ROTAS[v].r(arg); }
  catch(err){
    console.error('[conectaria vagas] falha ao montar "' + v + '"', err);
    el.innerHTML = '<div class="estado"><div class="ic">' + I.al + '</div><h3>Não consegui montar esta tela.</h3>' +
      '<p>O que já foi preenchido continua salvo. Tente de novo ou volte para as vagas.</p>' +
      '<button class="btn" data-ir="vagas">Ver vagas</button>' +
      '<details class="errodet"><summary>Detalhe técnico</summary><pre>' + esc(String((err && err.stack) || err)) + '</pre></details></div>';
  }
  montarNav(); marcarRolaveis();
  window.scrollTo({top:0, behavior:'instant'});
  if(['vaga','cadastro','vagaform'].includes(v)) el.focus({preventScroll:true});
}

function montarNav(){
  const c = eu();
  const itens = S.papel === 'admin' ? MENU.admin : c ? MENU.cand : [MENU.cand[0]];
  const atual = PAI[S.view] || S.view;
  $('#tnav').innerHTML = itens.map(([k, r]) =>
    '<button data-ir="' + k + '"' + (atual === k ? ' aria-current="page"' : '') + '>' + esc(r) + '</button>').join('');

  const tb = $('#tabbar');
  if(itens.length > 1){
    tb.hidden = false;
    tb.innerHTML = itens.map(([k, r, ic]) => '<button data-ir="' + k + '"' + (atual === k ? ' aria-current="page"' : '') + '>' +
      I[ic] + '<span>' + esc(r.split(' ')[0] === 'Minhas' ? 'Candidaturas' : r.replace('Meu ', '').replace(/^./, x => x.toUpperCase())) + '</span></button>').join('');
  } else { tb.hidden = true; tb.innerHTML = ''; }
  document.body.classList.toggle('comAbas', itens.length > 1);

  $('#tdir').innerHTML = S.papel === 'admin'
    ? '<span class="pill ac"><i></i>Equipe Conectaria</span>'
    : c
    ? '<button class="btn g sm" id="btSair">Sair</button><button class="av" data-ir="perfil" aria-label="Meu perfil">' +
      esc(c.nome.split(' ').slice(0, 2).map(x => x[0]).join('').toUpperCase()) + '</button>'
    : (S.cad && S.view !== 'cadastro' ? '<button class="btn sm" id="btContinuar">Continuar cadastro</button>'
      : '<button class="btn g sm" id="btEntrar">Entrar</button><button class="btn sm" id="btCriar">Cadastrar</button>');
  const s = $('#btSair'); if(s) s.onclick = sairCandidato;
  const en = $('#btEntrar'); if(en) en.onclick = abrirEntrar;
  const cr = $('#btCriar'); if(cr) cr.onclick = () => { S.vagaAlvo = null; iniciarCadastro(); };
  const co = $('#btContinuar'); if(co) co.onclick = () => ir('cadastro');

  $$('[data-papel]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.papel === S.papel)));
}

/* Tabela que rola de lado precisa ser alcançável pelo teclado. */
function marcarRolaveis(){
  $$('.tabw').forEach(el => {
    if(el.scrollWidth > el.clientWidth + 1){
      el.tabIndex = 0; el.setAttribute('role', 'region');
      if(!el.hasAttribute('aria-label')) el.setAttribute('aria-label', 'Tabela, role para os lados');

}

function trocarPapel(p){

  S.papel = p; salvar();
  ir(p === 'admin' ? 'painel' : 'vagas');

}
function recomecar(){
  confirmar('Recomeçar o teste?', 'Volta tudo ao estado inicial: empresas e vagas do site, candidatos de exemplo. ' +
    'O que foi cadastrado neste navegador é apagado.', 'Recomeçar', () => {
      semear(); S.papel = 'cand'; S.q = ''; S.area = null; rasc = null; salvar();
      ir('vagas'); toast('Teste recomeçado.');
    }, true);
}

/* ══ parte: partes/js/99-boot.js ══ */
/* ══════════════════ BOOT ══════════════════
   Sempre por último. Confere os vínculos que falham em silêncio, carrega
   (ou semeia) o banco, liga os eventos globais e abre a primeira tela. */

/* Família errada cai no `_padrao` sem erro nenhum, e o número continua
   plausível. Por isso a conferência é aqui, alta, no carregamento. */
(function conferir(){
  const prob = [];
  for(const [fam, w] of Object.entries(POLITICA_VAGAS.pesos_por_familia)){
    if(Math.abs(w.tecnico + w.cultural + w.contexto - 1) > 1e-9) prob.push('pesos de ' + fam + ' não somam 1');
    if(w.cultural !== 0) prob.push('peso cultural de ' + fam + ' não é zero');
  }
  AREAS.forEach(a => { if(!(a.fam in POLITICA_VAGAS.pesos_por_familia)) prob.push('área ' + a.id + ' sem família válida'); });
  CARGOS.forEach(c => { if(!(familiaDe(c) in POLITICA_VAGAS.pesos_por_familia)) prob.push('cargo ' + c.id + ' sem família válida'); });
  CARGOS.forEach(c => c.sk.forEach(s => { if(!SKILL[s]) prob.push('cargo ' + c.id + ' cita skill inexistente ' + s); }));
  VAGAS_SEED.forEach(v => { if(!CARGO[v[2]]) prob.push('vaga ' + v[0] + ' com cargo inexistente'); if(!EMPRESAS_SEED.some(e => e.id === v[1])) prob.push('vaga ' + v[0] + ' com empresa inexistente'); });
  if(ETAPAS.length !== DIST_ETAPA.length) prob.push('ETAPAS e DIST_ETAPA com tamanhos diferentes');
  if(prob.length) console.error('[conectaria vagas] dados inconsistentes:\n  ' + prob.join('\n  '));
})();

if(!carregar()) semear();

document.addEventListener('click', e => {
  const ir_ = e.target.closest('[data-ir]');
  if(ir_ && document.contains(ir_)){ ir(ir_.dataset.ir, ir_.dataset.irarg); return; }
  const cp = e.target.closest('[data-copiar]');
  if(cp){ copiar(cp.dataset.copiar); return; }
  const pp = e.target.closest('[data-papel]');
  if(pp){ trocarPapel(pp.dataset.papel); return; }
});
document.addEventListener('keydown', e => {
  prenderFoco(e);
  if(e.key !== 'Escape') return;
  if($('#mbox').classList.contains('on')) fecharModal();
  else if($('#drw').classList.contains('on')) fecharGaveta();
});
$('#scrim').onclick = fecharModal;
$('#drwX').onclick = fecharGaveta;
$('#btTema').onclick = alternarTema;
$('#btReset').onclick = recomecar;
addEventListener('resize', debounce(marcarRolaveis, 200), {passive:true});

ir(S.papel === 'admin' ? 'painel' : 'vagas');
</script>
