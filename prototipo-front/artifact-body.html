:root{
  --ac1:#00587F; --ac2:#0A7BA8; --ac3:#189CCC; --ac4:#5CC2E8; --ac5:#B4E8FA;
  --deep:#0C5F92; --ac-rgb:24,156,204;

  --papel:#F7FAFC; --card:#FFFFFF; --papel2:#EDF3F8; --papel3:#E3ECF3;
  --tinta:13,26,38;

  --i92:rgba(var(--tinta),.92); --i72:rgba(var(--tinta),.72); --i52:rgba(var(--tinta),.52);
  --i34:rgba(var(--tinta),.34); --i14:rgba(var(--tinta),.14); --i08:rgba(var(--tinta),.08);
  --i04:rgba(var(--tinta),.04);

  --veu:rgba(var(--ac-rgb),.10); --veu2:rgba(var(--ac-rgb),.05);

  /* semânticos: independentes do acento, para estado nunca competir com marca */
  --ok:#0C8A5C;  --ok-bg:rgba(12,138,92,.11);   --ok-fg:#086543;
  --al:#B0741A;  --al-bg:rgba(176,116,26,.13);  --al-fg:#8A5A13;
  --bl:#B3382F;  --bl-bg:rgba(179,56,47,.11);   --bl-fg:#8E2B24;
  --ne:#8794A1;

  /* superfícies especiais tokenizadas para o tema escuro não quebrar */
  --escura:#0E2233;        /* barra utilitária, painel de schema */
  --escura2:#16324A;
  --escura-tx:rgba(255,255,255,.86);
  --escura-tx2:rgba(255,255,255,.5);
  --escura-li:rgba(255,255,255,.12);
  --toast-bg:rgba(13,26,38,.96); --toast-fg:#fff;
  --sobre:#fff;            /* texto sobre preenchimento de acento sólido */

  --s1:6px; --s2:12px; --s3:20px; --s4:32px; --s5:52px; --s6:80px;
  --r:14px; --r2:10px; --r3:7px; --pill:100px;
  --sh:0 1px 2px rgba(13,26,38,.04),0 10px 30px -22px rgba(13,26,38,.35);
  --sh2:0 2px 6px rgba(13,26,38,.05),0 26px 56px -34px rgba(13,26,38,.42);
  --sh3:0 4px 10px rgba(13,26,38,.06),0 40px 80px -40px rgba(13,26,38,.5);
  --e:cubic-bezier(.19,1,.22,1);
  --e2:cubic-bezier(.34,1.56,.64,1);

  --d:'Outfit',system-ui,sans-serif; --f:'Inter',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --xs:.7rem; --sm:.8125rem; --md:.9375rem; --lg:1.0625rem;
  --xl:1.35rem; --xxl:clamp(1.7rem,3vw,2.3rem); --hero:clamp(2.1rem,4.6vw,3.5rem);
}

/* tema escuro: só os tokens mudam. A tinta inverte e as superfícies
   descem; todas as derivações rgba() seguem junto sem tocar nos componentes. */
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ac1:#7FD4F5; --ac2:#5CC2E8; --ac3:#189CCC; --ac4:#2E8FB8; --ac5:#1D5C7C;
    --deep:#4FB6E0;
    --papel:#0A141E; --card:#101E2B; --papel2:#152634; --papel3:#1B2F40;
    --tinta:226,238,247;
    --veu:rgba(var(--ac-rgb),.16); --veu2:rgba(var(--ac-rgb),.09);
    --ok:#3FBF8B; --ok-bg:rgba(63,191,139,.14);  --ok-fg:#6EDCAC;
    --al:#D8A34A; --al-bg:rgba(216,163,74,.15);  --al-fg:#EFC078;
    --bl:#E0736A; --bl-bg:rgba(224,115,106,.14); --bl-fg:#F09A92;
    --escura:#081722; --escura2:#122B3D;
    --toast-bg:rgba(232,242,250,.96); --toast-fg:#0A141E;
    --sobre:#04121C;
    --sh:0 1px 2px rgba(0,0,0,.5),0 10px 30px -22px rgba(0,0,0,.8);
    --sh2:0 2px 6px rgba(0,0,0,.55),0 26px 56px -34px rgba(0,0,0,.85);
    --sh3:0 4px 10px rgba(0,0,0,.6),0 40px 80px -40px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ac1:#7FD4F5; --ac2:#5CC2E8; --ac3:#189CCC; --ac4:#2E8FB8; --ac5:#1D5C7C;
  --deep:#4FB6E0;
  --papel:#0A141E; --card:#101E2B; --papel2:#152634; --papel3:#1B2F40;
  --tinta:226,238,247;
  --veu:rgba(var(--ac-rgb),.16); --veu2:rgba(var(--ac-rgb),.09);
  --ok:#3FBF8B; --ok-bg:rgba(63,191,139,.14);  --ok-fg:#6EDCAC;
  --al:#D8A34A; --al-bg:rgba(216,163,74,.15);  --al-fg:#EFC078;
  --bl:#E0736A; --bl-bg:rgba(224,115,106,.14); --bl-fg:#F09A92;
  --escura:#081722; --escura2:#122B3D;
  --toast-bg:rgba(232,242,250,.96); --toast-fg:#0A141E;
  --sobre:#04121C;
  --sh:0 1px 2px rgba(0,0,0,.5),0 10px 30px -22px rgba(0,0,0,.8);
  --sh2:0 2px 6px rgba(0,0,0,.55),0 26px 56px -34px rgba(0,0,0,.85);
  --sh3:0 4px 10px rgba(0,0,0,.6),0 40px 80px -40px rgba(0,0,0,.9);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
/* A transição precisa ser em background-color, não no atalho background:
   o atalho carrega background-image e o navegador não interpola, então a
   troca de tema ficava presa na cor antiga. */
body{background-color:var(--papel);color:var(--i92);font-family:var(--f);font-size:18px;
  line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background-color .3s var(--e),color .3s var(--e)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3{font-family:var(--d);font-weight:700;letter-spacing:-.03em;line-height:1.08;
  text-wrap:balance}
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--ac3);outline-offset:2px;border-radius:5px}
::selection{background:var(--veu);color:var(--i92)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= TOPO ================= */
.topo{position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--papel) 86%,transparent);
  backdrop-filter:saturate(1.5) blur(12px);border-bottom:1px solid transparent;
  transition:border-color .25s var(--e),box-shadow .25s var(--e)}
.topo.stuck{border-color:var(--i08);box-shadow:0 10px 30px -28px rgba(0,0,0,.5)}
.tin{max-width:1180px;margin:0 auto;padding:13px clamp(16px,4vw,30px);
  display:flex;align-items:center;gap:var(--s3)}
.logo{display:flex;align-items:center;gap:8px}
.logo img.s{height:29px} .logo img.w{height:16px}
/* a logotipia é PNG escuro: no tema escuro ela é invertida para não sumir */
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .logo img.w{filter:brightness(0) invert(1) opacity(.92)}
}
:root[data-theme="dark"] .logo img.w{filter:brightness(0) invert(1) opacity(.92)}
.tnav{display:flex;gap:2px;margin-left:var(--s2)}
.tnav button{font-size:var(--sm);color:var(--i52);padding:7px 12px;border-radius:var(--r3);
  transition:color .16s var(--e),background .16s var(--e);position:relative}
@media(hover:hover){.tnav button:hover{color:var(--i92);background:var(--i04)}}
.tnav button[aria-current=page]{color:var(--ac1);background:var(--veu);font-weight:600}
.tdir{margin-left:auto;display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:var(--pill);display:grid;place-items:center;
  font-size:var(--xs);font-weight:700;color:#fff;
  background:linear-gradient(140deg,var(--ac3),var(--deep));flex:none}

/* botão de tema e de paleta de comandos, na barra utilitária */
.uic{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.09);
  border-radius:var(--r3);padding:6px 11px;color:inherit;font-size:var(--xs);font-weight:600;
  transition:background .16s var(--e)}
@media(hover:hover){.uic:hover{background:rgba(255,255,255,.17)}}
.uic kbd{font-family:var(--mono);font-size:.62rem;background:rgba(255,255,255,.16);
  border-radius:4px;padding:2px 5px;letter-spacing:.02em}
.uic .sun,.uic .moon{display:none}
:root[data-theme="dark"] .uic .sun{display:block}
:root[data-theme="light"] .uic .moon{display:block}
:root:not([data-theme]) .uic .moon{display:block}
@media(prefers-color-scheme:dark){:root:not([data-theme]) .uic .moon{display:none}
  :root:not([data-theme]) .uic .sun{display:block}}

/* ================= LAYOUT ================= */
.pg{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,30px) var(--s6)}

/* Item de grade não encolhe abaixo do próprio conteúdo: min-width vale
   auto por padrão. Com uma tabela rolável dentro, o min-content dela
   estoura a coluna e empurra a página inteira de lado no celular. */
.split>*,.tri>*,.cmp>*,.vagas>*,.cds>*,.kpis>*,.corpo{min-width:0}
.tabw{max-width:100%}

.view{display:none}
.view.on{display:block;animation:sobe .36s var(--e) both}
@keyframes sobe{from{opacity:0;transform:translateY(12px)}}

/* revelação escalonada por observador de rolagem */
.rv{opacity:0;transform:translateY(14px);
  transition:opacity .55s var(--e),transform .55s var(--e)}
.rv.vis{opacity:1;transform:none}

/* ================= HERO ================= */
.hero{position:relative;padding:var(--s5) 0 var(--s4);overflow:hidden}
.malha{position:absolute;inset:-10% -20% auto;height:420px;z-index:0;pointer-events:none;
  opacity:.5;mask-image:radial-gradient(72% 62% at 52% 34%,#000 30%,transparent 78%)}
.hero>*:not(svg){position:relative;z-index:1}
.hero h1{font-size:var(--hero);max-width:15ch}
.hero h1 em{font-style:normal;color:var(--ac2)}
.hero p{max-width:52ch;color:var(--i72);margin-top:var(--s2);font-size:var(--lg)}
.selo{display:inline-flex;align-items:center;gap:8px;font-size:var(--xs);font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ac1);background:var(--veu);
  border-radius:var(--pill);padding:6px 14px;margin-bottom:var(--s3)}
.selo i{width:6px;height:6px;border-radius:50%;background:var(--ac3);animation:bate 2.6s infinite}
@keyframes bate{0%,100%{opacity:1}50%{opacity:.25}}

.buscador{display:flex;gap:8px;background:var(--card);border:1px solid var(--i08);
  border-radius:var(--r);padding:8px;box-shadow:var(--sh2);margin-top:var(--s4);
  max-width:760px;flex-wrap:wrap;transition:border-color .2s var(--e),box-shadow .2s var(--e)}
.buscador:focus-within{border-color:var(--ac4);box-shadow:var(--sh3)}
.bfield{display:flex;align-items:center;gap:9px;padding:9px 12px;flex:1 1 210px;min-width:0;
  border-radius:var(--r2)}
.bfield+.bfield{border-left:1px solid var(--i08)}
.bfield svg{color:var(--i34);flex:none}
.bfield input,.bfield select{border:0;outline:0;background:none;width:100%;font-size:var(--md)}
.bfield label{font-size:var(--xs);color:var(--i52);display:block;margin-bottom:-2px;font-weight:500}
.sugere{display:flex;gap:7px;flex-wrap:wrap;margin-top:var(--s3);align-items:center}
.sugere span{font-size:var(--xs);color:var(--i52)}
.sug{font-size:var(--xs);border:1px solid var(--i14);border-radius:var(--pill);padding:5px 12px;
  color:var(--i72);transition:border-color .16s var(--e),color .16s var(--e),
  background .16s var(--e),transform .13s var(--e)}
@media(hover:hover){.sug:hover{border-color:var(--ac4);color:var(--ac1);background:var(--veu2)}}
.sug:active{transform:scale(.95)}

/* ================= VAGAS ================= */
.barra{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin:var(--s5) 0 var(--s3);
  padding-bottom:var(--s2);border-bottom:1px solid var(--i08)}
.barra h2{font-size:var(--xl)}
.cont{font-size:var(--sm);color:var(--i52)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{font-size:var(--sm);border:1px solid var(--i14);border-radius:var(--pill);padding:6px 13px;
  color:var(--i72);transition:border-color .16s var(--e),background .16s var(--e),
  color .16s var(--e),transform .13s var(--e)}
@media(hover:hover){.chip:hover{border-color:var(--ac4)}}
.chip:active{transform:scale(.96)}
.chip[aria-pressed=true]{background:var(--ac1);border-color:var(--ac1);color:var(--sobre)}

.vagas{display:grid;gap:var(--s2)}
.vaga{background:var(--card);border:1px solid var(--i08);border-radius:var(--r);padding:var(--s3);
  display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:center;width:100%;
  text-align:left;position:relative;overflow:hidden;
  transition:transform .2s var(--e),box-shadow .2s var(--e),border-color .2s var(--e)}
/* trilho de acento que só aparece no hover: sinaliza alvo sem poluir o repouso */
.vaga::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--ac3),var(--deep));
  transform:scaleY(0);transform-origin:50% 0;transition:transform .3s var(--e)}
@media(hover:hover){.vaga:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--ac5)}
  .vaga:hover::before{transform:scaleY(1)}}
.vaga:active{transform:scale(.994)}
.vaga h3{font-size:var(--lg);font-family:var(--d);letter-spacing:-.02em}
.vaga.sel{border-color:var(--ac3);box-shadow:0 0 0 1px var(--ac3)}
.emp{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.emplogo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:var(--xs);
  font-weight:700;color:#fff;flex:none}
.emp b{font-size:var(--sm);font-weight:600;color:var(--i72)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--sm);color:var(--i52);margin-top:9px}
.meta span{display:flex;align-items:center;gap:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.tag{font-size:var(--xs);border:1px solid var(--i14);border-radius:var(--pill);padding:3px 10px;
  color:var(--i72)}
.tag.hi{background:var(--veu);border-color:transparent;color:var(--ac1);font-weight:600}
.tag.cob{background:var(--ok-bg);border-color:transparent;color:var(--ok-fg);font-weight:600}

/* Link esticado: o card inteiro navega, mas o botão de comparar continua
   clicável por cima. Evita botão dentro de botão, que é HTML inválido. */
.vaga .stretch{position:absolute;inset:0;z-index:1;border-radius:var(--r);
  background:none;border:0;padding:0}
.vaga .conteudo{position:relative;z-index:0;min-width:0}
.vaga .vdir{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  gap:9px;justify-self:end}
.cmpbt{font-size:var(--xs);border:1px solid var(--i14);border-radius:var(--pill);padding:4px 11px;
  color:var(--i52);white-space:nowrap;
  transition:border-color .16s var(--e),color .16s var(--e),background .16s var(--e)}
@media(hover:hover){.cmpbt:hover{border-color:var(--ac4);color:var(--ac1)}}
.cmpbt.on{background:var(--ac1);border-color:var(--ac1);color:var(--sobre);font-weight:600}
@media(max-width:900px){.vaga .vdir{justify-self:start;flex-direction:row;align-items:center}}

/* ---- medidor de match: anel de nota + arco de confiança ---- */
.med{position:relative;width:66px;height:66px;flex:none;display:grid;place-items:center}
.med svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.med .tr{fill:none;stroke:var(--i08);stroke-width:6}
.med .pr{fill:none;stroke:var(--ac3);stroke-width:6;stroke-linecap:round;
  stroke-dasharray:var(--circ);stroke-dashoffset:var(--circ);
  transition:stroke-dashoffset 1s var(--e),stroke .4s var(--e)}
.med .cf{fill:none;stroke:var(--ac5);stroke-width:2.5;stroke-linecap:round;
  stroke-dasharray:var(--circ2);stroke-dashoffset:var(--circ2);
  transition:stroke-dashoffset 1.1s var(--e) .12s,stroke .4s var(--e)}
.med.baixa .pr{stroke:var(--al)} .med.baixa .cf{stroke:var(--al-bg)}
.med.blk .pr{stroke:var(--bl)}   .med.blk .cf{stroke:var(--bl-bg)}
.med b{position:relative;z-index:1;font-size:var(--sm);font-weight:700;font-family:var(--d);
  font-variant-numeric:tabular-nums}
.medw{display:flex;flex-direction:column;align-items:center;gap:5px}
.medw small{font-size:var(--xs);color:var(--i52);letter-spacing:.04em}
.med.g{width:104px;height:104px}
.med.g b{font-size:1.6rem}

/* cadeado quando não logado */
.lock{position:relative;display:grid;place-items:center;width:62px;height:62px;border-radius:50%;
  border:2px dashed var(--i14);color:var(--i34)}
.lockw{display:flex;flex-direction:column;align-items:center;gap:5px}
.lockw small{font-size:var(--xs);color:var(--i34)}
.gate{background:linear-gradient(150deg,var(--veu),var(--veu2));border:1px solid var(--ac5);
  border-radius:var(--r);padding:var(--s3);text-align:center}
.gate h4{font-family:var(--d);font-size:var(--md);margin-bottom:6px}
.gate p{font-size:var(--sm);color:var(--i72);margin-bottom:var(--s2)}

/* ================= DETALHE ================= */
.volta{display:inline-flex;align-items:center;gap:7px;font-size:var(--sm);color:var(--i52);
  padding:var(--s4) 0 var(--s3);transition:color .16s var(--e),gap .16s var(--e)}
@media(hover:hover){.volta:hover{color:var(--ac1);gap:11px}}
.split{display:grid;grid-template-columns:1fr 342px;gap:var(--s5);align-items:start}
.corpo h1{font-size:var(--xxl);max-width:20ch}
.corpo h4{font-size:var(--xs);letter-spacing:.12em;text-transform:uppercase;color:var(--i52);
  margin:var(--s4) 0 var(--s2);font-family:var(--f);font-weight:600}
.corpo p{color:var(--i72);font-size:var(--md);margin-bottom:var(--s2);max-width:64ch}
.corpo ul{list-style:none;max-width:64ch}
.corpo li{position:relative;padding-left:22px;color:var(--i72);font-size:var(--md);margin-bottom:9px}
.corpo li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;
  border-radius:2px;background:var(--ac4)}
.lateral{position:sticky;top:82px;display:grid;gap:var(--s2)}
.box{background:var(--card);border:1px solid var(--i08);border-radius:var(--r);padding:var(--s3);
  box-shadow:var(--sh)}
.box h4{font-family:var(--d);font-size:var(--md);font-weight:700;margin-bottom:var(--s2)}
.linha{display:flex;justify-content:space-between;gap:12px;font-size:var(--sm);padding:8px 0;
  border-bottom:1px solid var(--i04)}
.linha:last-child{border:0}
.linha span{color:var(--i52)} .linha b{font-weight:600;text-align:right}

/* ---- dimensões com barra e confiança ---- */
.eixos{display:grid;gap:11px;margin-top:var(--s2)}
.eixo{display:grid;grid-template-columns:88px 1fr 34px;gap:10px;align-items:center;font-size:var(--xs)}
.eixo .n{color:var(--i72)}
.eixo .t{height:6px;background:var(--i08);border-radius:3px;overflow:hidden;position:relative}
.eixo .t i{display:block;height:100%;border-radius:3px;background:var(--ac3);width:0;
  transition:width .8s var(--e)}
.eixo .v{text-align:right;font-weight:700;color:var(--i72);font-variant-numeric:tabular-nums}
.porque{font-size:var(--xs);color:var(--i52);line-height:1.65;margin-top:var(--s2);
  padding-top:var(--s2);border-top:1px solid var(--i04)}

/* ---- barra de confiança fina, sob a nota ---- */
.cbar{height:3px;border-radius:2px;background:var(--i08);overflow:hidden;margin-top:5px}
.cbar i{display:block;height:100%;width:0;border-radius:2px;background:var(--ac5);
  transition:width .9s var(--e) .1s}
.cbar.bx i{background:var(--al)}

/* ================= EVIDÊNCIAS ================= */
.evs{display:grid;gap:7px;margin-top:var(--s2)}
.ev{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r3);
  background:var(--papel2);border-left:3px solid var(--ne);
  animation:evin .42s var(--e) both}
@keyframes evin{from{opacity:0;transform:translateX(-6px)}}
.ev .ei{width:17px;height:17px;border-radius:50%;flex:none;display:grid;place-items:center;
  margin-top:1px;color:var(--sobre);font-size:10px;font-weight:700}
.ev p{font-size:var(--sm);color:var(--i92);line-height:1.5}

/* ═══════════════════════════════════════════════════════════════════
   MOVIMENTO
   Regra que vale para tudo aqui: a animação serve para explicar uma
   relação, não para enfeitar. O radar cresce do centro porque distância
   ao centro é o que ele mede; as evidências entram em cascata porque são
   uma lista ordenada por peso; o anel preenche porque é uma fração.

   Nenhuma delas parte de um estado escondido no CSS base — todas usam
   `animation ... both` com o `from` no keyframe. Isso importa porque o
   bloco de prefers-reduced-motion no fim do arquivo mata `animation`, e
   um elemento com `opacity:0` de base ficaria invisível para sempre.
   ═══════════════════════════════════════════════════════════════════ */

@keyframes sobeSuave{from{opacity:0;transform:translateY(14px)}}
@keyframes aparece{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.82)}}

/* ---- entrada do hero: uma leitura conduzida, não tudo de uma vez ---- */
.hero>.selo     {animation:sobeSuave .5s var(--e) both .04s}
.hero>h1        {animation:sobeSuave .58s var(--e) both .12s}
.hero>p         {animation:sobeSuave .58s var(--e) both .2s}
.hero>.buscador {animation:sobeSuave .58s var(--e) both .28s}
.hero>.sugere   {animation:sobeSuave .58s var(--e) both .36s}

/* a malha de fundo respira devagar. 26s é longo de propósito: movimento
   perceptível numa tela de trabalho vira distração em dez minutos */
@keyframes deriva{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%    {transform:translate3d(-16px,9px,0) scale(1.04)}
}
.malha{animation:deriva 26s ease-in-out infinite;will-change:transform}

/* ---- radar: cresce do centro, e os pontos assentam em sequência ---- */
@keyframes radarAbre{from{opacity:0;transform:scale(.55)}}
.radar .polC,.radar .polE{transform-box:fill-box;transform-origin:center}
.radar .polE{animation:radarAbre .62s var(--e) both .1s}
.radar .polC{animation:radarAbre .7s var(--e) both .2s}
.radar .dotp{transform-box:fill-box;transform-origin:center;
  animation:pop .36s var(--e2) both;animation-delay:calc(.52s + var(--i,0) * .028s)}
.radar .malhaR,.radar .spoke{animation:aparece .5s var(--e) both}
.radar .lbl{animation:aparece .5s var(--e) both .45s}

/* ---- evidências em cascata: a ordem é a ordem de peso ---- */
.ev{animation:evin .42s var(--e) both;animation-delay:calc(var(--i,0) * .05s)}

/* ---- selo do portão: aparece como decisão, com peso ---- */
.gt{animation:pop .34s var(--e2) both}

/* ---- o medidor sobe junto com o card ---- */
.med{transition:transform .25s var(--e)}
@media(hover:hover){.vaga:hover .med{transform:translateY(-2px) scale(1.05)}}

/* ---- barra de abas: indicador que cresce sob a aba ativa ---- */
.tabbar button{position:relative}
.tabbar button::before{content:"";position:absolute;top:2px;left:50%;width:0;height:2.5px;
  border-radius:2px;background:var(--ac1);transform:translateX(-50%);
  transition:width .3s var(--e2)}
.tabbar button[aria-current=page]::before{width:22px}

/* ---- troca de conteúdo da lista sem corte seco ---- */
.vagas{animation:aparece .32s var(--e) both}

/* nada acima pode deixar rastro quando o sistema pede menos movimento */
@media(prefers-reduced-motion:reduce){
  .malha{animation:none}
  .radar .dotp,.radar .polC,.radar .polE,.radar .lbl{opacity:1;transform:none}
}

/* ═══════════════════════════════════════════════════════════════════
   RESPONSIVO
   Três faixas: 900px solta as colunas, 620px é o telefone deitado ou
   pequeno, 400px é o telefone estreito. A barra de abas inferior existe
   porque abaixo de 900px a navegação do topo é escondida, e sem ela não
   havia como sair da lista de vagas no celular.
   ═══════════════════════════════════════════════════════════════════ */

.tabbar{display:none}
.tabbar[hidden]{display:none!important}

@media(max-width:900px){
  .split,.tri{grid-template-columns:1fr}
  .lateral,.schema{position:static}

  /* ---- barra de abas ---- */

    background:color-mix(in srgb,var(--card) 93%,transparent);
    backdrop-filter:saturate(1.5) blur(14px);

    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
    padding-left:max(6px,env(safe-area-inset-left,0px));
    padding-right:max(6px,env(safe-area-inset-right,0px));
  }
  .tabbar button{

    padding:6px 3px;border-radius:var(--r3);color:var(--i52);

    transition:color .16s var(--e),background .16s var(--e);
  }
  .tabbar button svg{width:20px;height:20px;flex:none}
  .tabbar button span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .tabbar button[aria-current=page]{color:var(--ac1);background:var(--veu)}
  @media(hover:hover){.tabbar button:hover{color:var(--i92)}}

  /* o conteúdo precisa terminar acima da barra, e o que flutua também.
     Só reserva o espaço quando a barra existe: deslogado ela não aparece. */
  .toast{left:var(--s2);right:var(--s2);transform:translateY(140px);max-width:none;

  .util a{display:none}
  .uidir{margin-left:0;width:100%;justify-content:space-between}

  .vaga .vdir{justify-self:stretch;flex-direction:row;align-items:center;

  .bfield{flex:1 1 100%}

  .barra{align-items:flex-start;gap:var(--s1)}

  .modal{place-items:end center;padding:0}
  .mbox{width:100%;max-width:none;border-radius:var(--r) var(--r) 0 0;

    transform:translateY(28px);max-height:92dvh}
  .mbox.on{transform:none}

  .cmdk{padding:10px var(--s2) var(--s2)}

/* ══════════════════ 2 · SOURCED VALUE ══════════════════
   Todo dado que entra no match carrega de onde veio e quanta confiança
   tem. É o tipo que impõe a regra "IA sugere, pessoa confirma": extração
   de documento não vira fato só por estar preenchida.                  */
const OBSERVADO = '2026-09-01T12:00:00.000Z';
const sv = (value, source='user', confidence=1, extra) =>
  ({value, source, confidence, observedAt:OBSERVADO,
    ...(source==='user'||source==='company'||source==='curator' ? {confirmedAt:OBSERVADO} : {}),
    ...extra});
const confirmado = v => v.source==='user'||v.source==='company'||v.source==='curator'||!!v.confirmedAt;

const FONTE_ROT = {
  user:'confirmado por você', company:'declarado pela empresa', curator:'checado pela curadoria',
  conversation:'extraído da conversa', document:'extraído de documento',
};

/* ══════════════════ 3 · PROJEÇÃO DE FEATURES ══════════════════
   Passagem obrigatória. É aqui, e só aqui, que se garante que feature
   proibida nunca chega ao cálculo. Se a checagem morasse no motor, cada
   caminho novo de entrada precisaria lembrar de fazer a verificação.   */
class ErroFeatureProibida extends Error {}

function projetar(ent, pol){
  const porId = new Map();
  const deny = new Set(pol.features.denylist);
  const allow = new Set(pol.features.allowlist);
  const por = f => {
    if(deny.has(f.id)) throw new ErroFeatureProibida(
      'feature "'+f.id+'" está na denylist da política '+pol.policy_version+
      '. Proxy de característica protegida não entra no modelo.');
    if(!allow.has(f.id)) throw new ErroFeatureProibida(
      'feature "'+f.id+'" não está na allowlist da política '+pol.policy_version+
      '. Feature entra por lista positiva; adicione à política e versione.');
    porId.set(f.id, f);
  };
  const nova = (id,v) => ({id, valor:v.value, fonte:v.source, confidence:v.confidence});
  const {candidato, empresa, vaga} = ent;

  if(candidato){
    for(const id of EIXO_IDS) por(nova('eixo.'+id, candidato.eixos[id]));
    por(nova('contexto.uf', candidato.uf));
    por(nova('contexto.modelo', candidato.modelos));
    if(candidato.pretensao) por(nova('contexto.pretensao', candidato.pretensao));
    for(const c of candidato.competencias){
      // skill.nivel é família de features: o id do skill vai no valor, não
      // no id da feature, para a allowlist não crescer a cada skill nova.
      const f = nova('skill.nivel', c.nivel);
      if(deny.has('skill.nivel') || !allow.has('skill.nivel'))
        throw new ErroFeatureProibida('feature "skill.nivel" fora da allowlist');
      porId.set('skill.nivel:'+c.skillId, {...f, id:'skill.nivel'});
    }
  }
  if(empresa){ for(const id of EIXO_IDS) por(nova('eixo.'+id, empresa.eixos[id])); }
  if(vaga){
    por({id:'vaga.familia', valor:vaga.familia, fonte:'company', confidence:1});
    por({id:'vaga.faixa', valor:vaga.faixaMax, fonte:'company', confidence:1});
  }
  return {featureSchemaVersion: pol.feature_schema_version, porId};
}

/* Confiança agregada, ponderada pela fonte. Perfil montado por extração
   de currículo vale menos que o mesmo perfil confirmado pela pessoa.   */
function confiancaDe(valores, pol){
  if(!valores.length) return 0;
  const soma = valores.reduce((acc,v)=>{
    const peso = pol.confianca.peso_fonte[v.source] ?? .5;
    return acc + Math.max(0, Math.min(1, v.confidence)) * peso;
  },0);
  return soma / valores.length;
}

/* ══════════════════ 4 · MOTOR ══════════════════
   Função pura. Sem rede, sem banco, sem relógio implícito. Mesma entrada
   e mesmas versões produzem o mesmo resultado.                          */
const clamp = (n,min=0,max=100) => Math.max(min, Math.min(max, n));

function fitTecnico(i){
  const {candidato, vaga, politica} = i;
  const rot = i.rotuloSkill || (id=>id);
  const evidencias = [];

  if(!vaga.requisitos.length){
    return {nota:60, confidence:.3, evidencias:[{kind:'constraint', featureId:'vaga.requisitos',
      reasonCode:'REQ_AUSENTE',
      humano:'A vaga não declarou requisitos, então o técnico não pôde ser avaliado.'}]};
  }

  const tem = new Map(candidato.competencias.map(c=>[c.skillId,c]));
  let ganho=0, total=0, furouObrigatorio=false;

  for(const r of vaga.requisitos){
    total += r.peso;
    const c = tem.get(r.skillId);
    if(!c){
      if(r.obrigatorio) furouObrigatorio = true;
      evidencias.push({kind:'gap', featureId:'skill.nivel',
        reasonCode: r.obrigatorio ? 'REQ_OBRIGATORIO_AUSENTE' : 'REQ_AUSENTE',
        contribution: -r.peso/total,
        humano: r.obrigatorio
          ? 'Requisito obrigatório ausente: '+rot(r.skillId)+'.'
          : 'Requisito desejável ausente: '+rot(r.skillId)+'.'});
      continue;
    }
    const parcial = r.peso * Math.min(1, c.nivel.value/3);
    ganho += parcial;
    evidencias.push({kind:'strength', featureId:'skill.nivel', sourceRef:c.nivel.evidenceRef,
      reasonCode:'REQ_COBERTO', contribution:parcial,
      humano: rot(r.skillId)+' em nível '+c.nivel.value+' de 3.'});
  }

  let nota = Math.round(ganho/total*100);

  // Teto, não média. Se o obrigatório virasse mais um peso, um candidato
  // forte em quatro requisitos e zerado no único obrigatório sairia com ~70
  // e passaria despercebido. A lacuna crítica não pode se diluir.
  if(furouObrigatorio && politica.requisito_obrigatorio.modo==='cap'){
    nota = Math.min(nota, politica.requisito_obrigatorio.nota_maxima);
    evidencias.push({kind:'constraint', featureId:'politica.requisito_obrigatorio',
      reasonCode:'TETO_APLICADO',
      humano:'Nota limitada a '+politica.requisito_obrigatorio.nota_maxima+
        ' por requisito obrigatório não atendido.'});
  }

  const confidence = confiancaDe(candidato.competencias.map(c=>c.nivel), politica);
  return {nota:clamp(nota), confidence, evidencias};
}

function fitCultural(i){
  const {candidato, empresa, politica} = i;
  const fator = politica.cultural.fator_decaimento;

  const porEixo = politica.eixos.map(e=>{
    const cv = candidato.eixos[e.id] ? candidato.eixos[e.id].value : 50;
    const ev = empresa.eixos[e.id] ? empresa.eixos[e.id].value : 50;
    const d = Math.abs(cv-ev);
    const ponto = Math.max(0, 1 - d/(e.tolerancia*fator));
    return {e, d, ponto};
  });

  const nota = Math.round(porEixo.reduce((a,x)=>a+x.ponto,0)/porEixo.length*100);
  const ordenado = [...porEixo].sort((a,b)=>a.ponto-b.ponto);

  const evidencias = ordenado.slice(0,3).map(x=>({
    kind: x.d > x.e.tolerancia ? 'gap' : 'strength',
    featureId:'eixo.'+x.e.id,
    reasonCode: x.d > x.e.tolerancia ? 'EIXO_FORA_TOLERANCIA' : 'EIXO_ALINHADO',
    contribution: x.ponto/porEixo.length,
    humano: x.d > x.e.tolerancia
      ? x.e.nome+': '+x.d+' pontos de distância, acima da tolerância de '+x.e.tolerancia+'.'
      : x.e.nome+': '+x.d+' pontos de distância, dentro da tolerância de '+x.e.tolerancia+'.',
  }));

  const confidence = confiancaDe([
    ...EIXO_IDS.map(id=>candidato.eixos[id]),
    ...EIXO_IDS.map(id=>empresa.eixos[id]),
  ], politica);

  return {nota:clamp(nota), confidence, evidencias, porEixo:ordenado};
}

function fitContexto(i){
  const {candidato, vaga, politica} = i;
  const c = politica.contexto;
  const evidencias=[], notas=[];

  const okLocal = vaga.uf==='BR' || candidato.uf.value===vaga.uf;
  notas.push(okLocal ? c.localidade.compativel : c.localidade.incompativel);
  evidencias.push({kind: okLocal?'strength':'constraint', featureId:'contexto.uf',
    reasonCode: okLocal?'LOCAL_OK':'LOCAL_DIVERGENTE',
    humano: okLocal ? 'Localidade compatível.'
      : 'Vaga em '+vaga.uf+', candidato em '+candidato.uf.value+'.'});

  const okModelo = candidato.modelos.value.includes(vaga.modelo);
  notas.push(okModelo ? c.modelo.compativel : c.modelo.incompativel);
  evidencias.push({kind: okModelo?'strength':'constraint', featureId:'contexto.modelo',
    reasonCode: okModelo?'MODELO_OK':'MODELO_DIVERGENTE',
    humano: okModelo ? 'Modelo '+vaga.modelo+' está nas preferências.'
      : 'Modelo '+vaga.modelo+' fora das preferências declaradas.'});

  if(candidato.pretensao){
    const p = candidato.pretensao.value, teto = vaga.faixaMax;
    const margem = teto*(1+c.pretensao.tolerancia_relativa);
    const nota = p<=teto ? c.pretensao.dentro : p<=margem ? c.pretensao.margem : c.pretensao.fora;
    notas.push(nota);
    evidencias.push({kind: nota===c.pretensao.dentro?'strength':'constraint',
      featureId:'contexto.pretensao',
      reasonCode: nota===c.pretensao.dentro?'PRETENSAO_OK'
        : nota===c.pretensao.margem?'PRETENSAO_MARGEM':'PRETENSAO_FORA',
      humano: nota===c.pretensao.dentro ? 'Pretensão dentro da faixa.'
        : 'Pretensão acima do teto da faixa (R$ '+teto.toLocaleString('pt-BR')+').'});
  }

  const confidence = confiancaDe([candidato.uf, candidato.modelos,
    ...(candidato.pretensao?[candidato.pretensao]:[])], politica);

  return {nota:clamp(Math.round(notas.reduce((a,b)=>a+b,0)/notas.length)), confidence, evidencias};
}

function evaluate(i){
  // Passagem obrigatória pela projeção: garante que feature proibida não
  // chega ao cálculo, mesmo quando o motor for chamado por caminho novo.
  const vetor = projetar({candidato:i.candidato, empresa:i.empresa, vaga:i.vaga}, i.politica);

  const tecnico = fitTecnico(i), cultural = fitCultural(i), contexto = fitContexto(i);
  const w = pesosDe(i.politica, i.vaga.familia);
  const total = Math.round(tecnico.nota*w.tecnico + cultural.nota*w.cultural + contexto.nota*w.contexto);

  // Confiança do conjunto é a MENOR das dimensões, não a média: uma dimensão
  // apoiada em dado fraco contamina a recomendação inteira, e média esconderia.
  const confidence = Math.min(tecnico.confidence, cultural.confidence, contexto.confidence);

  return {tecnico, cultural, contexto, total:clamp(total), confidence, pesos:w,
    features:[...vetor.porId.keys()]};
}

/* ══════════════════ 5 · PORTÃO DE POLÍTICA ══════════════════
   Score nunca é publicado direto. Passa por um portão que pode liberar,
   mandar para revisão humana ou bloquear.                              */
function avaliarPoliticas(r, pol){
  const d=[], conf = pol.confianca;

  if(r.confidence < conf.minima_para_publicar){
    d.push({policyId:'confianca.minima', outcome:'block', reasonCode:'CONFIANCA_ABAIXO_DO_MINIMO'});
  } else if(r.confidence < conf.revisar_abaixo_de){
    d.push({policyId:'confianca.revisao', outcome:'review', reasonCode:'CONFIANCA_EM_FAIXA_DE_REVISAO'});
  } else {
    d.push({policyId:'confianca.minima', outcome:'allow', reasonCode:'CONFIANCA_OK'});
  }

  // Score alto apoiado em lacuna obrigatória é o falso positivo mais caro:
  // gera entrevista que não deveria existir, dos dois lados.
  const furou = r.tecnico.evidencias.some(e=>e.reasonCode==='REQ_OBRIGATORIO_AUSENTE');
  if(furou && r.total >= 60){
    d.push({policyId:'coerencia.obrigatorio', outcome:'review',
      reasonCode:'TOTAL_ALTO_COM_OBRIGATORIO_AUSENTE'});
  }
  return d;
}
const desfechoFinal = d => d.some(x=>x.outcome==='block') ? 'block'
  : d.some(x=>x.outcome==='review') ? 'review' : 'allow';

const RAZAO = {
  CONFIANCA_ABAIXO_DO_MINIMO:'A confiança do conjunto está abaixo do mínimo para publicar. O perfil precisa ser confirmado pela pessoa antes de a recomendação circular.',
  CONFIANCA_EM_FAIXA_DE_REVISAO:'A confiança está na faixa que pede revisão humana. O número aparece, mas com ressalva de que parte do perfil ainda é inferência.',
  CONFIANCA_OK:'Confiança suficiente. Dado confirmado na origem.',
  TOTAL_ALTO_COM_OBRIGATORIO_AUSENTE:'Nota total alta apesar de requisito obrigatório ausente. Vai para revisão para não gerar entrevista que não deveria existir.',
};

/* ══════════════════ 6 · HASH E TRACE ══════════════════ */
function canonico(v){
  if(v===null || typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(canonico).join(',')+']';
  return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonico(v[k])).join(',')+'}';
}
/* FNV-1a em quatro correntes. Só entra quando crypto.subtle não existe
   (file:// em alguns navegadores). Determinístico do mesmo jeito, que é
   a propriedade que o trace precisa: mesma entrada, mesmo hash.        */
function fnv128(s){
  const off=[0x811c9dc5, 0x01000193, 0x9e3779b9, 0x85ebca6b];
  return off.map(seed=>{
    let h = seed>>>0;
    for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193)>>>0; }
    return h.toString(16).padStart(8,'0');
  }).join('');
}
async function hashEntrada(candidato, vaga, empresa, versoes){
  const txt = canonico({candidato, vaga, empresa, versoes});
  if(globalThis.crypto && crypto.subtle){
    try{
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,32);
    }catch(_){ /* contexto não seguro: cai no determinístico local */ }
  }
  return fnv128(txt);
}

async function montarTrace(e){
  const versions = {
    candidateProfile:e.candidato.versao, vacancy:e.vaga.versao,
    taxonomy:e.politica.taxonomy_version, featureSchema:e.politica.feature_schema_version,
    embedding:e.versoes.embedding, reranker:e.versoes.reranker,
    policy:e.politica.policy_version, explanation:e.politica.explanation_version,
  };
  const evidence = [...e.resultado.tecnico.evidencias, ...e.resultado.cultural.evidencias,
    ...e.resultado.contexto.evidencias];
  const geradoEm = new Date(e.generatedAt);
  const expira = new Date(geradoEm.getTime() + (e.validadeHoras ?? 72)*3600000);

  return Object.freeze({
    recommendationId:e.recommendationId,
    candidateId:e.candidato.id, vacancyId:e.vaga.id,
    scores:{technical:e.resultado.tecnico.nota, culture:e.resultado.cultural.nota,
      context:e.resultado.contexto.nota, total:e.resultado.total,
      confidence:Number(e.resultado.confidence.toFixed(4))},
    evidence,
    policyDecisions: avaliarPoliticas(e.resultado, e.politica),
    versions,
    generatedAt:e.generatedAt,
    expiresAt:expira.toISOString(),
    inputHash: await hashEntrada(e.candidato, e.vaga, e.empresa, versions),
  });
}

let _malha=null;
function malha(){
  if(_malha) return _malha;
  const pts=[]; for(let i=0;i<26;i++) pts.push([Math.random()*1200, Math.random()*420]);
  let l='';
  pts.forEach((a,i)=>pts.forEach((b,j)=>{ if(j<=i) return;
    const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(d<178) l+='<line x1="'+a[0].toFixed(0)+'" y1="'+a[1].toFixed(0)+'" x2="'+b[0].toFixed(0)+
      '" y2="'+b[1].toFixed(0)+'" stroke="currentColor" stroke-width="1" opacity="'+
      (0.3-d/700).toFixed(2)+'"/>';}));
  const c=pts.map(p=>'<circle cx="'+p[0].toFixed(0)+'" cy="'+p[1].toFixed(0)+'" r="'+
    (1.8+Math.random()*2).toFixed(1)+'" fill="currentColor" opacity="'+
    (0.22+Math.random()*0.3).toFixed(2)+'"/>').join('');
  _malha='<svg class="malha" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" '+
    'style="color:var(--ac3)" aria-hidden="true">'+l+c+'</svg>';
  return _malha;
}

function skillsDosCargos(cargoIds){
  const s = new Set();
  cargoIds.forEach(id => (CARGO[id]?.sk || []).forEach(x => s.add(x)));

/* ══ parte: partes/js/11-prng.js ══ */
/* ══════════════════ 7b · ALEATÓRIO DETERMINÍSTICO ══════════════════

   Os dados de demonstração são gerados, não escritos à mão, mas precisam
   ser os MESMOS a cada carregamento: sem isso não dá para reproduzir um
   bug de funil, e o dashboard muda de forma a cada F5.

   O mesmo PRNG do core (fixtures.ts), com uma diferença importante: a
   semente vem de uma string, não de um contador. Semente por id significa
   que inserir a vaga 17 não desloca as vagas 18 a 32 — cada item é
   reconstruível isoladamente, e a persistência guarda só o id.          */

function prng(semente){
  let s = semente >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/* FNV-1a: string → semente. Determinística entre execuções e navegadores. */
function sementeDe(str){
  let h = 0x811c9dc5 >>> 0;
  for(let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h >>> 0;
}

const escolher = (r, arr) => arr[Math.floor(r() * arr.length)];
const entre = (r, a, b) => a + Math.floor(r() * (b - a + 1));

/* Sorteio ponderado por `p`. Os pesos não precisam somar 1. */
function sortearPonderado(r, itens){
  const total = itens.reduce((a, x) => a + x.p, 0);
  let k = r() * total;
  for(const x of itens){ k -= x.p; if(k <= 0) return x; }
  return itens[itens.length - 1];
}

/* Embaralha sem mutar a origem, usando o PRNG injetado (nunca Math.random). */
function embaralhar(r, arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(r() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function gerarVaga(n, cargo){
  const vid = 'vaga-' + String(n).padStart(3, '0');
  const r = prng(sementeDe(vid));
  const empK = escolher(r, Object.keys(EMPRESAS));
  const [uf, cidade] = escolher(r, UFS_VAGA);
  const modelo = uf === 'BR' ? 'remoto' : escolher(r, ['presencial','hibrido','hibrido','remoto']);

  const fator = 0.9 + r() * 0.35;
  const faixaMin = Math.round(cargo.base[0] * fator / 100) * 100;
  const faixaMax = Math.round(cargo.base[1] * fator / 100) * 100;

  // 3 a 5 competências do cargo. Peso decrescente, ao menos um obrigatório:
  // sem obrigatório o teto de 45 nunca dispara e metade das telas de portão
  // fica sem dado para mostrar.
  const pool = embaralhar(r, cargo.sk);
  const qtd = Math.min(pool.length, entre(r, 3, 5));
  const requisitos = pool.slice(0, qtd).map((skillId, i) => ({
    skillId,
    peso: i === 0 ? 3 : i <= 2 ? 2 : 1,
    obrigatorio: i === 0 || (i === 1 && r() < 0.5),
  }));

  return {
    id: n, vid, versao:'vaga-v1',
    cargo: cargo.n, cargoId: cargo.id, area: cargo.a,
    emp: empK, familia: familiaDe(cargo), sen: cargo.sen,
    local: uf === 'BR' ? 'Remoto, Brasil' : cidade + ', ' + ROT_MODELO[modelo],
    modelo, uf, faixaMin, faixaMax,
    faixa: 'R$ ' + faixaMin.toLocaleString('pt-BR') + ' a R$ ' + faixaMax.toLocaleString('pt-BR'),
    dias: entre(r, 1, 28), cand: entre(r, 3, 60),
    requisitos,
    tags: requisitos.slice(0, 3).map(x => skillNome(x.skillId)),
    res: RES_AREA[cargo.a](EMPRESAS[empK]),
    faz: requisitos.slice(0, 3).map(x => 'Responder por ' + skillNome(x.skillId).toLowerCase()),
    pede: PEDE_SEN[cargo.sen],
  };
}

/* ══ parte: partes/js/21-fachada.js ══ */
/* ══════════════════ 9 · FACHADA DO MOTOR ══════════════════

   A chave do memo é o ponto mais frágil desta camada, e vale explicar o
   que ela precisa cobrir. O resultado de evaluate() depende de quatro
   coisas: quem é a pessoa, qual é a vaga, como está a empresa e qual
   política está valendo. Se qualquer uma delas mudar e a chave não mudar
   junto, a tela mostra um número desatualizado — plausível, e por isso
   invisível. É a pior classe de bug que este arquivo pode ter.

   A versão anterior usava `vagaId|cand.v|empresa.__v`: sem a pessoa (o
   fit de duas pessoas na mesma vaga colidia), sem a vaga (editar requisito
   não invalidava) e sem a política. Funcionava por acidente, porque todo
   caminho de mutação chamava _memo.clear() — a chave versionada era
   decorativa, e o clear() global jogava fora o cache das 31 vagas a cada
   movimento de slider.                                                   */

const _memo = new Map();
const LIMITE_MEMO = 2000;

/** Versão de uma entidade mutável. */
const vv = e => e.__v || 0;

/** Único lugar que incrementa versão. Nunca faça `x.__v++` solto: a
 *  garantia de invalidação depende de todo caminho passar por aqui. */
function tocar(e){ if(e) e.__v = vv(e) + 1; }

function chaveMatch(pessoa, v){
  const emp = EMPRESAS[v.emp];
  return pessoa.id + '@' + vv(pessoa)
    + '|' + v.vid + '@' + vv(v)
    + '|' + emp.id + '@' + vv(emp)
    + '|' + POLITICA.policy_version;
}

function vagaEntidade(v){
  return {id:v.vid, versao:v.versao, empresaId:EMPRESAS[v.emp].id, familia:v.familia,
    uf:v.uf, modelo:v.modelo, faixaMin:v.faixaMin, faixaMax:v.faixaMax, requisitos:v.requisitos};
}

/** Fit de qualquer pessoa contra qualquer vaga. */
function Mp(pessoa, v){
  const chave = chaveMatch(pessoa, v);
  const emCache = _memo.get(chave);
  if(emCache) return emCache;

  const r = evaluate({candidato:pessoa, vaga:vagaEntidade(v), empresa:EMPRESAS[v.emp],
    politica:POLITICA, rotuloSkill:skillNome});
  r.decisoes = avaliarPoliticas(r, POLITICA);
  r.desfecho = desfechoFinal(r.decisoes);

  // Cada resultado carrega três listas de evidência com strings. Sem teto,
  // uma sessão longa de busca acumula alguns MB sem necessidade.
  if(_memo.size >= LIMITE_MEMO) _memo.clear();
  _memo.set(chave, r);
  return r;
}

/** Fit do candidato logado. Mantém as chamadas existentes intactas. */
const M = v => Mp(S.cand, v);

/** Escape para troca de política em runtime, que muda tudo de uma vez.
 *  Mutação de perfil, vaga ou empresa NÃO precisa disto: passa por tocar()
 *  e a chave já cuida. */
function invalidarMatch(){ _memo.clear(); }

const CHAVE='conectaria.proto.v2';

    }));

function restaurar(){
  let d; try{ d=JSON.parse(localStorage.getItem(CHAVE)||'null'); }catch(_){ return false; }
  if(!d) return false;
  try{
    S.logado=!!d.logado; S.contaEmp=!!d.contaEmp; S.modo=d.modo||'cand';
    S.candidaturas=d.candidaturas||[]; S.empSalvo=!!d.empSalvo; S.comparar=d.comparar||[];
    if(d.skills) S.cand.competencias = d.skills.map(([skillId,n])=>({skillId, nivel:sv(n,'user',1)}));
    if(d.eixosCand) EIXO_IDS.forEach(id=>{ if(d.eixosCand[id]!=null) S.cand.eixos[id]=sv(d.eixosCand[id],'user',1); });

/* Medidor: anel externo é a nota, arco interno é a confiança. Duas
   informações que a plataforma nunca deve mostrar separadas, porque nota
   alta com confiança baixa é exatamente o caso que engana.             */
const R_NOTA=44, R_CONF=35;
const C_NOTA=2*Math.PI*R_NOTA, C_CONF=2*Math.PI*R_CONF;

function medidor(p, conf, grande){
  if(!S.logado) return '<span class="lockw"><span class="lock" title="Crie sua conta para ver">'+
    I.cad+'</span><small>aderência</small></span>';
  const est = p>=70 ? '' : p>=50 ? 'baixa' : 'blk';
  return '<span class="medw"><span class="med '+(grande?'g ':'')+est+'" data-p="'+p+'" data-c="'+
    conf.toFixed(4)+'" style="--circ:'+C_NOTA.toFixed(2)+';--circ2:'+C_CONF.toFixed(2)+'" '+
    'role="img" aria-label="Match '+p+' de 100, confiança '+pc(conf)+'">'+
    '<svg viewBox="0 0 100 100" aria-hidden="true">'+
      '<circle class="tr" cx="50" cy="50" r="'+R_NOTA+'"/>'+
      '<circle class="pr" cx="50" cy="50" r="'+R_NOTA+'"/>'+
      '<circle class="cf" cx="50" cy="50" r="'+R_CONF+'"/>'+
    '</svg><b data-n="'+p+'">0</b></span>'+
    '<small>match · conf '+pc(conf)+'</small></span>';
}

function contar(el, alvo){
  if(reduz()){ el.textContent=alvo; return; }
  const t0=performance.now(), dur=750;
  // Rede de segurança: requestAnimationFrame não roda em aba de segundo
  // plano. Sem isto, quem abre o link numa aba que não está à frente vê
  // "0 vagas" congelado até trocar de aba. O número correto vale mais que
  // a animação.
  const rede = setTimeout(() => { el.textContent = alvo; }, 1400);
  const passo = t => {
    const k = Math.min(1, (t - t0) / dur), eased = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(alvo * eased);
    if(k < 1) requestAnimationFrame(passo);
    else clearTimeout(rede);
  };
  requestAnimationFrame(passo);
}

function animaMed(){
  requestAnimationFrame(()=>$$('.med[data-p]').forEach((el,i)=>setTimeout(()=>{
    const p=+el.dataset.p, c=+el.dataset.c;
    const pr=$('.pr',el), cf=$('.cf',el);
    if(pr) pr.style.strokeDashoffset = (C_NOTA*(1-p/100)).toFixed(2);
    if(cf) cf.style.strokeDashoffset = (C_CONF*(1-c)).toFixed(2);
    const b=$('b',el); if(b) contar(b,p);
  }, 90+i*70)));
}

/* Radar: os 14 eixos de uma vez. Três barras dizem quanto; o radar diz
   onde. É a única leitura em que a forma da distância aparece inteira. */
function radar(cand, emp){
  const n=EIXOS.length, cx=120, cy=116, R=76;
  const ang = i => (Math.PI*2*i/n) - Math.PI/2;
  const pt = (i,v) => [cx+Math.cos(ang(i))*R*(v/100), cy+Math.sin(ang(i))*R*(v/100)];
  const poly = vals => vals.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');

  const vc = EIXOS.map(e=>cand[e.id].value);
  const ve = EIXOS.map(e=>emp[e.id].value);

  const aneis = [25,50,75,100].map(r=>
    '<polygon class="malhaR" points="'+poly(EIXOS.map(()=>r))+'"/>').join('');
  const raios = EIXOS.map((e,i)=>{
    const [x,y]=pt(i,100);
    return '<line class="spoke" x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>';
  }).join('');
  const rots = EIXOS.map((e,i)=>{
    const [x,y]=pt(i,127);
    const a = Math.cos(ang(i));
    const anc = a>0.25?'start':a<-0.25?'end':'middle';
    return '<text class="lbl" x="'+x.toFixed(1)+'" y="'+(y+2.5).toFixed(1)+'" text-anchor="'+anc+'">'+
      esc(e.curto)+'</text>';
  }).join('');
  const pontos = EIXOS.map((e,i)=>{
    const [x,y]=pt(i,vc[i]);
    const d=Math.abs(vc[i]-ve[i]);
    return '<circle class="dotp'+(d>e.tolerancia?' fora':'')+'" cx="'+x.toFixed(1)+'" cy="'+
      y.toFixed(1)+'" r="2" style="--i:'+i+'" data-eixo="'+e.id+'"/>';
  }).join('');

  return '<div class="radarw"><svg class="radar" viewBox="0 0 240 236" role="img" '+
    'aria-label="Radar comparando os 14 eixos do candidato com os da empresa">'+
    aneis+raios+
    '<polygon class="polE" points="'+poly(ve)+'"/>'+
    '<polygon class="polC" points="'+poly(vc)+'"/>'+
    pontos+rots+'</svg></div>'+
    '<div class="radarleg"><span><i></i>você</span><span><i class="e"></i>empresa</span>'+
    '<span style="color:var(--al)">● fora da tolerância</span></div>';
}

/* Sparkline para os KPIs: número sozinho não diz direção. */
function spark(vals){
  const w=120,h=26,max=Math.max(...vals),min=Math.min(...vals),amp=(max-min)||1;
  const px=(v,i)=>[ (i/(vals.length-1))*w, h-((v-min)/amp)*(h-4)-2 ];
  const d=vals.map((v,i)=>px(v,i).map(x=>x.toFixed(1)).join(',')).map((p,i)=>(i?'L':'M')+p).join(' ');
  const fim=px(vals[vals.length-1],vals.length-1);
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<path class="fill" d="'+d+' L'+w+','+h+' L0,'+h+' Z"/><path d="'+d+'"/>'+
    '<circle cx="'+fim[0].toFixed(1)+'" cy="'+fim[1].toFixed(1)+'" r="2.2"/></svg>';
}

/* Revelação escalonada na rolagem. Um observador só, reaproveitado. */
const io = ('IntersectionObserver' in window) ? new IntersectionObserver(ents=>{
  ents.forEach((en,i)=>{ if(en.isIntersecting){
    setTimeout(()=>en.target.classList.add('vis'), i*60);
    io.unobserve(en.target);
  }});
},{rootMargin:'0px 0px -40px 0px'}) : null;
function revelar(escopo){
  if(!io){ $$('.rv',escopo).forEach(el=>el.classList.add('vis')); return; }
  $$('.rv:not(.vis)',escopo).forEach(el=>io.observe(el));
}

function realce(json){
  return esc(json)
    .replace(/&quot;([A-Za-z0-9_]+?)&quot;(\s*:)/g,'<span class="k">&quot;$1&quot;</span>$2')
    .replace(/:\s(&quot;[^&]*?&quot;)/g,': <span class="v">$1</span>')
    .replace(/:\s(-?\d+\.?\d*)/g,': <span class="b">$1</span>')
    .replace(/:\s(true|false|null)/g,': <span class="b">$1</span>');
}

async function responder(txt){
  msg(esc(txt),'eu');
  $('#entrada').innerHTML='';
  const r=ROTEIRO[S.passo];
  S.perfil[r.campo]=txt;
  await espera(430);
  const row=$('#row'+S.passo), val=$('#val'+S.passo);
  row.classList.remove('pend'); row.classList.add('on');
  val.textContent='"'+r.fixa+'"';
  if(!reduz()) val.animate([{opacity:0,transform:'translateX(-6px)'},{opacity:1,transform:'none'}],
    {duration:420,easing:'cubic-bezier(.19,1,.22,1)'});
  const dots=$$('#dots i'), n=Math.round((S.passo+1)/6*16);
  dots.forEach((d,i)=>setTimeout(()=>d.classList.toggle('on',i<n), i*28));
  $('#vetorTxt').textContent=(S.passo+1)+' de 6 dimensões prontas';

      'conversa e não da sua mão, ele entra como <b>inferência</b>: o match aparece, mas '+
      'marcado para revisão até você confirmar.','bot');

  $('#entrada').innerHTML='<button class="btn w" id="fim">Revisar e confirmar meu perfil</button>';

/* Redesenho cirúrgico: só os chips e as sugestões. Redesenhar a view
   inteira a cada tag fazia o input perder o foco, que era bug de UX. */
function repintarSkills(){
  const tem=new Set(S.cand.competencias.map(c=>c.skillId));
  const box=$('#boxSkills'), inp=$('#buscaSkill');
  if(!box) return;
  const foco = document.activeElement===inp, valor = inp ? inp.value : '';
  box.innerHTML = chipsSkill() + '<input id="buscaSkill" placeholder="Buscar outra" '+
    'aria-label="Buscar competência" autocomplete="off" value="'+esc(valor)+'">';
  $('#sugSkill').innerHTML = SKILLS.filter(k=>!tem.has(k.id) &&
      (!valor || k.r.toLowerCase().includes(valor.toLowerCase()))).slice(0,7)
    .map(k=>'<button data-addk="'+k.id+'">+ '+esc(k.r)+'</button>').join('')
    || '<span style="font-size:var(--xs);color:var(--i34)">Nada no catálogo com esse termo. '+
       'Escreva e a curadoria avalia incluir.</span>';
  const novo=$('#buscaSkill');
  if(foco && novo){ novo.focus(); novo.setSelectionRange(valor.length,valor.length); }
  tocar(S.cand); atualizarAlcance(); salvar();
}

function kpi(l,n,d,sp){

  return '<div class="kpi rv"><div class="l">'+l+'</div><div class="n">'+valor+'</div>'+

const FOCAVEIS='a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';

/* Foco preso dentro do modal: sem isso o Tab passeava pela página atrás,
   que é bug clássico de acessibilidade em diálogo. */
function prenderFoco(e){
  if(e.key!=='Tab' || !$('#mbox').classList.contains('on')) return;
  const f=$$(FOCAVEIS,$('#mbox')).filter(x=>x.offsetParent!==null);
  if(!f.length) return;
  const pri=f[0], ult=f[f.length-1];
  if(e.shiftKey && document.activeElement===pri){ e.preventDefault(); ult.focus(); }
  else if(!e.shiftKey && document.activeElement===ult){ e.preventDefault(); pri.focus(); }
}

async function autenticar(via, perfil, btn){
  const rot={google:'Conectando ao Google',linkedin:'Conectando ao LinkedIn',email:'Verificando'};
  const orig=btn.innerHTML; btn.disabled=true;
  btn.innerHTML='<span class="spin"></span>'+rot[via];
  await espera(760);
  btn.innerHTML=orig; btn.disabled=false;
  fecharAcesso();

  if(perfil==='emp'){
    S.modo='emp'; S.contaEmp=true; salvar(); ir(S.empSalvo?'evagas':'perfil');
    toast(via==='email'?'Bem-vindo de volta ao Grupo Aurora.'
      :'Conta da empresa conectada via '+(via==='google'?'Google':'LinkedIn')+'.');
    if(!S.empSalvo) setTimeout(()=>toast('Comece pelo perfil: é ele que alimenta o match.'),3900);
    return;
  }
  S.modo='cand'; S.conta={via};
  if(S.aba==='entrar'){
    // quem já tinha conta tem perfil confirmado: dado de origem 'user'
    S.logado=true; reprojetarFonte('user'); salvar();
    ir('minhas'); toast('Bem-vinda de volta. Seu perfil já está confirmado.');
  } else {
    toast(via==='email'?'Conta criada. Agora vamos montar seu perfil.'
      :'Conta criada via '+(via==='google'?'Google':'LinkedIn')+'. Puxamos o que deu para puxar.');
    ir('triagem');
  }
}

let cmdAberta=false, cmdSel=0, cmdItens=[];

function comandos(){
  const l=[];
  const navs = (S.modo==='emp'&&S.contaEmp)
    ? [['perfil','Perfil da empresa'],['evagas','Suas vagas'],['ecand','Candidaturas'],['edash','Dashboard']]
    : S.logado ? [['home','Vagas abertas'],['minhas','Minhas candidaturas'],['tags','Minhas etiquetas']]
    : [['home','Vagas abertas']];
  navs.forEach(([k,r])=>l.push({g:'Ir para', t:r, ic:I.ch, do:()=>ir(k)}));

  VAGAS.forEach(v=>{
    const m = S.logado ? M(v) : null;
    l.push({g:'Vagas', t:v.cargo, s:EMPRESAS[v.emp].n+' · '+v.local+(m?' · match '+m.total:''),
      ic:I.pin, do:()=>ir('vaga',v.id)});
  });

  if(S.logado){
    l.push({g:'Ações', t:'Comparar vagas selecionadas', s:S.comparar.length+' na seleção',
      ic:I.bal, do:()=>ir('comparar')});
    VAGAS.forEach(v=>l.push({g:'Ações', t:'Ver trace · '+v.cargo, s:'artefato auditável da recomendação',
      ic:I.doc, do:()=>{ir('vaga',v.id); setTimeout(()=>abrirTrace(v.id),300);}}));
  }
  l.push({g:'Ações', t:'Alternar tema claro e escuro', ic:I.esc, kb:'T', do:alternarTema});
  l.push({g:'Ações', t:'Reiniciar o protótipo', s:'apaga o que está salvo neste navegador',
    ic:I.x, do:limparTudo});
  if(S.logado||S.contaEmp) l.push({g:'Ações', t:'Sair da conta', ic:I.x, do:sair});
  else{
    l.push({g:'Ações', t:'Criar conta de candidato', ic:I.pes, do:()=>abrirAcesso('cand','criar')});
    l.push({g:'Ações', t:'Entrar como empresa', ic:I.pre, do:()=>abrirAcesso('emp','entrar')});
  }
  return l;
}
function filtraCmd(q){
  const t=q.trim().toLowerCase();
  const base=comandos();
  if(!t) return base;
  return base.filter(x=>(x.t+' '+(x.s||'')+' '+x.g).toLowerCase().includes(t));
}
function renderCmd(){
  const lst=$('#cmdLst');
  if(!cmdItens.length){
    lst.innerHTML='<div class="vazio">Nada encontrado. Tente o nome de uma vaga ou de uma tela.</div>';
    return;
  }
  let g=null, h='';
  cmdItens.forEach((x,i)=>{
    if(x.g!==g){ g=x.g; h+='<div class="gh">'+esc(g)+'</div>'; }
    h+='<button class="it" role="option" data-i="'+i+'" aria-selected="'+(i===cmdSel)+'">'+
      '<span class="ic">'+x.ic+'</span><span style="min-width:0"><b>'+esc(x.t)+'</b>'+
      (x.s?'<small>'+esc(x.s)+'</small>':'')+'</span>'+
      (x.kb?'<span class="kb">'+x.kb+'</span>':'')+'</button>';
  });
  lst.innerHTML=h;
  const at=$('.it[aria-selected=true]',lst);
  if(at) at.scrollIntoView({block:'nearest'});
}
function abrirCmd(){
  cmdAberta=true; cmdSel=0;
  const c=$('#cmdk'); c.classList.add('on'); c.setAttribute('aria-hidden','false');
  $('#cmdIn').value=''; cmdItens=filtraCmd(''); renderCmd();
  setTimeout(()=>$('#cmdIn').focus(),40);
}
function fecharCmd(){
  cmdAberta=false;
  const c=$('#cmdk'); c.classList.remove('on'); c.setAttribute('aria-hidden','true');
}
function executarCmd(i){
  const x=cmdItens[i]; if(!x) return;
  fecharCmd(); setTimeout(()=>x.do(),60);
}

const NAV={cand:[['home','Vagas'],['minhas','Minhas candidaturas'],['tags','Meu perfil']],

/* Tabela que rola de lado precisa ser alcançável pelo teclado: sem
   tabindex, quem não usa mouse não chega nas colunas da direita. Só marca
   quando de fato transborda, para não criar parada de tab inútil. */
function marcarRolaveis(){
  $$('.tabw').forEach(el=>{
    if(el.scrollWidth > el.clientWidth + 1){
      el.tabIndex=0;
      el.setAttribute('role','region');
      if(!el.hasAttribute('aria-label')) el.setAttribute('aria-label','Tabela, role para os lados');
    } else {
      el.removeAttribute('tabindex'); el.removeAttribute('role'); el.removeAttribute('aria-label');
    }
  });
}
/* a largura muda com a rotação do aparelho, então revisa ao redimensionar */
addEventListener('resize', debounce(marcarRolaveis, 200), {passive:true});

function sair(){
  S.logado=false; S.contaEmp=false; S.conta=null; S.modo='cand';
  S.candidaturas=[]; S.comparar=[]; S.vaga=null;
  S.cand=candidatoNovo('conversation');
  invalidarMatch();  // identidade trocada, não versionada: o cache inteiro sai
  salvar(); ir('home'); toast('Você saiu da conta.');
}

function ir(v,arg){
  if(!PUBLICO.includes(v) && !['triagem','tags'].includes(v)){
    const ehEmp=['perfil','evagas','ecand','edash'].includes(v);
    if(ehEmp && !S.contaEmp){ abrirAcesso('emp','entrar'); return; }
    if(!ehEmp && !S.logado){ abrirAcesso('cand','criar'); return; }
  }
  fecharTrace();
  S.view=v;
  $$('.view').forEach(x=>x.classList.remove('on'));
  $('#v-'+v).classList.add('on');
  REND[v](arg);
  montarNav(); marcarRolaveis(); salvar();

}

/* ══ parte: partes/js/98-eventos.js ══ */
/* ══════════════════ 27 · DELEGAÇÃO DE EVENTOS ══════════════════
   Um listener no documento resolve por data-attribute. Antes, cada render
   reatava dezenas de onclick, o que virava churn de listener a cada tecla. */
const ACOES = {
  v:  el => ir('vaga', Number(el.dataset.v)),
  sug: el => { S.q=el.dataset.sug; const q=$('#q'); if(q) q.value=S.q; renderVagas(); },
  f:  el => { S.filtro=el.dataset.f;
        $$('[data-f]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.f===S.filtro));
        renderVagas(); },
  cmp: el => {
        const id=Number(el.dataset.cmp);
        S.comparar = S.comparar.includes(id) ? S.comparar.filter(x=>x!==id)
          : S.comparar.length>=3 ? (toast('O comparador aceita três vagas por vez.',I.al), S.comparar)
          : [...S.comparar, id];
        salvar(); renderVagas(); },
  addk: el => { S.cand.competencias.push({skillId:el.dataset.addk,
          nivel: sv(2, S.cand.fonte, S.cand.fonte==='user'?1:.8)}); repintarSkills(); },
  rms:  el => { S.cand.competencias = S.cand.competencias.filter(c=>c.skillId!==el.dataset.rms);
          repintarSkills(); },
  niv:  el => { const it=S.cand.competencias.find(c=>c.skillId===el.dataset.niv);
          if(it){ it.nivel = sv(it.nivel.value%3+1, S.cand.fonte,
            S.cand.fonte==='user'?1:.8); repintarSkills(); } },
  ver:  el => ir('vaga', Number(el.dataset.ver)),
  trace: el => abrirTrace(Number(el.dataset.trace)),
  irtags: () => ir('tags'),
};
document.addEventListener('click', e => {
  const it=e.target.closest('.cmdk .it');
  if(it){ executarCmd(Number(it.dataset.i)); return; }
  for(const chave in ACOES){
    const el = e.target.closest('[data-'+chave+']');
    if(el && document.contains(el)){ ACOES[chave](el); return; }
  }
});

/* Invariantes de dados.
   Todas cobrem a mesma classe de falha: dado incoerente que NÃO gera erro.
   Uma área cujo `fam` não existe na política cai no `_padrao` em silêncio —
   o número continua saindo, continua plausível, e está errado. Custa
   milissegundos conferir no carregamento e economiza uma tarde de dúvida. */
function conferirDados(){
  const p = [];
  const fam = POLITICA.pesos_por_familia;

  AREAS.filter(a => !(a.fam in fam))
    .forEach(a => p.push(`área "${a.n}" aponta família "${a.fam}", que não existe na política`));
  CARGOS.filter(c => !(familiaDe(c) in fam))
    .forEach(c => p.push(`cargo "${c.n}" resolve família "${familiaDe(c)}", inexistente`));
  CARGOS.filter(c => c.sk.some(id => !SKILL[id]))
    .forEach(c => p.push(`cargo "${c.n}" cita competência fora do catálogo`));
  VAGAS.filter(v => !(v.familia in fam))
    .forEach(v => p.push(`${v.vid} tem família "${v.familia}", inexistente`));
  VAGAS.filter(v => CARGO[v.cargoId] && v.familia !== familiaDe(CARGO[v.cargoId]))
    .forEach(v => p.push(`${v.vid} declara "${v.familia}" mas o cargo dá "${familiaDe(CARGO[v.cargoId])}"`));
  VAGAS.flatMap(v => v.requisitos.map(r => [v, r]))
    .filter(([, r]) => !SKILL[r.skillId] || ![1, 2, 3].includes(r.peso))
    .forEach(([v, r]) => p.push(`${v.vid} tem requisito inválido (${r.skillId}, peso ${r.peso})`));

  if(p.length){
    console.error('[conectaria] dados incoerentes:\n  ' + p.join('\n  '));
    toast(p.length + ' inconsistência(s) nos dados — veja o console.', I.al);
  }
  return p;
}
